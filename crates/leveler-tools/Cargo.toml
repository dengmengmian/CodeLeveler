[package]
name = "leveler-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Tool trait, registry, JSON-schema validation, and the built-in tools."

[dependencies]
leveler-core = { workspace = true }
leveler-model = { workspace = true }
leveler-execution = { workspace = true }
leveler-context = { workspace = true }
leveler-foreign-session = { workspace = true }
leveler-project = { workspace = true }
leveler-lsp = { workspace = true }
leveler-browser = { workspace = true }
leveler-cua = { workspace = true }
leveler-native = { workspace = true }
leveler-skills = { workspace = true }
leveler-media = { workspace = true }
leveler-vcs = { workspace = true }
ignore = { workspace = true }
globset = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
schemars = { workspace = true }
jsonschema = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
fs2 = { workspace = true }
http = "1"
# Official MCP SDK. HTTP only: stdio stays the in-tree client. reqwest 0.13
# is internal to rmcp and is not shared with this crate's reqwest 0.12.
rmcp = { version = "3.8.0", default-features = false, features = [
    "client",
    "reqwest",
    "transport-streamable-http-client-reqwest",
] }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[target.'cfg(windows)'.dependencies]
cap-std = { workspace = true }
cap-tempfile = { workspace = true }

[dev-dependencies]
leveler-test-support = { workspace = true }
image = { workspace = true }
tempfile = "3"
tokio = { workspace = true }
axum = { workspace = true }
