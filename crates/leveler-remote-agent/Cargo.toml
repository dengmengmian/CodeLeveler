[package]
name = "leveler-remote-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Host-side bridge for remote APP control: verifies signed device frames, enforces the remote capability gate, and forwards to the local runtime."

[dependencies]
leveler-client-protocol = { workspace = true }
leveler-local-transport = { workspace = true }
leveler-remote-protocol = { workspace = true, features = ["policy"] }
leveler-session-wire = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = "0.26"
toml = { workspace = true }

[dev-dependencies]
# `test-util` gives the approval-timeout tests a paused clock, so a two-minute
# window costs no wall clock and does not depend on scheduling luck.
tokio = { workspace = true, features = ["test-util"] }
tokio-util = { workspace = true }
leveler-relay = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
tempfile = "3"
