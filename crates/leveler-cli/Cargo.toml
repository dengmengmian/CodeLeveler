[package]
name = "leveler-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The `leveler` command-line interface."

[features]
default = []
test-crash-barrier = ["leveler-app/test-crash-barrier"]

[[bin]]
name = "leveler"
path = "src/main.rs"

[dependencies]
leveler-core = { workspace = true }
leveler-model = { workspace = true }
leveler-provider = { workspace = true }
leveler-storage = { workspace = true }
leveler-project = { workspace = true }
leveler-schedule = { workspace = true }
leveler-execution = { workspace = true }
leveler-lifecycle = { workspace = true }
leveler-agent = { workspace = true }
leveler-engine = { workspace = true }
leveler-eval = { workspace = true }
leveler-lsp = { workspace = true }
leveler-app = { workspace = true }
leveler-client-protocol = { workspace = true }
leveler-native = { workspace = true }
leveler-local-transport = { workspace = true }
leveler-runtime-host = { workspace = true }
leveler-tui = { workspace = true }
leveler-update = { workspace = true }
leveler-web = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
crossterm = { workspace = true }
toml_edit = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
console = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
tempfile = "3"
base64 = { workspace = true }
iana-time-zone = "0.1"
chrono-tz = "0.10"

[dev-dependencies]
async-trait = { workspace = true }
# Replaying a recorded session renders it through the real TUI (see
# tests/real_session_replay.rs), which needs a headless backend.
ratatui = { workspace = true }
unicode-width = { workspace = true }
leveler-client-protocol = { workspace = true, features = ["testing"] }
leveler-tools = { workspace = true }
futures = { workspace = true }
tempfile = "3"
# The clarification dogfood wires a scripted runtime to the real TUI.
leveler-test-support = { workspace = true }
