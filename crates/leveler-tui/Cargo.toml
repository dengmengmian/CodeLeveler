[package]
name = "leveler-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "CodeLeveler interactive terminal UI (Ratatui/Crossterm): AppState, reducer, composer, screens."

[dependencies]
leveler-definition-trust = { workspace = true }
leveler-core = { workspace = true }
leveler-lifecycle = { workspace = true }
leveler-client-protocol = { workspace = true }
leveler-update = { workspace = true }
leveler-model = { workspace = true }
leveler-skills = { workspace = true }
ratatui = { workspace = true }
ratatui-image = { version = "=8.0.2", default-features = false, features = ["crossterm"] }
image = { workspace = true }
crossterm = { workspace = true }
unicode-width = { workspace = true }
unicode-segmentation = { workspace = true }
textwrap = { workspace = true }
pulldown-cmark = { workspace = true }
syntect = { workspace = true }
two-face = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
toml_edit = { workspace = true }
arboard = "3"
base64 = { workspace = true }
tempfile = "3"

[dev-dependencies]
leveler-tools = { workspace = true, features = ["test-support"] }
leveler-definition-trust = { workspace = true, features = ["test-support"] }
async-trait = { workspace = true }
libc = { workspace = true }
leveler-client-protocol = { workspace = true, features = ["testing"] }
tempfile = "3"
tokio = { workspace = true }
