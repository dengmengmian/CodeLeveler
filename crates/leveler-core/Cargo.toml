[package]
name = "leveler-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Shared stable primitives for CodeLeveler: IDs, time, budgets, base traits."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
schemars = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"

[features]
# Derives `JsonSchema` on the shared id types so the client protocol can export
# JSON Schema artifacts. Off by default: shipped binaries never pay for it.
schema = ["dep:schemars"]
