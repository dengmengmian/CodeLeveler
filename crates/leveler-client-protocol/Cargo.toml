[package]
name = "leveler-client-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Stable client protocol (ClientCommand / RuntimeEvent) between UI clients and the CodeLeveler runtime."

[dependencies]
leveler-core = { workspace = true }
leveler-model = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
schemars = { workspace = true, optional = true }

[features]
# Enables the in-memory MockRuntimeClient for client tests (TUI, integration).
testing = []
# Derives `JsonSchema` on the protocol types and enables the export test that
# keeps `schemas/*.json` in step with them. Off by default: the schemas are a
# build-time contract artifact for non-Rust clients, not a runtime concern.
schema = ["dep:schemars", "leveler-core/schema", "leveler-model/schema"]

[dev-dependencies]
tokio = { workspace = true }
