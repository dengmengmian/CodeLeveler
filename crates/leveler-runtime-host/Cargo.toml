[package]
name = "leveler-runtime-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Shared local runtime lifecycle orchestration for CodeLeveler shells."

[dependencies]
leveler-core = { workspace = true }
