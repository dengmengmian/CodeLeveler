id: c5-e2-history-dependent
name: '[context] every feed adapter describes its own dialect'
repo: fixtures/repos/telemetryd-e2
max_rounds: 160
relevant_paths:
- internal/adapters/registry.go
required_impact_paths:
- internal/adapterspec/spec.go
distractor_paths:
- internal/accounts/accounts.go
forbidden_edit_paths:
- docs/pipeline.md
task: "Platform is building a feed-inventory service and needs every ingest\nadapter to describe its own\
  \ dialect, truthfully.\n\nEach package under `internal/adapters/` normalizes one exporter's feed;\n\
  each has its own rules for blank counts, output ordering, legacy metric\nrenames and unit scaling —\
  \ the rules live in that adapter's code. Add to\nevery adapter a `Snapshot() adapterspec.Summary` that\
  \ reports exactly\nwhat its `Parse` actually does (see `internal/adapterspec` for the field\ncontract).\
  \ Downstream tooling trusts these summaries blindly, so a\nsummary that misstates its adapter's real\
  \ behavior is the worst kind of\nbug.\n\nThen add a `telemetryd inventory` subcommand that prints one\
  \ line per\nadapter, sorted by name:\n\n    <name> fallback=<f> ordering=<o> aliases=<n> scale=<s>\n\
  \nExisting behavior — parsing, reports, every current command — must not\nchange.\n\nDo not change existing\
  \ tests. `go build ./...` and `go test ./...` must pass.\n"
expect:
  program: bash
  args:
  - -c
  - "set -euo pipefail\ngo build ./... > /dev/null\nd=\"$(mktemp -d \"${TMPDIR:-/tmp}/e2.XXXXXX\")\"\n\
    trap 'rm -rf \"$d\"; rm -f internal/adapters/zz_e2_crosscheck_test.go' EXIT\n# Static skeleton of\
    \ the behavior cross-check, base64 to survive every\n# quoting layer between this yaml and the workspace.\n\
    tr -d ' \\n' > \"$d/tpl.b64\" <<'B64'\\n\
    B64\nbase64 -d < \"$d/tpl.b64\" > \"$d/tpl.go\"\nimports=\"\"\nrows=\"\"\nfor a in internal/adapters/feed*/;\
    \ do\n  n=$(basename \"$a\")\n  imports=\"$imports\\t$n \\\"telemetryd/internal/adapters/$n\\\"\\\
    n\"\n  rows=\"$rows\\t{\\\"$n\\\",\\n\\t\\tfunc(in []string) []row {\\n\\t\\t\\tvar out []row\\n\\\
    t\\t\\tfor _, e := range $n.Parse(in) {\\n\\t\\t\\t\\tout = append(out, row{e.Metric, e.Count})\\\
    n\\t\\t\\t}\\n\\t\\t\\treturn out\\n\\t\\t},\\n\\t\\tfunc() (string, string, map[string]string, int64)\
    \ {\\n\\t\\t\\ts := $n.Snapshot()\\n\\t\\t\\treturn s.Fallback, s.Ordering, s.Aliases, s.Scale\\n\\\
    t\\t},\\n\\t},\\n\"\ndone\npython3 - \"$d/tpl.go\" internal/adapters/zz_e2_crosscheck_test.go \"$imports\"\
    \ \"$rows\" <<'PY'\nimport sys\ntpl = open(sys.argv[1]).read()\nimports = sys.argv[3].encode().decode(\"\
    unicode_escape\")\nrows = sys.argv[4].encode().decode(\"unicode_escape\")\nout = tpl.replace(\"IMPORTS_SLOT\"\
    , imports.rstrip(\"\\n\")).replace(\"ROWS_SLOT\", rows)\nopen(sys.argv[2], \"w\").write(out)\nPY\n\
    go test ./internal/adapters/ -run TestEveryAdapterSnapshotIsTruthful -count=1 > /dev/null\ngo build\
    \ -o \"$d/telemetryd\" ./cmd/telemetryd\n\"$d/telemetryd\" inventory > \"$d/inv.txt\"\n[ \"$(wc -l\
    \ < \"$d/inv.txt\")\" -eq 96 ]\ngrep -qE '^feed01 fallback=[a-z_0-9]+ ordering=[a-z_]+ aliases=[0-9]+\
    \ scale=[0-9]+$' \"$d/inv.txt\"\nsort -c \"$d/inv.txt\"\ngit diff --quiet -- docs/pipeline.md\ngo\
    \ test ./... > /dev/null\n"
validity:
  maintained_checks:
  - - go
    - build
    - ./...
  - - go
    - test
    - ./...
  constraints:
    existing_tests_unmodified: true
  semantics:
    status: UNAMBIGUOUS
    critical_observable: Whether every adapter's Snapshot claims match what its Parse actually does, verified
      behaviorally per adapter, plus the exact inventory output shape.
    oracle_interpretation: For each of the 96 adapters the claimed fallback/ordering/aliases/scale are
      cross-checked by driving Parse with discriminating probes; the inventory prints 56 sorted lines
      in the stated format.
    rationale: The task states the truthfulness requirement, points at the Summary field contract, and
      gives the exact output line format. The facts to report are the adapters' own implemented behaviors
      — one reading.
