# MF3 — Invariant propagation: the cache-key contract changes (keys become
# case-insensitive, slash-normalized) and every consumer that touches keys by
# hand must move to the shared normalizer. Fixing key.Normalize alone leaves
# cache.Get, the index dedupe and the stats counter still comparing raw
# strings — the hidden acceptance drives all of them through the binary.
id: mf3-key-invariant
name: "[multifile] asset keys must become case- and slash-insensitive everywhere"
max_rounds: 80
files:
  go.mod: |
    module assetcache

    go 1.21
  key/key.go: |
    package key

    import "strings"

    // Normalize maps a user-supplied asset path to its canonical cache key.
    //
    // CONTRACT (current): keys are compared exactly as written, minus
    // surrounding whitespace.
    func Normalize(path string) string {
    	return strings.TrimSpace(path)
    }
  key/key_test.go: |
    package key

    import "testing"

    func TestNormalizeTrimsWhitespace(t *testing.T) {
    	if got := Normalize("  assets/logo.png "); got != "assets/logo.png" {
    		t.Fatalf("Normalize = %q", got)
    	}
    }
  cache/cache.go: |
    package cache

    import (
    	"strings"

    	"assetcache/key"
    )

    // Cache maps canonical asset keys to their contents.
    type Cache struct {
    	entries map[string][]byte
    }

    func New() *Cache {
    	return &Cache{entries: map[string][]byte{}}
    }

    func (c *Cache) Put(path string, data []byte) {
    	c.entries[key.Normalize(path)] = data
    }

    // Get looks an asset up by path.
    func (c *Cache) Get(path string) ([]byte, bool) {
    	data, ok := c.entries[strings.TrimSpace(path)]
    	return data, ok
    }

    func (c *Cache) Delete(path string) {
    	delete(c.entries, strings.TrimSpace(path))
    }

    func (c *Cache) Len() int {
    	return len(c.entries)
    }
  index/index.go: |
    package index

    import "strings"

    // Unique returns the distinct asset paths, first occurrence wins.
    // Distinctness must follow the cache-key contract.
    func Unique(paths []string) []string {
    	seen := map[string]bool{}
    	var out []string
    	for _, p := range paths {
    		k := strings.TrimSpace(p)
    		if seen[k] {
    			continue
    		}
    		seen[k] = true
    		out = append(out, p)
    	}
    	return out
    }
  stats/stats.go: |
    package stats

    import "strings"

    // DistinctKeys counts how many distinct canonical keys a request log hits.
    func DistinctKeys(requests []string) int {
    	seen := map[string]bool{}
    	for _, r := range requests {
    		seen[strings.TrimSpace(r)] = true
    	}
    	return len(seen)
    }
  cmd/assetcache/main.go: |
    package main

    import (
    	"bufio"
    	"fmt"
    	"os"
    	"strings"

    	"assetcache/cache"
    	"assetcache/index"
    	"assetcache/stats"
    )

    // Reads commands from stdin, one per line:
    //
    //	put <path> <content>
    //	get <path>            -> prints "hit <content>" or "miss"
    //	unique <p1> <p2> ...  -> prints the distinct paths joined by ','
    //	count <p1> <p2> ...   -> prints the distinct-key count
    func main() {
    	c := cache.New()
    	scanner := bufio.NewScanner(os.Stdin)
    	for scanner.Scan() {
    		fields := strings.Fields(scanner.Text())
    		if len(fields) == 0 {
    			continue
    		}
    		switch fields[0] {
    		case "put":
    			c.Put(fields[1], []byte(strings.Join(fields[2:], " ")))
    		case "get":
    			if data, ok := c.Get(fields[1]); ok {
    				fmt.Printf("hit %s\n", data)
    			} else {
    				fmt.Println("miss")
    			}
    		case "unique":
    			fmt.Println(strings.Join(index.Unique(fields[1:]), ","))
    		case "count":
    			fmt.Println(stats.DistinctKeys(fields[1:]))
    		}
    	}
    }
task: |
  We are changing the asset-key contract. Today two spellings of the same
  asset path ("Assets\Logo.PNG" vs "assets/logo.png") are treated as
  different keys, which causes duplicate cache entries, wrong unique-asset
  listings and inflated distinct-key stats on Windows-originated paths.

  New contract: an asset path's canonical key is case-INSENSITIVE, uses
  forward slashes only (backslashes are separators too), and collapses
  repeated slashes. Examples of paths that must all hit the same key:

      assets/logo.png
      Assets\Logo.PNG
      assets//logo.png

  Expected behavior after the change, everywhere keys are produced or
  compared: cache put/get/delete, unique-asset listing (first spelling wins,
  later spellings of the same asset are duplicates), and distinct-key stats.

  Acceptance criteria:
  - `go test ./...` passes and the new contract is covered by tests.
  - The CLI behaves per the new contract end to end.
expect:
  program: bash
  args:
    - "-c"
    - |
      set -euo pipefail
      go test ./... > /dev/null
      d="$(mktemp -d)"
      cp -R . "$d/work"
      cd "$d/work"
      go build -o assetcache ./cmd/assetcache
      out="$(printf 'put Assets\\Logo.PNG v1\nget assets/logo.png\nget assets//LOGO.png\nunique a.css A.CSS b.css\ncount img/x.png img\\X.PNG other.js\n' | ./assetcache)"
      [ "$(sed -n '1p' <<<"$out")" = "hit v1" ]
      [ "$(sed -n '2p' <<<"$out")" = "hit v1" ]
      [ "$(sed -n '3p' <<<"$out")" = "a.css,b.css" ]
      [ "$(sed -n '4p' <<<"$out")" = "2" ]
      # contract locked by tests (the normalizer's tests must have moved with it)
      grep -rqli 'normalize' --include='*_test.go' . > /dev/null
