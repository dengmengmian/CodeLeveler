OF\nmkdir -p \"$(dirname 'textdiff/zz_hidden_test.go')\"\ncat > 'textdiff/zz_hidden_test.go' <<'HIDDEN_EOF'\npackage textdiff\n\nimport (\n\t\"errors\"\n\t\"math/rand\"\n\t\"reflect\"\n\t\"strings\"\n\t\"testing\"\n)\n\nfunc hdr(body string) string { return \"--- a\\n+++ b\\n\" + body }\n\nfunc TestHiddenLinesEmpty(t *testing.T) {\n\tif got := Lines(\"\", \"\"); len(got) != 0 {\n\t\tt.Fatalf(\"Lines(\\\"\\\", \\\"\\\") = %#v, want empty\", got)\n\t}\n\tif got, want := Lines(\"\", \"x\\ny\"), []Op{{Insert, \"x\\n\"}, {Insert, \"y\"}}; !reflect.DeepEqual(got, want) {\n\t\tt.Fatalf(\"got %#v, want %#v\", got, want)\n\t}\n\tif got, want := Lines(\"x\\n\", \"\"), []Op{{Delete, \"x\\n\"}}; !reflect.DeepEqual(got, want) {\n\t\tt.Fatalf(\"got %#v, want %#v\", got, want)\n\t}\n}\n\nfunc TestHiddenLinesNewlineMatters(t *testing.T) {\n\tgot := Lines(\"a\", \"a\\n\")\n\twant := []Op{{Delete, \"a\"}, {Insert, \"a\\n\"}}\n\tif !reflect.DeepEqual(got, want) {\n\t\tt.Fatalf(\"got %#v, want %#v\", got, want)\n\t}\n\tgot = Lines(\"a\\nb\", \"a\\nb\")\n\twant = []Op{{Equal, \"a\\n\"}, {Equal, \"b\"}}\n\tif !reflect.DeepEqual(got, want) {\n\t\tt.Fatalf(\"got %#v, want %#v\", got, want)\n\t}\n}\n\nfunc TestHiddenLinesTieBreak(t *testing.T) {\n\tcases := []struct {\n\t\ta, b string\n\t\twant []Op\n\t}{\n\t\t{\"a\\nb\\n\", \"b\\na\\n\", []Op{{Delete, \"a\\n\"}, {Equal, \"b\\n\"}, {Insert, \"a\\n\"}}},\n\t\t{\"a\\n\", \"a\\na\\n\", []Op{{Equal, \"a\\n\"}, {Insert, \"a\\n\"}}},\n\t\t{\"a\\na\\n\", \"a\\n\", []Op{{Equal, \"a\\n\"}, {Delete, \"a\\n\"}}},\n\t\t{\"a\\nb\\nc\\n\", \"c\\nb\\na\\n\", []Op{{Delete, \"a\\n\"}, {Delete, \"b\\n\"}, {Equal, \"c\\n\"}, {Insert, \"b\\n\"}, {Insert, \"a\\n\"}}},\n\t\t{\"x\\ny\\n\", \"p\\nq\\n\", []Op{{Delete, \"x\\n\"}, {Delete, \"y\\n\"}, {Insert, \"p\\n\"}, {Insert, \"q\\n\"}}},\n\t\t{\"b\\n\", \"a\\nb\\n\", []Op{{Insert, \"a\\n\"}, {Equal, \"b\\n\"}}},\n\t\t{\"a\\nb\\nc\\nd\\n\", \"a\\nc\\nb\\nd\\n\", []Op{{Equal, \"a\\n\"}, {Delete, \"b\\n\"}, {Equal,