n+z\\n\"),\n\t\t\"double marker\":           hdr(\"@@ -1 +1 @@\\n-a\\n+x\\n\" + m + m),\n\t}\n\tfor name, d := range cases {\n\t\t_, err := Apply(orig, d)\n\t\tif !errors.Is(err, ErrMalformed) {\n\t\t\tt.Errorf(\"%s: err = %v, want ErrMalformed\", name, err)\n\t\t}\n\t\tif errors.Is(err, ErrMismatch) {\n\t\t\tt.Errorf(\"%s: err = %v also matches ErrMismatch\", name, err)\n\t\t}\n\t}\n}\n\nfunc TestHiddenApplyMismatch(t *testing.T) {\n\tcases := []struct {\n\t\tname, orig, diff string\n\t}{\n\t\t{\"deleted line differs\", \"a\\nb\\nc\\n\", hdr(\"@@ -2 +2 @@\\n-q\\n+y\\n\")},\n\t\t{\"context line differs\", \"a\\nb\\nc\\n\", hdr(\"@@ -1,2 +1,2 @@\\n z\\n-b\\n+y\\n\")},\n\t\t{\"newline presence differs\", \"a\\nb\", hdr(\"@@ -2 +2 @@\\n-b\\n+y\\n\")},\n\t\t{\"missing newline differs\", \"a\\nb\\n\", hdr(\"@@ -2 +2 @@\\n-b\\n\\\\ No newline at end of file\\n+y\\n\")},\n\t\t{\"start beyond end\", \"a\\nb\\nc\\n\", hdr(\"@@ -10 +10 @@\\n-a\\n+x\\n\")},\n\t\t{\"insertion point beyond end\", \"a\\nb\\nc\\n\", hdr(\"@@ -4,0 +5 @@\\n+x\\n\")},\n\t\t{\"original runs out\", \"a\\nb\\nc\\n\", hdr(\"@@ -3,2 +3,2 @@\\n c\\n-d\\n+x\\n\")},\n\t\t{\"no-newline line followed by original\", \"a\\nb\\n\", hdr(\"@@ -1 +1 @@\\n-a\\n+x\\n\\\\ No newline at end of file\\n\")},\n\t}\n\tfor _, c := range cases {\n\t\t_, err := Apply(c.orig, c.diff)\n\t\tif !errors.Is(err, ErrMismatch) {\n\t\t\tt.Errorf(\"%s: err = %v, want ErrMismatch\", c.name, err)\n\t\t}\n\t\tif errors.Is(err, ErrMalformed) {\n\t\t\tt.Errorf(\"%s: err = %v also matches ErrMalformed\", c.name, err)\n\t\t}\n\t}\n}\nHIDDEN_EOF\nmkdir -p \"$(dirname 'toposort/zz_hidden_test.go')\"\ncat > 'toposort/zz_hidden_test.go' <<'HIDDEN_EOF'\npackage toposort\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n\t\"reflect\"\n\t\"strings\"\n\t\"testing\"\n)\n\nfunc mustParse(t *testing.T, spec string) *Graph {\n\tt.Helper()\n\tg, err := Parse(spec)\n\tif err != nil {\n\t\tt.Fatalf(\"Parse(%q) error: %v\", spec, err)\n\t}\n\tif g == nil {\n\t\tt.Fatalf(\"\
    Parse(%q) returned nil graph\", spec)\n\t}\n\treturn g\n}\n\nfunc eqStrings(t *testing.T, what string, got, want []string) {\n\tt.Helper()\n\tif len(got) == 0 && len(want) == 0 {\n\t\treturn\n\t}\n\tif !reflect.DeepEqual(got, want) {\n\t\tt.Errorf(\"%s = %v, want %v\", what, got, want)\n\t}\n}\n\nfunc TestHiddenParseSemantics(t *testing.T) {\n\tspec := \"# build graph\\n\" +\n\t\t\"\\n\" +\n\t\t\"app: lib util # trailing comment: with colon\\n\" +\n\t\t\"   \\t\\n\" +\n\t\t\"lib: base\\r\\n\" +\n\t\t\"app:\\tlog  lib\\n\" +\n\t\t\"util:\\n\" +\n\t\t\"  # indented comment\\n\" +\n\t\t\"lib: base base\\n\"\n\tg := mustParse(t, spec)\n\teqStrings(t, \"Nodes\", g.Nodes(), []string{\"app\", \"base\", \"lib\", \"log\", \"util\"})\n\teqStrings(t, \"Deps(app)\", g.Deps(\"app\"), []string{\"lib\", \"log\", \"util\"})\n\teqStrings(t, \"Deps(lib)\", g.Deps(\"lib\"), []string{\"base\"})\n\tif got := g.Deps(\"util\"); len(got) != 0 {\n\t\tt.Errorf(\"Deps(util) = %v, want empty\", got)\n\t}\n\tif got := g.Deps(\"base\"); len(got) != 0 {\n\t\tt.Errorf(\"Deps(base) = %v, want empty\", got)\n\t}\n\tif got := g.Deps(\"nope\"); len(got) != 0 {\n\t\tt.Errorf(\"Deps(nope) = %v, want empty\", got)\n\t}\n}\n\nfunc TestHiddenParseEmpty(t *testing.T) {\n\tfor _, spec := range []string{\"\", \"\\n\\n\", \"# only a comment\\n   # another: x: y\\n\"} {\n\t\tg := mustParse(t, spec)\n\t\tif n := g.Nodes(); len(n) != 0 {\n\t\t\tt.Errorf(\"Parse(%q).Nodes() = %v, want empty\", spec, n)\n\t\t}\n\t\to, err := g.Order()\n\t\tif err != nil || len(o) != 0 {\n\t\t\tt.Errorf(\"Parse(%q).Order() = %v, %v; want empty, nil\", spec, o, err)\n\t\t}\n\t\tl, err := g.Levels()\n\t\tif err != nil || len(l) != 0 {\n\t\t\tt.Errorf(\"Parse(%q).Levels() = %v, %v; want empty, nil\", spec, l, err)\n\t\t}\n\t}\n}\n\nfunc TestHiddenParseErrors(t *testing.T) {\n\tcases := []struct {\n\t\tspec string\n\t\tline int\n\t}{\n\t\t{\"a: b\\n\\nnocolon here\\n\", 3},\n\t\t{\"# c\\na: b: c\\n\", 2},\n\t\t{\"a: b\\n: c\\n\", 2},\n\t\t{\"a b: c\\n\", 1},\n\t\t{\"a: b\\n# x\\n\\n  \\n   bad\\n\", 5},\n\t\t{\"ok:\\nx:y:z\\nalso bad\\n\", 2},\n\t}\n\tfor _, c := range cases {\n\t\tg, err := Parse(c.spec)\n\t\tif g != nil {\n\t\t\tt.Errorf(\"Parse(%q) returned non-nil graph with error\", c.spec)\n\t\t}\n\t\tvar pe *ParseError\n\t\tif !errors.As(err, &pe) {\n\t\t\tt.Errorf(\"Parse(%q) error = %v, want *ParseError\", c.spec, err)\n\t\t\tcontinue\n\t\t}\n\t\tif pe.Line != c.line {\n\t\t\tt.Errorf(\"Parse(%q) Line = %d, want %d\", c.spec, pe.Line, c.line)\n\t\t}\n\t\tif prefix := fmt.Sprintf(\"line %d: \", c.line); !strings.HasPrefix(err.Error(), prefix) {\n\t\t\tt.Errorf(\"Parse(%q) Error() = %q, want prefix %q\", c.spec, err.Error(), prefix)\n\t\t}\n\t}\n\t// a colon inside a comment does not count\n\tg := mustParse(t, \"a: b # c: d\\n\")\n\teqStrings(t, \"Nodes\", g.Nodes(), []string{\"a\", \"b\"})\n}\n\nfunc TestHiddenOrderHeapTieBreak(t *testing.T) {\n\t// A level-by-level sort would give [a c b]; Kahn with a min-heap gives [a b c].\n\tg := mustParse(t, \"b: a\\nc:\\na:\\n\")\n\tgot, err := g.Order()\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\teqStrings(t, \"Order\", got, []string{\"a\", \"b\", \"c\"})\n\n\tg = mustParse(t, \"z: y\\ny: x\\nb:\\nx:\\na: z\\n\")\n\tgot, err = g.Order()\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\teqStrings(t, \"Order\", got, []string{\"b\", \"x\", \"y\", \"z\", \"a\"})\n}\n\nfunc TestHiddenOrderStable(t *testing.T) {\n\tg := mustParse(t, \"app: lib util\\nlib: base\\nutil: base\\n\")\n\tfirst, err1 := g.Order()\n\tsecond, err2 := g.Order()\n\tif err1 != nil || err2 != nil || !reflect.DeepEqual(first, second) {\n\t\tt.Fatalf(\"Order not repeatable: %v %v / %v %v\", first, err1, second, err2)\n\t}\n}\n\nfunc TestHiddenOrderLongChain(t *testing.T) {\n\tvar sb strings.Builder\n\tfor i := 0; i < 1000; i++ {\n\t\tfmt.Fprintf(&sb, \"n%04d: n%04d\\n\", i, i+1)\n\t}\n\tg := mustParse(t, sb.String())\n\tgot, err := g.Order()\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif len(got) != 1001 || got[0] != \"n1000\" || got[1000] != \"n0000\" {\n\t\tt.Fatalf(\"chain order wrong: len=%d first=%v last=%v\", len(got), got[:1], got[len(got)-1:])\n\t}\n\tlv, err := g.Levels()\n\tif err != nil || len(lv) != 1001 || lv[1000][0] != \"n0000\" {\n\t\tt.Fatalf(\"chain levels wrong: len=%d err=%v\", len(lv), err)\n\t}\n}\n\nfunc cycleOf(t *testing.T, spec string) *CycleError {\n\tt.Helper()\n\tg := mustParse(t, spec)\n\torder, err := g.Order()\n\tif order != nil {\n\t\tt.Errorf(\"Order(%q) returned non-nil order %v on cycle\", spec, order)\n\t}\n\tvar ce *CycleError\n\tif !errors.As(err, &ce) {\n\t\tt.Fatalf(\"Order(%q) error = %v, want *CycleError\", spec, err)\n\t}\n\treturn ce\n}\n\nfunc TestHiddenCyclePaths(t *testing.T) {\n\tcases := []struct {\n\t\tname, spec string\n\t\twant       []string\n\t}{\n\t\t{\"three cycle\", \"a: b\\nb: c\\nc: a\\n\", []string{\"a\", \"b\", \"c\", \"a\"}},\n\t\t{\"three cycle rotated input\", \"c: a\\nb: c\\na: b\\n\", []string{\"a\", \"b\", \"c\", \"a\"}},\n\t\t{\"self loop\", \"x: x\\n\", []string{\"x\", \"x\"}},\n\t\t{\"smallest node not on cycle\", \"a: b\\nb: c\\nc: b\\n\", []string{\"b\", \"c\", \"b\"}},\n\t\t{\"acyclic part alongside\", \"a: b\\nb: a\\nc:\\n0: c\\n\", []string{\"a\", \"b\", \"a\"}},\n\t\t{\"shortest wins\", \"m: z y\\nz: m\\ny: q\\nq: m\\n\", []string{\"m\", \"z\", \"m\"}},\n\t\t{\"tie picks smaller\", \"a: c b\\nb: a\\nc: a\\n\", []string{\"a\", \"b\", \"a\"}},\n\t\t{\"tie decided early\", \"a: b c\\nb: z\\nc: y\\nz: a\\ny: a\\n\", []string{\"a\", \"b\", \"z\", \"a\"}},\n\t\t{\"self loop vs longer\", \"b: b a\\na: b\\n\", []string{\"a\", \"b\", \"a\"}},\n\t\t{\"self loop shortest\", \"a: b a\\nb: a\\n\", []string{\"a\", \"a\"}},\n\t}\n\tfor _, c := range cases {\n\t\tce := cycleOf(t, c.spec)\n\t\tif !reflect.DeepEqual(ce.Path, c.want) {\n\t\t\tt.Errorf(\"%s: Path = %v, want %v\", c.name, ce.Path, c.want)\n\t\t}\n\t}\n}\n\nfunc TestHiddenCycleErrorMessage(t *testing.T) {\n\tce := cycleOf(t, \"a: b\\nb: c\\nc: a\\n\")\n\tif got, want := ce.Error(), \"cycle: a -> b -> c -> a\"; got != want {\n\t\tt.Fatalf(\"Error() = %q, want %q\", got, want)\n\t}\n}\n\nfunc TestHiddenLevels(t *testing.T) {\n\tg := mustParse(t, \"app: lib util\\nlib: base\\nutil: base\\ntool:\\ndeep: app\\nx: base lib\\n\")\n\tgot, err := g.Levels()\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\twant := [][]string{{\"base\", \"tool\"}, {\"lib\", \"util\"}, {\"app\", \"x\"}, {\"deep\"}}\n\tif !reflect.DeepEqual(got, want) {\n\t\tt.Fatalf(\"Levels = %v, want %v\", got, want)\n\t}\n}\n\nfunc TestHiddenLevelsCycle(t *testing.T) {\n\tspec := \"ok: base\\nq: r\\nr: s\\ns: q\\n\"\n\tg := mustParse(t, spec)\n\tlv, err := g.Levels()\n\tif lv != nil {\n\t\tt.Errorf(\"Levels returned %v on cycle\", lv)\n\t}\n\tvar ce *CycleError\n\tif !errors.As(err, &ce) {\n\t\tt.Fatalf(\"Levels error = %v, want *CycleError\", err)\n\t}\n\tif want := []string{\"q\", \"r\", \"s\", \"q\"}; !reflect.DeepEqual(ce.Path, want) {\n\t\tt.Errorf(\"Levels cycle Path = %v, want %v\", ce.Path, want)\n\t}\n\t_, oerr := g.Order()\n\tvar oce *CycleError\n\tif !errors.As(oerr, &oce) || !reflect.DeepEqual(oce.Path, ce.Path) {\n\t\tt.Errorf(\"Order and Levels cycle paths differ: %v vs %v\", oerr, err)\n\t}\n}\n\nfunc TestHiddenAffected(t *testing.T) {\n\tg := mustParse(t, \"app: lib util\\nlib: base\\nutil: base\\ntool:\\ncli: app\\n\")\n\teqStrings(t, \"Affected(base)\", g.Affected(\"base\"), []string{\"app\", \"base\", \"cli\", \"lib\", \"util\"})\n\teqStrings(t, \"Affected(util)\", g.Affected(\"util\"), []string{\"app\", \"cli\", \"util\"})\n\teqStrings(t, \"Affected(cli)\", g.Affected(\"cli\"), []string{\"cli\"})\n\teqStrings(t, \"Affected(tool, cli, cli)\", g.Affected(\"tool\", \"cli\", \"cli\"), []string{\"cli\", \"tool\"})\n\teqStrings(t, \"Affected(ghost, lib)\", g.Affected(\"ghost\", \"lib\"), []string{\"app\", \"cli\", \"lib\"})\n\tif got := g.Affected(\"ghost\"); len(got) != 0 {\n\t\tt.Errorf(\"Affected(ghost) = %v, want empty\", got)\n\t}\n\tif got := g.Affected(); len(got) != 0 {\n\t\tt.Errorf(\"Affected() = %v, want empty\", got)\n\t}\n}\n\nfunc TestHiddenAffectedWithCycle(t *testing.T) {\n\tg := mustParse(t, \"a: b\\nb: a\\nc: a\\nd: c\\ne:\\n\")\n\teqStrings(t, \"Affected(a)\", g.Affected(\"a\"), []string{\"a\", \"b\", \"c\", \"d\"})\n\teqStrings(t, \"Affected(c)\", g.Affected(\"c\"), []string{\"c\", \"d\"})\n}\nHIDDEN_EOF\nmkdir -p \"$(dirname 'ratewindow/zz_hidden_test.go')\"\ncat > 'ratewindow/zz_hidden_test.go' <<'HIDDEN_EOF'\npackage ratewindow\n\nimport (\n\t\"sync\"\n\t\"sync/atomic\"\n\t\"testing\"\n\t\"time\"\n)\n\ntype hiddenClock struct {\n\tmu sync.Mutex\n\tt  time.Time\n}\n\nfunc newHiddenClock() *hiddenClock { return &hiddenClock{t: time.Unix(1_000_000, 0)} }\n\nfunc (c *hiddenClock) Now() time.Time {\n\tc.mu.Lock()\n\tdefer c.mu.Unlock()\n\treturn c.t\n}\n\n// Set moves the clock to base + d (d may be negative relative to the current value).\nfunc (c *hiddenClock) Set(d time.Duration) {\n\tc.mu.Lock()\n\tdefer c.mu.Unlock()\n\tc.t = time.Unix(1_000_000, 0).Add(d)\n}\n\nfunc hiddenPanicValue(f func()) (v interface{}) {\n\tdefer func() { v = recover() }()\n\tf()\n\treturn nil\n}\n\nfunc TestHiddenNewPanics(t *testing.T) {\n\tc := newHiddenClock()\n\tcases := []struct {\n\t\tname   string\n\t\tlimit  int\n\t\twindow time.Duration\n\t\tnow    func() time.Time\n\t\twant   string\n\t}{\n\t\t{\"zero limit\", 0, time.Second, c.Now, \"ratewindow: limit must be positive\"},\n\t\t{\"negative limit\", -3, time.Second, c.Now, \"ratewindow: limit must be positive\"},\n\t\t{\"zero window\", 1, 0, c.Now, \"ratewindow: window must be positive\"},\n\t\t{\"negative window\", 1, -time.Second, c.Now, \"ratewindow: window must be positive\"},\n\t\t{\"nil clock\", 1, time.Second, nil, \"ratewindow: nil clock\"},\n\t\t{\"limit checked first\", 0, 0, nil, \"ratewindow: limit must be positive\"},\n\t\t{\"window checked before clock\", 1, 0, nil, \"ratewindow: window must be positive\"},\n\t\
    }\n\tfor _, tc := range cases {\n\t\tv := hiddenPanicValue(func() { New(tc.limit, tc.window, tc.now) })\n\t\ts, ok := v.(string)\n\t\tif !ok || s != tc.want {\n\t\t\tt.Errorf(\"%s: panic value = %#v, want string %q\", tc.name, v, tc.want)\n\t\t}\n\t}\n\tif v := hiddenPanicValue(func() { New(1, time.Nanosecond, c.Now) }); v != nil {\n\t\tt.Errorf(\"valid arguments panicked: %v\", v)\n\t}\n}\n\nfunc TestHiddenKeysIndependent(t *testing.T) {\n\tc := newHiddenClock()\n\tl := New(2, time.Minute, c.Now)\n\tif !l.Allow(\"a\") || !l.Allow(\"a\") {\n\t\tt.Fatal(\"first two requests for a should be admitted\")\n\t}\n\tif l.Allow(\"a\") {\n\t\tt.Error(\"third request for a admitted\")\n\t}\n\tif !l.Allow(\"b\") || !l.Allow(\"b\") {\n\t\tt.Error(\"key b affected by key a\")\n\t}\n\tif l.Allow(\"b\") {\n\t\tt.Error(\"third request for b admitted\")\n\t}\n\tif !l.Allow(\"\") {\n\t\tt.Error(\"empty key should be a normal key\")\n\t}\n}\n\nfunc TestHiddenWindowBoundaryIsHalfOpen(t *testing.T) {\n\tc := newHiddenClock()\n\tl := New(1, 10*time.Second, c.Now)\n\tif !l.Allow(\"k\") {\n\t\tt.Fatal(\"first request refused\")\n\t}\n\tc.Set(10*time.Second - time.Nanosecond)\n\tif l.Allow(\"k\") {\n\t\tt.Error(\"request at t+window-1ns admitted; old request should still count\")\n\t}\n\tif got := l.Remaining(\"k\"); got != 0 {\n\t\tt.Errorf(\"Remaining at t+window-1ns = %d, want 0\", got)\n\t}\n\tc.Set(10 * time.Second)\n\tif got := l.Remaining(\"k\"); got != 1 {\n\t\tt.Errorf(\"Remaining at exactly t+window = %d, want 1\", got)\n\t}\n\tif !l.Allow(\"k\") {\n\t\tt.Error(\"request at exactly t+window refused; old request should have left the window\")\n\t}\n}\n\nfunc TestHiddenSlidingNotFixedBuckets(t *testing.T) {\n\tc := newHiddenClock()\n\tl := New(2, 10*time.Second, c.Now)\n\tsteps := []struct {\n\t\tat   time.Duration\n\t\twant bool\n\t}{\n\t\t{0, true},\n\t\t{6 * time.Second, true},\n\t\t{9 * time.Second, false},\n\t\t{10 * time.Second, true},  // request at 0 left\n\t\t{15 * time.Second, false}, // 6 and 10 still in window\n\t\t{16 * time.Second, true},  // 6 left\n\t\t{19 * time.Second, false}, // 10 and 16 in window\n\t\t{26 * time.Second, true},  // 10 and 16 left at 20 and 26\n\t\t{26 * time.Second, true},\n\t\t{26 * time.Second, false},\n\t}\n\tfor i, s := range steps {\n\t\tc.Set(s.at)\n\t\tif got := l.Allow(\"k\"); got != s.want {\n\t\t\tt.Errorf(\"step %d at %v: Allow = %v, want %v\", i, s.at, got, s.want)\n\t\t}\n\t}\n}\n\nfunc TestHiddenReserveExactRetryAfter(t *testing.T) {\n\tc := newHiddenClock()\n\tl := New(2, 10*time.Second, c.Now)\n\tif ok, d := l.Reserve(\"k\"); !ok || d != 0 {\n\t\tt.Fatalf(\"Reserve at 0 = (%v, %v), want (true, 0)\", ok, d)\n\t}\n\tc.Set(3 * time.Second)\n\tif ok, d := l.Reserve(\"k\"); !ok || d != 0 {\n\t\tt.Fatalf(\"Reserve at 3s = (%v, %v), want (true, 0)\", ok, d)\n\t}\n\tc.Set(5 * time.Second)\n\tif ok, d := l.Reserve(\"k\"); ok || d != 5*time.Second {\n\t\tt.Errorf(\"Reserve at 5s = (%v, %v), want (false, 5s)\", ok, d)\n\t}\n\tc.Set(9*time.Second + 500*time.Millisecond)\n\tif ok, d := l.Reserve(\"k\"); ok || d != 500*time.Millisecond {\n\t\tt.Errorf(\"Reserve at 9.5s = (%v, %v), want (false, 500ms)\", ok, d)\n\t}\n\tc.Set(10*time.Second - time.Nanosecond)\n\tif ok, d := l.Reserve(\"k\"); ok || d != time.Nanosecond {\n\t\tt.Errorf(\"Reserve at 10s-1ns = (%v, %v), want (false, 1ns)\", ok, d)\n\t}\n\t// Refusals recorded nothing: at 10s the request from 0 has left, leaving one slot.\n\tc.Set(10 * time.Second)\n\tif ok, d := l.Reserve(\"k\"); !ok || d != 0 {\n\t\tt.Errorf(\"Reserve at 10s = (%v, %v), want (true, 0)\", ok, d)\n\t}\n\t// Now 3s and 10s are in the window; oldest (3s) leaves at 13s.\n\tc.Set(11 * time.Second)\n\tif ok, d := l.Reserve(\"k\"); ok || d != 2*time.Second {\n\t\tt.Errorf(\"Reserve at 11s = (%v, %v), want (false, 2s)\", ok, d)\n\t}\n\t// Allow and Reserve share the same log.\n\tif l.Allow(\"k\") {\n\t\tt.Error(\"Allow admitted while Reserve refuses\")\n\t}\n}\n\nfunc TestHiddenRemaining(t *testing.T) {\n\tc := newHiddenClock()\n\tl := New(3, time.Minute, c.Now)\n\tif got := l.Remaining(\"new\"); got != 3 {\n\t\tt.Errorf(\"Remaining for unseen key = %d, want 3\", got)\n\t}\n\tif got := l.Len(); got != 0 {\n\t\tt.Errorf(\"Remaining started tracking a key: Len = %d, want 0\", got)\n\t}\n\tfor i := 0; i < 5; i++ {\n\t\tif got := l.Remaining(\"k\"); got != 3 {\n\t\t\tt.Fatalf(\"repeated Remaining consumed capacity: got %d, want 3\", got)\n\t\t}\n\t}\n\tl.Allow(\"k\")\n\tc.Set(20 * time.Second)\n\tl.Allow(\"k\")\n\tif got := l.Remaining(\"k\"); got != 1 {\n\t\tt.Errorf(\"Remaining after 2 = %d, want 1\", got)\n\t}\n\tl.Allow(\"k\")\n\tl.Allow(\"k\") // refused\n\tif got := l.Remaining(\"k\"); got != 0 {\n\t\tt.Errorf(\"Remaining when full = %d, want 0\", got)\n\t}\n\tc.Set(time.Minute)\n\tif got := l.Remaining(\"k\"); got != 1 {\n\t\tt.Errorf(\"Remaining after first request expired = %d, want 1\", got)\n\t}\n\tc.Set(20*time.Second + time.Minute)\n\tif got := l.Remaining(\"k\"); got != 3 {\n\t\tt.Errorf(\"Remaining after all expired = %d, want 3\", got)\n\t}\n}\n\nfunc TestHiddenForget(t *testing.T) {\n\tc := newHiddenClock()\n\tl := New(1, time.Hour, c.Now)\n\tl.Allow(\"a\")\n\tl.Allow(\"b\")\n\tif l.Allow(\"a\") {\n\t\tt.Fatal(\"a should be full\")\n\t}\n\tl.Forget(\"a\")\n\tif got := l.Len(); got != 1 {\n\t\tt.Errorf(\"Len after Forget(a) = %d, want 1\", got)\n\t}\n\tif got := l.Remaining(\"a\"); got != 1 {\n\t\tt.Errorf(\"Remaining(a) after Forget = %d, want 1\", got)\n\t}\n\tif !l.Allow(\"a\") {\n\t\tt.Error(\"a refused after Forget\")\n\t}\n\tl.Forget(\"never-seen\")\n\tif got := l.Len(); got != 2 {\n\t\tt.Errorf(\"Forget of untracked key changed Len to %d, want 2\", got)\n\t}\n\tif l.Allow(\"b\") {\n\t\tt.Error(\"Forget(a) or Forget(never-seen) affected b\")\n\t}\n}\n\nfunc TestHiddenSweepAndLen(t *testing.T) {\n\tc := newHiddenClock()\n\tl := New(1, 10*time.Second, c.Now)\n\tif got := l.Len(); got != 0 {\n\t\tt.Fatalf(\"Len of new limiter = %d, want 0\", got)\n\t}\n\tl.Allow(\"a\") // at 0\n\tc.Set(5 * time.Second)\n\tl.Allow(\"b\") // at 5\n\tl.Allow(\"b\") // refused; must not add anything\n\tif got := l.Len(); got != 2 {\n\t\tt.Errorf(\"Len = %d, want 2\", got)\n\t}\n\tc.Set(12 * time.Second)\n\tif got := l.Len(); got != 2 {\n\t\tt.Errorf(\"expiry alone untracked a key: Len = %d, want 2\", got)\n\t}\n\tl.Sweep()\n\tif got := l.Len(); got != 1 {\n\t\tt.Errorf(\"Len after Sweep at 12s = %d, want 1\", got)\n\t}\n\tif l.Allow(\"b\") {\n\t\tt.Error(\"Sweep dropped history of a key still in its window\")\n\t}\n\tc.Set(15 * time.Second)\n\tl.Sweep()\n\tif got := l.Len(); got != 0 {\n\t\tt.Errorf(\"Len after Sweep at exactly 5s+window = %d, want 0\", got)\n\t}\n\tif !l.Allow(\"b\") {\n\t\tt.Error(\"b refused after its request expired\")\n\t}\n\tif got := l.Len(); got != 1 {\n\t\tt.Errorf(\"Len after re-admitting b = %d, want 1\", got)\n\t}\n}\n\nfunc TestHiddenClockBackwardsNeverAdmitsExtra(t *testing.T) {\n\tc := newHiddenClock()\n\tl := New(2, 10*time.Second, c.Now)\n\tc.Set(10 * time.Second)\n\tif !l.Allow(\"k\") || !l.Allow(\"k\") {\n\t\tt.Fatal(\"initial requests refused\")\n\t}\n\tc.Set(0) // clock jumps back 10s\n\tif l.Allow(\"k\") {\n\t\tt.Error(\"backwards clock admitted an extra request\")\n\t}\n\tif ok, d := l.Reserve(\"k\"); ok || d != 10*time.Second {\n\t\tt.Errorf(\"Reserve after backwards jump = (%v, %v), want (false, 10s) measured from the effective time\", ok, d)\n\t}\n\tif got := l.Remaining(\"k\"); got != 0 {\n\t\tt.Errorf(\"Remaining after backwards jump = %d, want 0\", got)\n\t}\n\tc.Set(-time.Hour)\n\tif l.Allow(\"k\") {\n\t\tt.Error(\"large backwards jump admitted a request\")\n\t}\n\tc.Set(19 * time.Second)\n\tif ok, d := l.Reserve(\"k\"); ok || d != time.Second {\n\t\tt.Errorf(\"Reserve at 19s = (%v, %v), want (false, 1s)\", ok, d)\n\t}\n\tc.Set(20 * time.Second)\n\tif !l.Allow(\"k\") {\n\t\tt.Error(\"request at 20s refused\")\n\t}\n}\n\nfunc TestHiddenClockBackwardsDoesNotExpireEarlyOrRecordRawTime(t *testing.T) {\n\tc := newHiddenClock()\n\tl := New(2, 10*time.Second, c.Now)\n\t// Advance the effective time to 100s through another key and another method.\n\tc.Set(100 * time.Second)\n\tif got := l.Remaining(\"probe\"); got != 2 {\n\t\tt.Fatalf(\"Remaining(probe) = %d, want 2\", got)\n\t}\n\tc.Set(50 * time.Second)\n\tif !l.Allow(\"y\") || !l.Allow(\"y\") {\n\t\tt.Fatal(\"y requests refused\")\n\t}\n\t// If y were recorded at raw 50s they would be expired at 105s.\n\tc.Set(105 * time.Second)\n\tif got := l.Remaining(\"y\"); got != 0 {\n\t\tt.Errorf(\"Remaining(y) at 105s = %d, want 0 (admissions recorded at effective time 100s)\", got)\n\t}\n\tif ok, d := l.Reserve(\"y\"); ok || d != 5*time.Second {\n\t\tt.Errorf(\"Reserve(y) at 105s = (%v, %v), want (false, 5s)\", ok, d)\n\t}\n\t// Sweep also uses the effective time: going back must not drop y.\n\tc.Set(0)\n\tl.Sweep()\n\tif got := l.Len(); got != 1 {\n\t\tt.Errorf(\"Len after Sweep with backwards clock = %d, want 1\", got)\n\t}\n\tc.Set(110 * time.Second)\n\tl.Sweep()\n\tif got := l.Len(); got != 0 {\n\t\tt.Errorf(\"Len after Sweep at 110s = %d, want 0\", got)\n\t}\n}\n\nfunc TestHiddenConcurrentExactAdmissions(t *testing.T) {\n\tfrozen := time.Unix(42, 0)\n\tconst limit = 50\n\tl := New(limit, time.Minute, func() time.Time { return frozen })\n\tkeys := []string{\"x\", \"y\", \"z\"}\n\tcounts := make([]int64, len(keys))\n\tvar wg sync.WaitGroup\n\tfor g := 0; g < 64; g++ {\n\t\twg.Add(1)\n\t\tgo func(g int) {\n\t\t\tdefer wg.Done()\n\t\t\tfor i := 0; i < 100; i++ {\n\t\t\t\tk := (g + i) % len(keys)\n\t\t\t\tif i%3 == 0 {\n\t\t\t\t\tif ok, d := l.Reserve(keys[k]); ok {\n\t\t\t\t\t\tatomic.AddInt64(&counts[k], 1)\n\t\t\t\t\t} else if d != time.Minute {\n\t\t\t\t\t\tt.Errorf(\"concurrent Reserve retryAfter = %v, want 1m\", d)\n\t\t\t\t\t}\n\t\t\t\t} else if l.Allow(keys[k]) {\n\t\t\t\t\tatomic.AddInt64(&counts[k], 1)\n\t\t\t\t}\n\t\t\t\t_ = l.Remaining(keys[k])\n\t\t\t\t_ = l.Len()\n\t\t\t\tif i%10\
    \ == 0 {\n\t\t\t\t\tl.Sweep()\n\t\t\t\t}\n\t\t\t}\n\t\t}(g)\n\t}\n\twg.Wait()\n\tfor i, k := range keys {\n\t\tif counts[i] != limit {\n\t\t\tt.Errorf(\"key %q: %d admissions, want exactly %d\", k, counts[i], limit)\n\t\t}\n\t\tif got := l.Remaining(k); got != 0 {\n\t\t\tt.Errorf(\"key %q: Remaining = %d, want 0\", k, got)\n\t\t}\n\t}\n\tif got := l.Len(); got != len(keys) {\n\t\tt.Errorf(\"Len = %d, want %d\", got, len(keys))\n\t}\n}\nHIDDEN_EOF\nmkdir -p \"$(dirname 'glob/zz_hidden_test.go')\"\ncat > 'glob/zz_hidden_test.go' <<'HIDDEN_EOF'\npackage glob\n\nimport (\n\t\"errors\"\n\t\"strings\"\n\t\"sync\"\n\t\"testing\"\n)\n\ntype hiddenCase struct {\n\tpattern string\n\tpath    string\n\twant    bool\n}\n\nfunc hiddenRun(t *testing.T, cases []hiddenCase) {\n\tt.Helper()\n\tfor _, c := range cases {\n\t\tg, err := Compile(c.pattern)\n\t\tif err != nil {\n\t\t\tt.Errorf(\"Compile(%q) error: %v\", c.pattern, err)\n\t\t\tcontinue\n\t\t}\n\t\tif g == nil {\n\t\t\tt.Errorf(\"Compile(%q) returned nil Glob without error\", c.pattern)\n\t\t\tcontinue\n\t\t}\n\t\tif got := g.Match(c.path); got != c.want {\n\t\t\tt.Errorf(\"Compile(%q).Match(%q) = %v, want %v\", c.pattern, c.path, got, c.want)\n\t\t}\n\t}\n}\n\nfunc TestHiddenLiteralsAndAnchoring(t *testing.T) {\n\thiddenRun(t, []hiddenCase{\n\t\t{\"abc\", \"abc\", true},\n\t\t{\"abc\", \"ab\", false},\n\t\t{\"abc\", \"abcd\", false},\n\t\t{\"abc\", \"xabc\", false},\n\t\t{\"a/b\", \"a/b\", true},\n\t\t{\"a/b\", \"a/b/c\", false},\n\t\t{\"a\", \"a/\", false},\n\t\t{\"]\", \"]\", true},\n\t\t{\"a,b\", \"a,b\", true},\n\t\t{\"héllo\", \"héllo\", true},\n\t})\n}\n\nfunc TestHiddenStar(t *testing.T) {\n\thiddenRun(t, []hiddenCase{\n\t\t{\"*\", \"\", true},\n\t\t{\"*\", \"anything\", true},\n\t\t{\"*\", \"a/b\", false},\n\t\t{\"*.go\", \"main.go\", true},\n\t\t{\"*.go\", \".go\", true},\n\t\t{\"*.go\", \"dir/main.go\", false},\n\t\t{\"*\", \".hidden\", true},\n\t\t{\"a*b*c\", \"abc\", true},\n\t\t{\"a*b*c\", \"aXXbYYc\", true},\n\t\t{\"a*b*c\", \"aXXbYY\", false},\n\t\t{\"*/*\", \"a/b\", true},\n\t\t{\"*/*\", \"a\", false},\n\t\t{\"*/*\", \"a/b/c\", false},\n\t\t{\"a*\", \"a/\", false},\n\t})\n}\n\nfunc TestHiddenQuestionIsOneRune(t *testing.T) {\n\thiddenRun(t, []hiddenCase{\n\t\t{\"a?c\", \"abc\", true},\n\t\t{\"a?c\", \"ac\", false},\n\t\t{\"a?c\", \"abbc\", false},\n\t\t{\"a?c\", \"a/c\", false},\n\t\t{\"?\", \"é\", true},\n\t\t{\"??\", \"é\", false},\n\t\t{\"?\", \"日\", true},\n\t\t{\"a?\", \"a\", false},\n\t})\n}\n\nfunc TestHiddenCharacterClasses(t *testing.T) {\n\thiddenRun(t, []hiddenCase{\n\t\t{\"[abc]\", \"b\", true},\n\t\t{\"[abc]\", \"d\", false},\n\t\t{\"[abc]\", \"\", false},\n\t\t{\"[abc]\", \"ab\", false},\n\t\t{\"[a-z]x\", \"mx\", true},\n\t\t{\"[a-z]\", \"M\", false},\n\t\t{\"[a-cx-z]\", \"y\", true},\n\t\t{\"[a-cx-z]\", \"d\", false},\n\t\t{\"[!a]\", \"b\", true},\n\t\t{\"[!a]\", \"a\", false},\n\t\t{\"[^a]\", \"b\", true},\n\t\t{\"[^a]\", \"a\", false},\n\t\t{\"[!a-z]\", \"5\", true},\n\t\t{\"[!a]\", \"\", false},\n\t\t{\"[-a]\", \"-\", true},\n\t\t{\"[a-]\", \"-\", true},\n\t\t{\"[a-]\", \"b\", false},\n\t\t{\"[!-]\", \"-\", false},\n\t\t{\"[\\\\]]\", \"]\", true},\n\t\t{\"[a\\\\-z]\", \"-\", true},\n\t\t{\"[a\\\\-z]\", \"m\", false},\n\t\t{\"[*?{},[]\", \"{\", true},\n\t\t{\"[*?{},[]\", \"[\", true},\n\t\t{\"[*?{},[]\", \"x\", false},\n\t\t{\"[α-ω]\", \"λ\", true},\n\t\t{\"[α-ω]\", \"a\", false},\n\t\t{\"[!α]\", \"日\", true},\n\t})\n}\n\nfunc TestHiddenEscapes(t *testing.T) {\n\thiddenRun(t, []hiddenCase{\n\t\t{\"\\\\*\", \"*\", true},\n\t\t{\"\\\\*\", \"a\", false},\n\t\t{\"\\\\?\", \"?\", true},\n\t\t{\"\\\\?\", \"x\", false},\n\t\t{\"\\\\[a]\", \"[a]\", true},\n\t\t{\"\\\\[a]\", \"a\", false},\n\t\t{\"\\\\{a,b\\\\}\", \"{a,b}\", true},\n\t\t{\"\\\\{a,b\\\\}\", \"a\", false},\n\t\t{\"a\\\\\\\\b\", \"a\\\\b\", true},\n\t\t{\"\\\\a\", \"a\", true},\n\t\t{\"*\\\\*\", \"abc*\", true},\n\t\t{\"*\\\\*\", \"abc\", false},\n\t\t{\"\\\\**\", \"*abc\", true},\n\t\t{\"\\\\**\", \"abc\", false},\n\t})\n}\n\nfunc TestHiddenBraces(t *testing.T) {\n\thiddenRun(t, []hiddenCase{\n\t\t{\"{a,b,c}\", \"b\", true},\n\t\t{\"{a,b,c}\", \"d\", false},\n\t\t{\"{a,b,c}\", \"ab\", false},\n\t\t{\"x{,y}z\", \"xz\", true},\n\t\t{\"x{,y}z\", \"xyz\", true},\n\t\t{\"x{,y}z\", \"xyyz\", false},\n\t\t{\"{a,}\", \"\", true},\n\t\t{\"{}\", \"\", true},\n\t\t{\"{}\", \"a\", false},\n\t\t{\"a{}b\", \"ab\", true},\n\t\t{\"{a}\", \"a\", true},\n\t\t{\"{a,b{c,d}}e\", \"ae\", true},\n\t\t{\"{a,b{c,d}}e\", \"bce\", true},\n\t\t{\"{a,b{c,d}}e\", \"bde\", true},\n\t\t{\"{a,b{c,d}}e\", \"be\", false},\n\t\t{\"{a,{b,{c,{d}}}}\", \"d\", true},\n\t\t{\"{a,{b,{c,{d}}}}\", \"e\", false},\n\t\t{\"*.{go,rs}\", \"main.rs\", true},\n\t\t{\"*.{go,rs}\", \"main.py\", false},\n\t\t{\"{*.go,test_*}\", \"test_x.py\", true},\n\t\t{\"{*.go,test_*}\", \"x.py\", false},\n\t\t{\"{[,],x}\", \",\", true},\n\t\t{\"{[,],x}\", \"x\", true},\n\t\t{\"{[,],x}\", \"]\", false},\n\t\t{\"{a\\\\,b,c}\", \"a,b\", true},\n\t\t{\"{a\\\\,b,c}\", \"b\", false},\n\t\t{\"src/{cmd,pkg}/*.go\", \"src/pkg/x.go\", true},\n\t\t{\"src/{cmd,pkg}/*.go\", \"src/lib/x.go\", false},\n\t\t{\"*{*}\", \"abc\", true},\n\t\t{\"*{*}\", \"a/c\", false},\n\t\t{\"{?,??}\", \"日本\", true},\n\t\t{\"{?,??}\", \"abc\", false},\n\t})\n}\n\nfunc TestHiddenDoubleStar(t *testing.T) {\n\thiddenRun(t, []hiddenCase{\n\t\t{\"**\", \"\", true},\n\t\t{\"**\", \"a\", true},\n\t\t{\"**\", \"a/b/c\", true},\n\t\t{\"**\", \"/\", true},\n\t\t{\"**/b\", \"b\", true},\n\t\t{\"**/b\", \"x/y/b\", true},\n\t\t{\"**/b\", \"x/y/ab\", false},\n\t\t{\"**/b\", \"b/x\", false},\n\t\t{\"a/**/b\", \"a/b\", true},\n\t\t{\"a/**/b\", \"a/x/b\", true},\n\t\t{\"a/**/b\", \"a/x/y/b\", true},\n\t\t{\"a/**/b\", \"a/xb\", false},\n\t\t{\"a/**/b\", \"a/b/c\", false},\n\t\t{\"a/**/b\", \"x/a/b\", false},\n\t\t{\"a/**\", \"a\", true},\n\t\t{\"a/**\", \"a/\", true},\n\t\t{\"a/**\", \"a/x\", true},\n\t\t{\"a/**\", \"a/x/y\", true},\n\t\t{\"a/**\", \"ab\", false},\n\t\t{\"a/**\", \"b/a\", false},\n\t\t{\"a/**/b/**/c\", \"a/b/c\", true},\n\t\t{\"a/**/b/**/c\", \"a/x/b/y/z/c\", true},\n\t\t{\"a/**/b/**/c\", \"a/b/b/b/c\", true},\n\t\t{\"a/**/b/**/c\", \"a/c\", false},\n\t\t{\"**/**/x\", \"x\", true},\n\t\t{\"**/**/x\", \"p/q/x\", true},\n\t\t{\"a/**/*.go\", \"a/main.go\", true},\n\t\t{\"a/**/*.go\", \"a/b/c/main.go\", true},\n\t\t{\"a/**/*.go\", \"a/b/c/main.rs\", false},\n\t\t{\"**/{cmd,pkg}/**\", \"x/pkg\", true},\n\t\t{\"**/{cmd,pkg}/**\", \"x/pkg/y/z\", true},\n\t\t{\"**/{cmd,pkg}/**\", \"x/lib/y\", false},\n\t\t{\"a/**/b\", \"a//b\", true},\n\t})\n}\n\nfunc TestHiddenEmptySegments(t *testing.T) {\n\thiddenRun(t, []hiddenCase{\n\t\t{\"\", \"\", true},\n\t\t{\"\", \"a\", false},\n\t\t{\"\", \"/\", false},\n\t\t{\"a/*/b\", \"a//b\", true},\n\t\t{\"a//b\", \"a//b\", true},\n\t\t{\"a//b\", \"a/b\", false},\n\t\t{\"a/\", \"a/\", true},\n\t\t{\"a/\", \"a\", false},\n\t\t{\"/a\", \"/a\", true},\n\t\t{\"/a\", \"a\", false},\n\t\t{\"*/a\", \"/a\", true},\n\t\t{\"a/*\", \"a/\", true},\n\t\t{\"a/?\", \"a/\", false},\n\t})\n}\n\nfunc TestHiddenBadPatterns(t *testing.T) {\n\tbad := []string{\n\t\t\"a**\", \"**b\", \"a/***\", \"***\", \"{**}\", \"{a,**}\", \"a/**b/c\", \"x/a**/y\", \"**.go\",\n\t\t\"[abc\", \"[\", \"[\\\\]\", \"[a-\", \"{a,b\", \"{a,{b}\", \"{\", \"a/{b\",\n\t\t\"[]\", \"[!]\", \"[^]\",\n\t\t\"[z-a]\", \"[b-a]\",\n\t\t\"a}\", \"}\", \"{a}}\",\n\t\t\"a\\\\\", \"\\\\\",\n\t\t\"[/]\", \"[a/]\", \"[!/]\", \"{a/b,c}\", \"{a,b/c}\", \"a\\\\/b\", \"[\\\\/]\",\n\t}\n\tfor _, p := range bad {\n\t\tg, err := Compile(p)\n\t\tif err == nil {\n\t\t\tt.Errorf(\"Compile(%q) succeeded, want error\", p)\n\t\t\tcontinue\n\t\t}\n\t\tif !errors.Is(err, ErrBadPattern) {\n\t\t\tt.Errorf(\"Compile(%q) error %v does not match ErrBadPattern\", p, err)\n\t\t}\n\t\tif g != nil {\n\t\t\tt.Errorf(\"Compile(%q) returned non-nil Glob with error\", p)\n\t\t}\n\t}\n\tgood := []string{\"**\", \"a/**\", \"**/a\", \"a/**/b\", \"*\\\\*\", \"*{*}\", \"\\\\**\", \"\\\\*\\\\*\", \"]\", \"a,b\", \"{}\", \"[a-a]\", \"[\\\\\\\\]\", \"{,}\", \"[*]\"}\n\tfor _, p := range good {\n\t\tif _, err := Compile(p); err != nil {\n\t\t\tt.Errorf(\"Compile(%q) = %v, want success\", p, err)\n\t\t}\n\t}\n}\n\nfunc TestHiddenNonExponentialWithinSegment(t *testing.T) {\n\t// An exponential backtracker needs on the order of C(4000,30) steps here.\n\tpattern := strings.Repeat(\"*a\", 30) + \"b\"\n\tlong := strings.Repeat(\"a\", 4000)\n\tg, err := Compile(pattern)\n\tif err != nil {\n\t\tt.Fatalf(\"Compile: %v\", err)\n\t}\n\tif g.Match(long) {\n\t\tt.Error(\"pathological pattern matched a string without 'b'\")\n\t}\n\tif !g.Match(long + \"b\") {\n\t\tt.Error(\"pathological pattern failed to match string ending in 'b'\")\n\t}\n\tg2, err := Compile(strings.Repeat(\"*a\", 30))\n\tif err != nil {\n\t\tt.Fatalf(\"Compile: %v\", err)\n\t}\n\tif !g2.Match(long) {\n\t\tt.Error(`30 x \"*a\" should match 4000 'a'`)\n\t}\n\tif g2.Match(strings.Repeat(\"a\", 29)) {\n\t\tt.Error(`30 x \"*a\" should not match 29 'a'`)\n\t}\n\tg3, err := Compile(strings.Repeat(\"{*a,?a}\", 20) + \"c\")\n\tif err != nil {\n\t\tt.Fatalf(\"Compile: %v\", err)\n\t}\n\tif g3.Match(strings.Repeat(\"a\", 3000)) {\n\t\tt.Error(\"brace/star pathological pattern matched without 'c'\")\n\t}\n}\n\nfunc TestHiddenNonExponentialAcrossSegments(t *testing.T) {\n\tpattern := strings.Repeat(\"**/a/\", 25) + \"b\"\n\tg, err := Compile(pattern)\n\tif err != nil {\n\t\tt.Fatalf(\"Compile: %v\", err)\n\t}\n\tdeep := strings.Repeat(\"a/\", 600)\n\tif g.Match(deep + \"c\") {\n\t\tt.Error(\"deep path without final b matched\")\n\t}\n\tif !g.Match(deep + \"b\") {\n\t\tt.Error(\"deep path with final b did not match\")\n\t}\n\tif g.Match(strings.Repeat(\"a/\", 24) + \"b\") {\n\t\tt.Error(\"path with only 24 'a' segments matched 25 required\")\n\t}\n}\n\nfunc TestHiddenBracesNotExpanded(t *testing.T) {\n\tpattern := strings.Repeat(\"{a,b}\", 40)\n\tg, err := Compile(pattern)\n\tif err != nil {\n\t\tt.Fatalf(\"\
    Compile: %v\", err)\n\t}\n\ts := strings.Repeat(\"ab\", 20)\n\tif !g.Match(s) {\n\t\tt.Errorf(\"40 x {a,b} should match %q\", s)\n\t}\n\tif g.Match(s + \"a\") {\n\t\tt.Error(\"40 x {a,b} matched 41 runes\")\n\t}\n\tif g.Match(strings.Repeat(\"a\", 39) + \"c\") {\n\t\tt.Error(\"40 x {a,b} matched a string containing 'c'\")\n\t}\n\tnested := strings.Repeat(\"{x,\", 500) + \"y\" + strings.Repeat(\"}\", 500)\n\tg2, err := Compile(nested)\n\tif err != nil {\n\t\tt.Fatalf(\"Compile(deeply nested): %v\", err)\n\t}\n\tif !g2.Match(\"y\") || !g2.Match(\"x\") || g2.Match(\"z\") {\n\t\tt.Error(\"deeply nested brace group matched incorrectly\")\n\t}\n}\n\nfunc TestHiddenConcurrentMatch(t *testing.T) {\n\tg, err := Compile(\"src/**/{*.go,[!_]*.rs}\")\n\tif err != nil {\n\t\tt.Fatalf(\"Compile: %v\", err)\n\t}\n\tvar wg sync.WaitGroup\n\terrs := make(chan string, 64)\n\tfor i := 0; i < 16; i++ {\n\t\twg.Add(1)\n\t\tgo func() {\n\t\t\tdefer wg.Done()\n\t\t\tfor j := 0; j < 200; j++ {\n\t\t\t\tif !g.Match(\"src/a/b/main.go\") || !g.Match(\"src/lib.rs\") || g.Match(\"src/_lib.rs\") {\n\t\t\t\t\terrs <- \"concurrent Match returned a wrong result\"\n\t\t\t\t\treturn\n\t\t\t\t}\n\t\t\t}\n\t\t}()\n\t}\n\twg.Wait()\n\tclose(errs)\n\tfor e := range errs {\n\t\tt.Error(e)\n\t}\n}\nHIDDEN_EOF\nmkdir -p \"$(dirname 'mdtable/zz_hidden_test.go')\"\ncat > 'mdtable/zz_hidden_test.go' <<'HIDDEN_EOF'\npackage mdtable\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n\t\"reflect\"\n\t\"strings\"\n\t\"testing\"\n)\n\nfunc mustParse(t *testing.T, src string) *Table {\n\tt.Helper()\n\ttb, err := Parse(src)\n\tif err != nil {\n\t\tt.Fatalf(\"Parse(%q): unexpected error %v\", src, err)\n\t}\n\tif tb == nil {\n\t\tt.Fatalf(\"Parse(%q): nil table\", src)\n\t}\n\treturn tb\n}\n\nfunc TestHiddenParseWithoutOuterPipes(t *testing.T) {\n\ttb := mustParse(t, \"a | b\\n--- | :-:\\n1 | 2\\n\")\n\tif !reflect.DeepEqual(tb.Header, []string{\"a\", \"b\"}) {\n\t\tt.Errorf(\"Header = %q\", tb.Header)\n\t}\n\tif !reflect.DeepEqual(tb.Align, []Align{AlignNone, AlignCenter}) {\n\t\tt.Errorf(\"Align = %v\", tb.Align)\n\t}\n\tif !reflect.DeepEqual(tb.Rows, [][]string{{\"1\", \"2\"}}) {\n\t\tt.Errorf(\"Rows = %q\", tb.Rows)\n\t}\n}\n\nfunc TestHiddenParseAllAlignments(t *testing.T) {\n\ttb := mustParse(t, \"|a|b|c|d|e|\\n|-|:-|-:|:-:|:-----:|\\n\")\n\twant := []Align{AlignNone, AlignLeft, AlignRight, AlignCenter, AlignCenter}\n\tif !reflect.DeepEqual(tb.Align, want) {\n\t\tt.Errorf(\"Align = %v, want %v\", tb.Align, want)\n\t}\n\tif len(tb.Rows) != 0 {\n\t\tt.Errorf(\"Rows = %q, want none\", tb.Rows)\n\t}\n}\n\nfunc TestHiddenParseEscapes(t *testing.T) {\n\ttb := mustParse(t, `| a \\| b | c\\d |`+\"\\n| --- | --- |\\n\"+`| \\\\| x | y |`+\"\\n\")\n\tif !reflect.DeepEqual(tb.Header, []string{\"a | b\", `c\\d`}) {\n\t\tt.Errorf(\"Header = %q\", tb.Header)\n\t}\n\t// `\\\\|` is a literal backslash followed by an escaped pipe: no split.\n\tif !reflect.DeepEqual(tb.Rows, [][]string{{`\\| x`, \"y\"}}) {\n\t\tt.Errorf(\"Rows = %q\", tb.Rows)\n\t}\n}\n\nfunc TestHiddenParseEscapedTrailingPipeIsNotSeparator(t *testing.T) {\n\ttb := mustParse(t, \"| a \\\\|\\n| --- |\\n\")\n\tif !reflect.DeepEqual(tb.Header, []string{\"a |\"}) {\n\t\tt.Errorf(\"Header = %q, want [\\\"a |\\\"]\", tb.Header)\n\t}\n}\n\nfunc TestHiddenParsePadAndTruncate(t *testing.T) {\n\ttb := mustParse(t, \"| a | b | c |\\n|---|---|---|\\n| 1 |\\n| 1 | 2 | 3 | 4 | 5 |\\n||\\n\")\n\twant := [][]string{{\"1\", \"\", \"\"}, {\"1\", \"2\", \"3\"}, {\"\", \"\", \"\"}}\n\tif !reflect.DeepEqual(tb.Rows, want) {\n\t\tt.Errorf(\"Rows = %q, want %q\", tb.Rows, want)\n\t}\n}\n\nfunc TestHiddenParseBlankLinesCRLFAndTabs(t *testing.T) {\n\ttb := mustParse(t, \"\\r\\n  \\n|\\tx\\t|  y |\\r\\n\\n| --- | ---: |\\r\\n   \\t\\n|  1\\t| two words |\\r\\n\\n\")\n\tif !reflect.DeepEqual(tb.Header, []string{\"x\", \"y\"}) {\n\t\tt.Errorf(\"Header = %q\", tb.Header)\n\t}\n\tif !reflect.DeepEqual(tb.Align, []Align{AlignNone, AlignRight}) {\n\t\tt.Errorf(\"Align = %v\", tb.Align)\n\t}\n\tif !reflect.DeepEqual(tb.Rows, [][]string{{\"1\", \"two words\"}}) {\n\t\tt.Errorf(\"Rows = %q\", tb.Rows)\n\t}\n}\n\nfunc TestHiddenParseSingleColumnNoPipes(t *testing.T) {\n\ttb := mustParse(t, \"h\\n:-\\nv\\n\")\n\tif !reflect.DeepEqual(tb.Header, []string{\"h\"}) || !reflect.DeepEqual(tb.Align, []Align{AlignLeft}) {\n\t\tt.Errorf(\"Header = %q Align = %v\", tb.Header, tb.Align)\n\t}\n\tif !reflect.DeepEqual(tb.Rows, [][]string{{\"v\"}}) {\n\t\tt.Errorf(\"Rows = %q\", tb.Rows)\n\t}\n}\n\nfunc TestHiddenParseErrors(t *testing.T) {\n\tcases := []struct {\n\t\tsrc  string\n\t\twant error\n\t}{\n\t\t{\"\", ErrEmpty},\n\t\t{\"  \\n\\t\\n\\r\\n\", ErrEmpty},\n\t\t{\"| a | b |\", ErrMissingDelimiter},\n\t\t{\"| a | b |\\n\\n\", ErrMissingDelimiter},\n\t\t{\"| a | b |\\n| c | d |\", ErrMissingDelimiter},\n\t\t{\"| a | b |\\n| - - | --- |\", ErrMissingDelimiter},\n\t\t{\"| a |\\n| : |\", ErrMissingDelimiter},\n\t\t{\"| a |\\n| :: |\", ErrMissingDelimiter},\n\t\t{\"| a | b |\\n| --- | |\", ErrMissingDelimiter},\n\t\t{\"| a | b |\\n| --- | --- | --- |\", ErrColumnMismatch},\n\t\t{\"| a | b |\\n| --- |\", ErrColumnMismatch},\n\t\t// Invalid delimiter cells are reported before the count mismatch.\n\t\t{\"| a | b |\\n| --- | x | --- |\", ErrMissingDelimiter},\n\t}\n\tfor _, c := range cases {\n\t\ttb, err := Parse(c.src)\n\t\tif !errors.Is(err, c.want) {\n\t\t\tt.Errorf(\"Parse(%q) error = %v, want %v\", c.src, err, c.want)\n\t\t}\n\t\tif tb != nil {\n\t\t\tt.Errorf(\"Parse(%q) returned non-nil table with error\", c.src)\n\t\t}\n\t}\n}\n\nfunc TestHiddenFormatCenterExtraSpaceRight(t *testing.T) {\n\ttb := &Table{\n\t\tHeader: []string{\"h\"},\n\t\tAlign:  []Align{AlignCenter},\n\t\tRows:   [][]string{{\"abcde\"}, {\"ab\"}},\n\t}\n\twant := \"|   h   |\\n| :---: |\\n| abcde |\\n|  ab   |\\n\"\n\tif got := tb.Format(); got != want {\n\t\tt.Errorf(\"Format =\\n%q\\nwant\\n%q\", got, want)\n\t}\n}\n\nfunc TestHiddenFormatMinimumWidthAndEmptyCells(t *testing.T) {\n\ttb := &Table{Header: []string{\"\"}, Align: []Align{AlignCenter}}\n\twant := \"|     |\\n| :-: |\\n\"\n\tif got := tb.Format(); got != want {\n\t\tt.Errorf(\"Format = %q, want %q\", got, want)\n\t}\n}\n\nfunc TestHiddenFormatRaggedRowsAndShortAlign(t *testing.T) {\n\ttb := &Table{\n\t\tHeader: []string{\"a\", \"b\", \"c\"},\n\t\tAlign:  []Align{AlignRight},\n\t\tRows:   [][]string{{\"1\"}, {\"1\", \"2\", \"3\", \"4\"}},\n\t}\n\twant := \"|   a | b   | c   |\\n| --: | --- | --- |\\n|   1 |     |     |\\n|   1 | 2   | 3   |\\n\"\n\tif got := tb.Format(); got != want {\n\t\tt.Errorf(\"Format =\\n%q\\nwant\\n%q\", got, want)\n\t}\n\tif len(tb.Rows[0]) != 1 || len(tb.Rows[1]) != 4 {\n\t\tt.Errorf(\"Format modified rows: %q\", tb.Rows)\n\t}\n}\n\nfunc TestHiddenFormatWideAndCombining(t *testing.T) {\n\ttb := &Table{\n\t\tHeader: []string{\"名前\", \"x\"},\n\t\tAlign:  []Align{AlignNone, AlignLeft},\n\t\tRows:   [][]string{{\"e\\u0301\", \"ｶ\"}},\n\t}\n\twant := \"| 名前 | x   |\\n| ---- | :-- |\\n| e\\u0301    | ｶ   |\\n\"\n\tif got := tb.Format(); got != want {\n\t\tt.Errorf(\"Format =\\n%q\\nwant\\n%q\", got, want)\n\t}\n}\n\nfunc TestHiddenFormatWideRightAligned(t *testing.T) {\n\ttb := &Table{\n\t\tHeader: []string{\"한국\", \"カナ\", \"ＡＢ\", \"、\"},\n\t\tAlign:  []Align{AlignRight, AlignRight, AlignRight, AlignRight},\n\t\tRows:   [][]string{{\"1\", \"2\", \"3\", \"4\"}},\n\t}\n\twant := \"| 한국 | カナ | ＡＢ |  、 |\\n| ---: | ---: | ---: | --: |\\n|    1 |    2 |    3 |   4 |\\n\"\n\tif got := tb.Format(); got != want {\n\t\tt.Errorf(\"Format =\\n%q\\nwant\\n%q\", got, want)\n\t}\n}\n\n// Each cell is \"abcd\" followed by four copies of the rune, so the column width\n// is 4 + 4*runeWidth and the delimiter row reveals it.\nfunc TestHiddenFormatRuneWidthBoundaries(t *testing.T) {\n\tcases := []struct {\n\t\tr rune\n\t\tw int\n\t}{\n\t\t{0x02FF, 1}, {0x0300, 0}, {0x036F, 0}, {0x0370, 1},\n\t\t{0x1AB0, 0}, {0x1AFF, 0}, {0x1DC0, 0}, {0x1DFF, 0},\n\t\t{0x20CF, 1}, {0x20D0, 0}, {0x20FF, 0}, {0x2100, 1},\n\t\t{0xFE1F, 1}, {0xFE20, 0}, {0xFE2F, 0}, {0xFE30, 1},\n\t\t{0x10FF, 1}, {0x1100, 2}, {0x115F, 2}, {0x1160, 1},\n\t\t{0x2FFF, 1}, {0x3000, 2}, {0x303F, 2}, {0x3040, 2}, {0x309F, 2},\n\t\t{0x30A0, 2}, {0x30FF, 2}, {0x3100, 1},\n\t\t{0x33FF, 1}, {0x3400, 2}, {0x4DBF, 2}, {0x4DC0, 1},\n\t\t{0x4E00, 2}, {0x9FFF, 2}, {0xA000, 1},\n\t\t{0xABFF, 1}, {0xAC00, 2}, {0xD7A3, 2}, {0xD7A4, 1},\n\t\t{0xFF00, 1}, {0xFF01, 2}, {0xFF60, 2}, {0xFF61, 1},\n\t\t{0xFFDF, 1}, {0xFFE0, 2}, {0xFFE6, 2}, {0xFFE7, 1},\n\t\t{0x1F600, 1}, {0x20000, 1},\n\t}\n\tfor _, c := range cases {\n\t\ttb := &Table{Header: []string{\"abcd\" + strings.Repeat(string(c.r), 4)}, Align: []Align{AlignNone}}\n\t\tlines := strings.Split(tb.Format(), \"\\n\")\n\t\twant := \"| \" + strings.Repeat(\"-\", 4+4*c.w) + \" |\"\n\t\tif len(lines) < 2 || lines[1] != want {\n\t\t\tt.Errorf(\"rune U+%04X: delimiter line = %q, want %q (width %d)\", c.r, lines, want, c.w)\n\t\t}\n\t}\n}\n\nfunc TestHiddenFormatInvalidUTF8CountsOnePerByte(t *testing.T) {\n\ttb := &Table{Header: []string{\"ab\\xff\\xfe\"}, Align: []Align{AlignNone}}\n\twant := \"| ab\\xff\\xfe |\\n| ---- |\\n\"\n\tif got := tb.Format(); got != want {\n\t\tt.Errorf(\"Format = %q, want %q\", got, want)\n\t}\n}\n\nfunc TestHiddenRoundTrip(t *testing.T) {\n\tsrc := \"Name|Note\\n:-:|---\\n数据 | a\\\\|b\\nx\\n\"\n\ttb := mustParse(t, src)\n\tout := tb.Format()\n\twant := \"| Name | Note |\\n| :--: | ---- |\\n| 数据 | a\\\\|b |\\n|  x   |      |\\n\"\n\tif out != want {\n\t\tt.Fatalf(\"Format =\\n%q\\nwant\\n%q\", out, want)\n\t}\n\tagain := mustParse(t, out)\n\tif !reflect.DeepEqual(again, tb) {\n\t\tt.Errorf(\"reparse = %#v, want %#v\", again, tb)\n\t}\n\tif again.Format() != out {\n\t\tt.Errorf(\"Format is not idempotent\")\n\t}\n}\n\nfunc TestHiddenSortByLexicalStable(t *testing.T) {\n\ttb := mustParse(t, \"| k | v |\\n|:-|-:|\\n| b | 1 |\\n| a | 2 |\\n| b | 3 |\\n| A | 4 |\\n| a | 5 |\\n| 10 | 6 |\\n| 9 | 7 |\\n\")\n\tif err := tb.SortBy(0,\
    \ false); err != nil {\n\t\tt.Fatalf(\"SortBy: %v\", err)\n\t}\n\tvar got []string\n\tfor _, r := range tb.Rows {\n\t\tgot = append(got, r[0]+r[1])\n\t}\n\twant := []string{\"106\", \"97\", \"A4\", \"a2\", \"a5\", \"b1\", \"b3\"}\n\tif !reflect.DeepEqual(got, want) {\n\t\tt.Errorf(\"order = %q, want %q\", got, want)\n\t}\n\tif !reflect.DeepEqual(tb.Header, []string{\"k\", \"v\"}) || !reflect.DeepEqual(tb.Align, []Align{AlignLeft, AlignRight}) {\n\t\tt.Errorf(\"SortBy changed Header/Align: %q %v\", tb.Header, tb.Align)\n\t}\n}\n\nfunc TestHiddenSortByNumericNonNumbersLast(t *testing.T) {\n\tkeys := []string{\"x\", \"10\", \" 7 \", \"NaN\", \"-3\", \"Inf\", \"abc\", \"1e1\", \"\", \"1e400\", \"0x10\", \"-inf\"}\n\ttb := &Table{Header: []string{\"k\", \"id\"}, Align: []Align{AlignNone, AlignNone}}\n\tfor i, k := range keys {\n\t\ttb.Rows = append(tb.Rows, []string{k, fmt.Sprint(i)})\n\t}\n\tif err := tb.SortBy(0, true); err != nil {\n\t\tt.Fatalf(\"SortBy: %v\", err)\n\t}\n\tvar got []string\n\tfor _, r := range tb.Rows {\n\t\tgot = append(got, r[1])\n\t}\n\t// numbers: -inf(11) -3(4) 7(2) 10(1) 1e1(7) Inf(5)\n\t// (\"0x10\" is not accepted by ParseFloat without a p exponent)\n\t// non-numbers in original order: x(0) NaN(3) abc(6) \"\"(8) 1e400(9) 0x10(10)\n\twant := []string{\"11\", \"4\", \"2\", \"1\", \"7\", \"5\", \"0\", \"3\", \"6\", \"8\", \"9\", \"10\"}\n\tif !reflect.DeepEqual(got, want) {\n\t\tt.Errorf(\"order of ids = %q, want %q\", got, want)\n\t}\n}\n\nfunc TestHiddenSortByShortRowsAndRange(t *testing.T) {\n\ttb := &Table{\n\t\tHeader: []string{\"a\", \"b\"},\n\t\tAlign:  []Align{AlignNone, AlignNone},\n\t\tRows:   [][]string{{\"z\", \"1\"}, {\"y\"}},\n\t}\n\tif err := tb.SortBy(1, false); err != nil {\n\t\tt.Fatalf(\"SortBy: %v\", err)\n\t}\n\tif !reflect.DeepEqual(tb.Rows, [][]string{{\"y\"}, {\"z\", \"1\"}}) {\n\t\tt.Errorf(\"Rows = %q\", tb.Rows)\n\t}\n\tbefore := [][]string{{\"y\"}, {\"z\", \"1\"}}\n\tfor _, col := range []int{-1, 2, 100} {\n\t\tfor _, numeric := range []bool{false, true} {\n\t\t\tif err := tb.SortBy(col, numeric); !errors.Is(err, ErrColumnRange) {\n\t\t\t\tt.Errorf(\"SortBy(%d, %v) error = %v, want ErrColumnRange\", col, numeric, err)\n\t\t\t}\n\t\t}\n\t}\n\tif !reflect.DeepEqual(tb.Rows, before) {\n\t\tt.Errorf(\"failed SortBy modified rows: %q\", tb.Rows)\n\t}\n}\n\nfunc TestHiddenSortByNumericShortRowIsNonNumber(t *testing.T) {\n\ttb := &Table{\n\t\tHeader: []string{\"a\", \"b\"},\n\t\tRows:   [][]string{{\"p\"}, {\"q\", \"5\"}, {\"r\", \"-1\"}},\n\t}\n\tif err := tb.SortBy(1, true); err != nil {\n\t\tt.Fatalf(\"SortBy: %v\", err)\n\t}\n\tvar got []string\n\tfor _, r := range tb.Rows {\n\t\tgot = append(got, r[0])\n\t}\n\tif !reflect.DeepEqual(got, []string{\"r\", \"q\", \"p\"}) {\n\t\tt.Errorf(\"order = %q\", got)\n\t}\n}\nHIDDEN_EOF\nmkdir -p \"$(dirname 'lruttl/zz_hidden_test.go')\"\ncat > 'lruttl/zz_hidden_test.go' <<'HIDDEN_EOF'\npackage lruttl\n\nimport (\n\t\"fmt\"\n\t\"reflect\"\n\t\"sync\"\n\t\"sync/atomic\"\n\t\"testing\"\n\t\"time\"\n)\n\ntype fakeClock struct {\n\tmu sync.Mutex\n\tt  time.Time\n}\n\nfunc newFakeClock() *fakeClock { return &fakeClock{t: time.Unix(1_700_000_000, 0)} }\n\nfunc (f *fakeClock) Now() time.Time {\n\tf.mu.Lock()\n\tdefer f.mu.Unlock()\n\treturn f.t\n}\n\nfunc (f *fakeClock) Advance(d time.Duration) {\n\tf.mu.Lock()\n\tf.t = f.t.Add(d)\n\tf.mu.Unlock()\n}\n\ntype ev struct {\n\tKey    string\n\tValue  any\n\tReason Reason\n}\n\ntype recorder struct {\n\tmu  sync.Mutex\n\tevs []ev\n}\n\nfunc (r *recorder) cb(key string, value any, reason Reason) {\n\tr.mu.Lock()\n\tr.evs = append(r.evs, ev{key, value, reason})\n\tr.mu.Unlock()\n}\n\nfunc (r *recorder) take() []ev {\n\tr.mu.Lock()\n\tdefer r.mu.Unlock()\n\tout := r.evs\n\tr.evs = nil\n\treturn out\n}\n\nfunc newTestCache(capacity int) (*Cache, *fakeClock, *recorder) {\n\tclk := newFakeClock()\n\trec := &recorder{}\n\treturn New(capacity, clk.Now, rec.cb), clk, rec\n}\n\nfunc expectEvents(t *testing.T, rec *recorder, want ...ev) {\n\tt.Helper()\n\tgot := rec.take()\n\tif len(got) == 0 && len(want) == 0 {\n\t\treturn\n\t}\n\tif !reflect.DeepEqual(got, want) {\n\t\tt.Errorf(\"events = %+v, want %+v\", got, want)\n\t}\n}\n\nfunc expectKeys(t *testing.T, c *Cache, want ...string) {\n\tt.Helper()\n\tgot := c.Keys()\n\tif len(got) == 0 && len(want) == 0 {\n\t\treturn\n\t}\n\tif !reflect.DeepEqual(got, want) {\n\t\tt.Errorf(\"Keys = %q, want %q\", got, want)\n\t}\n}\n\nfunc TestHiddenReasonString(t *testing.T) {\n\tcases := map[Reason]string{\n\t\tExpired: \"expired\", Evicted: \"evicted\", Removed: \"removed\", Replaced: \"replaced\",\n\t\tReason(7): \"Reason(7)\", Reason(-1): \"Reason(-1)\",\n\t}\n\tfor r, want := range cases {\n\t\tif got := r.String(); got != want {\n\t\t\tt.Errorf(\"Reason(%d).String() = %q, want %q\", int(r), got, want)\n\t\t}\n\t}\n\tif Expired == Evicted || Evicted == Removed || Removed == Replaced || Expired == Replaced {\n\t\tt.Errorf(\"reasons must be distinct\")\n\t}\n}\n\nfunc TestHiddenNewPanicsAndNilArgs(t *testing.T) {\n\tfor _, capacity := range []int{0, -3} {\n\t\tfunc() {\n\t\t\tdefer func() {\n\t\t\t\tif recover() == nil {\n\t\t\t\t\tt.Errorf(\"New(%d) did not panic\", capacity)\n\t\t\t\t}\n\t\t\t}()\n\t\t\tNew(capacity, nil, nil)\n\t\t}()\n\t}\n\tc := New(1, nil, nil) // nil now => time.Now, nil onEvict => no callbacks\n\tc.Set(\"a\", 1, time.Hour)\n\tc.Set(\"b\", 2, 0)\n\tif _, ok := c.Get(\"a\"); ok {\n\t\tt.Errorf(\"a should have been evicted\")\n\t}\n\tif v, ok := c.Get(\"b\"); !ok || v != 2 {\n\t\tt.Errorf(\"Get(b) = %v, %v\", v, ok)\n\t}\n}\n\nfunc TestHiddenLRUOrderAndEvictionCallback(t *testing.T) {\n\tc, _, rec := newTestCache(3)\n\tc.Set(\"a\", 1, 0)\n\tc.Set(\"b\", 2, 0)\n\tc.Set(\"c\", 3, 0)\n\texpectKeys(t, c, \"c\", \"b\", \"a\")\n\tc.Get(\"a\")\n\texpectKeys(t, c, \"a\", \"c\", \"b\")\n\tc.Set(\"d\", 4, 0)\n\texpectEvents(t, rec, ev{\"b\", 2, Evicted})\n\tc.Set(\"e\", 5, 0)\n\texpectEvents(t, rec, ev{\"c\", 3, Evicted})\n\texpectKeys(t, c, \"e\", \"d\", \"a\")\n\tif s := c.Stats(); s != (Stats{Hits: 1, Evictions: 2}) {\n\t\tt.Errorf(\"Stats = %+v\", s)\n\t}\n}\n\nfunc TestHiddenSetExistingReplacesAndCountsAsUse(t *testing.T) {\n\tc, _, rec := newTestCache(2)\n\tc.Set(\"a\", \"old\", 0)\n\tc.Set(\"b\", 2, 0)\n\tc.Set(\"a\", \"new\", 0) // at capacity, but replacing must not evict\n\texpectEvents(t, rec, ev{\"a\", \"old\", Replaced})\n\texpectKeys(t, c, \"a\", \"b\")\n\tif v, _ := c.Peek(\"a\"); v != \"new\" {\n\t\tt.Errorf(\"Peek(a) = %v, want new\", v)\n\t}\n\tc.Set(\"c\", 3, 0)\n\texpectEvents(t, rec, ev{\"b\", 2, Evicted})\n\tif s := c.Stats(); s != (Stats{Evictions: 1}) {\n\t\tt.Errorf(\"Stats = %+v (Replaced must not be counted)\", s)\n\t}\n}\n\nfunc TestHiddenExpiryBoundaryAndNoExpiry(t *testing.T) {\n\tc, clk, rec := newTestCache(10)\n\tc.Set(\"ttl\", 1, 10*time.Second)\n\tc.Set(\"zero\", 2, 0)\n\tc.Set(\"neg\", 3, -time.Second)\n\tclk.Advance(10*time.Second - time.Nanosecond)\n\tif _, ok := c.Get(\"ttl\"); !ok {\n\t\tt.Errorf(\"entry expired one nanosecond early\")\n\t}\n\tclk.Advance(time.Nanosecond)\n\tif _, ok := c.Peek(\"ttl\"); ok {\n\t\tt.Errorf(\"entry must be expired exactly at its expiry instant\")\n\t}\n\tclk.Advance(1000 * time.Hour)\n\tfor _, k := range []string{\"zero\", \"neg\"} {\n\t\tif _, ok := c.Get(k); !ok {\n\t\t\tt.Errorf(\"Get(%s): ttl <= 0 must never expire\", k)\n\t\t}\n\t}\n\tif _, ok := c.Get(\"ttl\"); ok {\n\t\tt.Errorf(\"Get(ttl) after expiry returned a hit\")\n\t}\n\texpectEvents(t, rec, ev{\"ttl\", 1, Expired})\n\tif _, ok := c.Get(\"ttl\"); ok {\n\t\tt.Errorf(\"second Get(ttl) returned a hit\")\n\t}\n\texpectEvents(t, rec)\n\tif s := c.Stats(); s != (Stats{Hits: 3, Misses: 2, Expirations: 1}) {\n\t\tt.Errorf(\"Stats = %+v\", s)\n\t}\n}\n\nfunc TestHiddenReplaceRecomputesTTL(t *testing.T) {\n\tc, clk, rec := newTestCache(4)\n\tc.Set(\"a\", 1, 5*time.Second)\n\tclk.Advance(4 * time.Second)\n\tc.Set(\"a\", 2, 5*time.Second)\n\texpectEvents(t, rec, ev{\"a\", 1, Replaced})\n\tclk.Advance(4 * time.Second) // 8s after first set, 4s after replace\n\tif v, ok := c.Peek(\"a\"); !ok || v != 2 {\n\t\tt.Errorf(\"Peek(a) = %v, %v; ttl must restart on replace\", v, ok)\n\t}\n\tc.Set(\"a\", 3, 0) // removes expiry\n\texpectEvents(t, rec, ev{\"a\", 2, Replaced})\n\tclk.Advance(time.Hour)\n\tif v, ok := c.Get(\"a\"); !ok || v != 3 {\n\t\tt.Errorf(\"Get(a) = %v, %v; ttl 0 on replace must clear expiry\", v, ok)\n\t}\n\tc.Set(\"a\", 4, time.Second) // adds expiry back\n\texpectEvents(t, rec, ev{\"a\", 3, Replaced})\n\tclk.Advance(time.Second)\n\tif _, ok := c.Peek(\"a\"); ok {\n\t\tt.Errorf(\"replace with ttl must set a new expiry\")\n\t}\n}\n\nfunc TestHiddenSetOverExpiredKey(t *testing.T) {\n\tc, clk, rec := newTestCache(2)\n\tc.Set(\"a\", 1, time.Second)\n\tc.Set(\"b\", 2, 0)\n\tclk.Advance(time.Second)\n\tc.Set(\"a\", 9, 0)\n\texpectEvents(t, rec, ev{\"a\", 1, Expired})\n\texpectKeys(t, c, \"a\", \"b\")\n\tif s := c.Stats(); s != (Stats{Expirations: 1}) {\n\t\tt.Errorf(\"Stats = %+v\", s)\n\t}\n}\n\nfunc TestHiddenPeekDoesNotUseOrEvict(t *testing.T) {\n\tc, clk, rec := newTestCache(2)\n\tc.Set(\"a\", 1, 0)\n\tc.Set(\"b\", 2, time.Second)\n\tif v, ok := c.Peek(\"a\"); !ok || v != 1 {\n\t\tt.Errorf(\"Peek(a) = %v, %v\", v, ok)\n\t}\n\tif _, ok := c.Peek(\"missing\"); ok {\n\t\tt.Errorf(\"Peek(missing) hit\")\n\t}\n\texpectKeys(t, c, \"b\", \"a\") // Peek did not change recency\n\tclk.Advance(time.Second)\n\tif _, ok := c.Peek(\"b\"); ok {\n\t\tt.Errorf(\"Peek of expired entry must report missing\")\n\t}\n\texpectEvents(t, rec)\n\tif s := c.Stats(); s != (Stats{}) {\n\t\tt.Errorf(\"Peek changed stats: %+v\", s)\n\t}\n\t// b is still stored (expired): Delete reports it as Expired.\n\tif c.Delete(\"b\") {\n\t\tt.Errorf(\"Delete of expired entry returned true\")\n\t}\n\texpectEvents(t, rec, ev{\"b\", 2, Expired})\n}\n\nfunc TestHiddenPeekLeavesLRUVictimInPlace(t *testing.T) {\n\tc, _, rec := newTestCache(2)\n\tc.Set(\"a\", 1, 0)\n\
    \tc.Set(\"b\", 2, 0)\n\tc.Peek(\"a\")\n\tc.Set(\"c\", 3, 0)\n\texpectEvents(t, rec, ev{\"a\", 1, Evicted})\n}\n\nfunc TestHiddenDelete(t *testing.T) {\n\tc, clk, rec := newTestCache(4)\n\tc.Set(\"a\", \"va\", 0)\n\tc.Set(\"b\", \"vb\", time.Minute)\n\tif !c.Delete(\"a\") {\n\t\tt.Errorf(\"Delete(a) = false, want true\")\n\t}\n\texpectEvents(t, rec, ev{\"a\", \"va\", Removed})\n\tif c.Delete(\"a\") {\n\t\tt.Errorf(\"second Delete(a) = true\")\n\t}\n\tif c.Delete(\"nope\") {\n\t\tt.Errorf(\"Delete(nope) = true\")\n\t}\n\texpectEvents(t, rec)\n\tclk.Advance(time.Minute)\n\tif c.Delete(\"b\") {\n\t\tt.Errorf(\"Delete(expired b) = true\")\n\t}\n\texpectEvents(t, rec, ev{\"b\", \"vb\", Expired})\n\tif s := c.Stats(); s != (Stats{Expirations: 1}) {\n\t\tt.Errorf(\"Stats = %+v\", s)\n\t}\n}\n\nfunc TestHiddenLenAndKeysSkipExpiredWithoutRemoving(t *testing.T) {\n\tc, clk, rec := newTestCache(4)\n\tc.Set(\"a\", 1, 2*time.Second)\n\tc.Set(\"b\", 2, 0)\n\tc.Set(\"c\", 3, time.Second)\n\tc.Set(\"d\", 4, 3*time.Second)\n\tc.Get(\"a\")\n\tif n := c.Len(); n != 4 {\n\t\tt.Errorf(\"Len = %d, want 4\", n)\n\t}\n\texpectKeys(t, c, \"a\", \"d\", \"c\", \"b\")\n\tclk.Advance(2 * time.Second)\n\tif n := c.Len(); n != 2 {\n\t\tt.Errorf(\"Len = %d, want 2\", n)\n\t}\n\texpectKeys(t, c, \"d\", \"b\")\n\texpectEvents(t, rec)\n\tif s := c.Stats(); s.Expirations != 0 {\n\t\tt.Errorf(\"Len/Keys must not remove: %+v\", s)\n\t}\n\tk := c.Keys()\n\tif len(k) > 0 {\n\t\tk[0] = \"mutated\"\n\t}\n\texpectKeys(t, c, \"d\", \"b\")\n}\n\nfunc TestHiddenPurge(t *testing.T) {\n\tc, clk, rec := newTestCache(5)\n\tc.Set(\"a\", 1, time.Second)\n\tc.Set(\"b\", 2, 0)\n\tc.Set(\"c\", 3, time.Second)\n\tc.Set(\"d\", 4, time.Hour)\n\tc.Set(\"e\", 5, time.Second)\n\tc.Get(\"a\") // order LRU->MRU: b c d e a\n\tc.Purge()\n\texpectEvents(t, rec)\n\tclk.Advance(time.Second)\n\tc.Purge()\n\texpectEvents(t, rec, ev{\"c\", 3, Expired}, ev{\"e\", 5, Expired}, ev{\"a\", 1, Expired})\n\texpectKeys(t, c, \"d\", \"b\")\n\tif s := c.Stats(); s != (Stats{Hits: 1, Expirations: 3}) {\n\t\tt.Errorf(\"Stats = %+v\", s)\n\t}\n\tc.Purge()\n\texpectEvents(t, rec)\n}\n\nfunc TestHiddenInsertAtCapacityRemovesExpiredFirst(t *testing.T) {\n\tc, clk, rec := newTestCache(4)\n\tc.Set(\"a\", 1, time.Second)\n\tc.Set(\"b\", 2, 0)\n\tc.Set(\"c\", 3, time.Second)\n\tc.Set(\"d\", 4, 0)\n\tc.Get(\"a\") // LRU->MRU: b c d a\n\tclk.Advance(time.Second)\n\tc.Set(\"e\", 5, 0)\n\t// All expired entries go, LRU first, and nothing live is evicted.\n\texpectEvents(t, rec, ev{\"c\", 3, Expired}, ev{\"a\", 1, Expired})\n\texpectKeys(t, c, \"e\", \"d\", \"b\")\n\tif s := c.Stats(); s != (Stats{Hits: 1, Expirations: 2}) {\n\t\tt.Errorf(\"Stats = %+v\", s)\n\t}\n}\n\nfunc TestHiddenBelowCapacityDoesNotRemoveExpired(t *testing.T) {\n\tc, clk, rec := newTestCache(3)\n\tc.Set(\"a\", 1, time.Second)\n\tclk.Advance(time.Second)\n\tc.Set(\"b\", 2, 0)\n\texpectEvents(t, rec)\n\tc.Set(\"c\", 3, 0) // now 3 stored (a expired) — still no removal\n\texpectEvents(t, rec)\n\tc.Set(\"d\", 4, 0) // at capacity: a expires, nothing evicted\n\texpectEvents(t, rec, ev{\"a\", 1, Expired})\n\tc.Set(\"e\", 5, 0) // at capacity, nothing expired: LRU b evicted\n\texpectEvents(t, rec, ev{\"b\", 2, Evicted})\n\texpectKeys(t, c, \"e\", \"d\", \"c\")\n}\n\nfunc TestHiddenResize(t *testing.T) {\n\tc, clk, rec := newTestCache(5)\n\tc.Set(\"a\", 1, time.Second)\n\tc.Set(\"b\", 2, 0)\n\tc.Set(\"c\", 3, 0)\n\tc.Set(\"d\", 4, 0)\n\tc.Set(\"e\", 5, 0)\n\tclk.Advance(time.Second) // a is expired but Resize ignores expiry\n\tc.Resize(2)\n\texpectEvents(t, rec, ev{\"a\", 1, Evicted}, ev{\"b\", 2, Evicted}, ev{\"c\", 3, Evicted})\n\texpectKeys(t, c, \"e\", \"d\")\n\tif s := c.Stats(); s != (Stats{Evictions: 3}) {\n\t\tt.Errorf(\"Stats = %+v\", s)\n\t}\n\tc.Resize(3)\n\texpectEvents(t, rec)\n\tc.Set(\"f\", 6, 0)\n\texpectEvents(t, rec)\n\texpectKeys(t, c, \"f\", \"e\", \"d\")\n\tc.Set(\"g\", 7, 0)\n\texpectEvents(t, rec, ev{\"d\", 4, Evicted})\n\tfor _, capacity := range []int{0, -1} {\n\t\tfunc() {\n\t\t\tdefer func() {\n\t\t\t\tif recover() == nil {\n\t\t\t\t\tt.Errorf(\"Resize(%d) did not panic\", capacity)\n\t\t\t\t}\n\t\t\t}()\n\t\t\tc.Resize(capacity)\n\t\t}()\n\t}\n\texpectKeys(t, c, \"g\", \"f\", \"e\")\n}\n\nfunc TestHiddenCallbacksRunOutsideLock(t *testing.T) {\n\tclk := newFakeClock()\n\tvar c *Cache\n\tvar seen []string\n\tc = New(1, clk.Now, func(key string, value any, reason Reason) {\n\t\t// Re-entrant calls would deadlock if the lock were still held.\n\t\t_, stillThere := c.Peek(key)\n\t\tseen = append(seen, fmt.Sprintf(\"%s:%v:%s:len=%d:present=%v\", key, value, reason, c.Len(), stillThere))\n\t\tif key == \"a\" {\n\t\t\tc.Set(\"side\", 0, 0) // evicts b from within the callback\n\t\t}\n\t})\n\tdone := make(chan struct{})\n\tgo func() {\n\t\tdefer close(done)\n\t\tc.Set(\"a\", 1, 0)\n\t\tc.Set(\"b\", 2, 0) // evicts a\n\t}()\n\tselect {\n\tcase <-done:\n\tcase <-time.After(10 * time.Second):\n\t\tt.Fatal(\"deadlock: callback invoked while cache lock held\")\n\t}\n\twant := []string{\n\t\t\"a:1:evicted:len=1:present=false\",\n\t\t\"b:2:evicted:len=1:present=false\",\n\t}\n\tif !reflect.DeepEqual(seen, want) {\n\t\tt.Errorf(\"callback log = %q, want %q\", seen, want)\n\t}\n\texpectKeys(t, c, \"side\")\n}\n\nfunc TestHiddenConcurrentUse(t *testing.T) {\n\tclk := newFakeClock()\n\tvar callbacks atomic.Int64\n\tc := New(16, clk.Now, func(string, any, Reason) { callbacks.Add(1) })\n\tconst workers, ops = 8, 2000\n\tvar gets atomic.Uint64\n\tvar wg sync.WaitGroup\n\tfor w := 0; w < workers; w++ {\n\t\twg.Add(1)\n\t\tgo func(w int) {\n\t\t\tdefer wg.Done()\n\t\t\tfor i := 0; i < ops; i++ {\n\t\t\t\tk := fmt.Sprintf(\"k%d\", (i*7+w)%40)\n\t\t\t\tswitch i % 7 {\n\t\t\t\tcase 0, 1:\n\t\t\t\t\tc.Set(k, i, time.Duration(i%3)*time.Millisecond)\n\t\t\t\tcase 2, 3:\n\t\t\t\t\tc.Get(k)\n\t\t\t\t\tgets.Add(1)\n\t\t\t\tcase 4:\n\t\t\t\t\tc.Peek(k)\n\t\t\t\t\tc.Len()\n\t\t\t\tcase 5:\n\t\t\t\t\tc.Keys()\n\t\t\t\t\tc.Delete(k)\n\t\t\t\tcase 6:\n\t\t\t\t\tif i%70 == 6 {\n\t\t\t\t\t\tclk.Advance(time.Millisecond)\n\t\t\t\t\t\tc.Purge()\n\t\t\t\t\t\tc.Resize(8 + (i/70)%16)\n\t\t\t\t\t}\n\t\t\t\t\tc.Stats()\n\t\t\t\t}\n\t\t\t}\n\t\t}(w)\n\t}\n\twg.Wait()\n\ts := c.Stats()\n\tif s.Hits+s.Misses != gets.Load() {\n\t\tt.Errorf(\"Hits+Misses = %d, want %d\", s.Hits+s.Misses, gets.Load())\n\t}\n\tc.Resize(1)\n\tif n := len(c.Keys()); n > 1 {\n\t\tt.Errorf(\"after Resize(1) Keys has %d entries\", n)\n\t}\n\tif callbacks.Load() < int64(s.Evictions+s.Expirations) {\n\t\tt.Errorf(\"callbacks %d < evictions+expirations %d\", callbacks.Load(), s.Evictions+s.Expirations)\n\t}\n}\nHIDDEN_EOF\ngo test -race ./...\n"
