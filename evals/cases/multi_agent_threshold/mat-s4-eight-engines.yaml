  - "set -euo pipefail\ngit diff --quiet HEAD -- '*_test.go'\nmkdir -p \"$(dirname 'expr/zz_hidden_test.go')\"\ncat > 'expr/zz_hidden_test.go' <<'HIDDEN_EOF'\npackage expr\n\nimport (\n\t\"errors\"\n\t\"testing\"\n)\n\nfunc hNum(f float64) Value { return Value{Kind: Number, Num: f} }\nfunc hStr(x string) Value  { return Value{Kind: String, Str: x} }\nfunc hBool(x bool) Value   { return Value{Kind: Bool, Bool: x} }\n\nfunc TestHiddenValues(t *testing.T) {\n\tvars := map[string]Value{\n\t\t\"a\":    hNum(6),\n\t\t\"b\":    hNum(7),\n\t\t\"x\":    hNum(5),\n\t\t\"neg\":  hNum(-2),\n\t\t\"name\": hStr(\"bob\"),\n\t\t\"flag\": hBool(true),\n\t}\n\tcases := []struct {\n\t\tsrc  string\n\t\twant Value\n\t}{\n\t\t{\"1 + 2 * 3\", hNum(7)},\n\t\t{\"(1 + 2) * 3\", hNum(9)},\n\t\t{\"10 - 4 - 3\", hNum(3)},\n\t\t{\"100 / 10 / 5\", hNum(2)},\n\t\t{\"7 % 3\", hNum(1)},\n\t\t{\"-7 % 3\", hNum(-1)},\n\t\t{\"2.5 * 2\", hNum(5)},\n\t\t{\"--3\", hNum(3)},\n\t\t{\"-2 * 3\", hNum(-6)},\n\t\t{\"!true\", hBool(false)},\n\t\t{\"!!false\", hBool(false)},\n\t\t{`\"ab\" + \"cd\"`, hStr(\"abcd\")},\n\t\t{`\"a\\\"b\\\\c\\nd\\te\"`, hStr(\"a\\\"b\\\\c\\nd\\te\")},\n\t\t{`len(\"a\\\"b\")`, hNum(3)},\n\t\t{`len(\"héllo\")`, hNum(5)},\n\t\t{`len(\"\")`, hNum(0)},\n\t\t{`\"abc\" < \"abd\"`, hBool(true)},\n\t\t{`\"b\" > \"abc\"`, hBool(true)},\n\t\t{`\"a\" <= \"a\"`, hBool(true)},\n\t\t{\"1 <= 1\", hBool(true)},\n\t\t{\"2 >= 3\", hBool(false)},\n\t\t{\"1 == 1.0\", hBool(true)},\n\t\t{`\"a\" != \"b\"`, hBool(true)},\n\t\t{\"true == false\", hBool(false)},\n\t\t{\"1 + 2 == 3 && 4 > 3\", hBool(true)},\n\t\t{\"true || false && false\", hBool(true)},\n\t\t{\"(true || false) && false\", hBool(false)},\n\t\t{\"1 < 2 == true\", hBool(true)},\n\t\t{\"false && missing\", hBool(false)},\n\t\t{\"true || 1 / 0 > 0\", hBool(true)},\n\t\t{\"flag && x > 4\", hBool(true)},\n\t\t{`if(x > 0, \"pos\", \"neg\")`, hStr(\"pos\")},\n\t\t{`if(neg > 0, \"pos\", \"neg\")`, hStr(\"neg\")},\n\t\t{\"if(false, 1 / 0, 2)\", hNum(2)}