100); !strings.HasPrefix(got, hdr(\"@@ -1,10 +1,10 @@\\n a\\n\")) {\n\t\tt.Errorf(\"ctx100: got %q\", got)\n\t}\n}\n\nfunc TestHiddenUnifiedNames(t *testing.T) {\n\tgot := Unified(\"src/old name.go\", \"src/new.go\", \"x\\n\", \"y\\n\", 0)\n\tif want := \"--- src/old name.go\\n+++ src/new.go\\n@@ -1 +1 @@\\n-x\\n+y\\n\"; got != want {\n\t\tt.Fatalf(\"got %q, want %q\", got, want)\n\t}\n}\n\nfunc TestHiddenUnifiedNoNewline(t *testing.T) {\n\tconst m = \"\\\\ No newline at end of file\\n\"\n\tcases := []struct {\n\t\ta, b string\n\t\tctx  int\n\t\twant string\n\t}{\n\t\t{\"a\\nb\", \"a\\nc\", 1, \"@@ -1,2 +1,2 @@\\n a\\n-b\\n\" + m + \"+c\\n\" + m},\n\t\t{\"a\", \"a\\n\", 3, \"@@ -1 +1 @@\\n-a\\n\" + m + \"+a\\n\"},\n\t\t{\"a\\n\", \"a\", 3, \"@@ -1 +1 @@\\n-a\\n+a\\n\" + m},\n\t\t{\"x\\ny\", \"X\\ny\", 1, \"@@ -1,2 +1,2 @@\\n-x\\n+X\\n y\\n\" + m},\n\t\t{\"x\\ny\", \"X\\ny\", 0, \"@@ -1 +1 @@\\n-x\\n+X\\n\"},\n\t}\n\tfor _, c := range cases {\n\t\tif got, want := Unified(\"a\", \"b\", c.a, c.b, c.ctx), hdr(c.want); got != want {\n\t\t\tt.Errorf(\"Unified(%q, %q, %d) = %q, want %q\", c.a, c.b, c.ctx, got, want)\n\t\t}\n\t}\n}\n\nfunc TestHiddenRoundTrip(t *testing.T) {\n\tr := rand.New(rand.NewSource(7))\n\tfor iter := 0; iter < 600; iter++ {\n\t\ta, b := randText(r), randText(r)\n\t\tctx := r.Intn(4)\n\t\td := Unified(\"a\", \"b\", a, b, ctx)\n\t\tgot, err := Apply(a, d)\n\t\tif err != nil {\n\t\t\tt.Fatalf(\"Apply(%q, Unified(%q, %q, %d)=%q) error: %v\", a, a, b, ctx, d, err)\n\t\t}\n\t\tif got != b {\n\t\t\tt.Fatalf(\"Apply(%q, %q) = %q, want %q\", a, d, got, b)\n\t\t}\n\t}\n}\n\nfunc TestHiddenApplyEmptyDiff(t *testing.T) {\n\tgot, err := Apply(\"keep\\nme\", \"\")\n\tif err != nil || got != \"keep\\nme\" {\n\t\tt.Fatalf(\"got %q, %v\", got, err)\n\t}\n}\n\nfunc TestHiddenApplyHandWritten(t *testing.T) {\n\torig := \"a\\nb\\nc\\nd\\n\"\n\td := hdr(\"@@ -1,0 +2 @@\\n+X\\n@@ -3 +3,0 @@\\n-c\\n\")\n\tgot, err := Apply(orig, d)\n\tif err != nil || got != \"a\\nX\\nb\\