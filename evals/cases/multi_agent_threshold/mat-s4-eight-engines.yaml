    \ %q) does not reconstruct inputs: %#v\", a, b, ops)\n\t\t}\n\t\tx, y := testSplit(a), testSplit(b)\n\t\tif want := len(x) + len(y) - 2*lcsLen(x, y); edits != want {\n\t\t\tt.Fatalf(\"Lines(%q, %q) has %d edits, minimal is %d\", a, b, edits, want)\n\t\t}\n\t}\n}\n\nfunc TestHiddenLinesLarge(t *testing.T) {\n\tvar a, b strings.Builder\n\tfor i := 0; i < 1500; i++ {\n\t\tline := strings.Repeat(\"l\", i%7) + string(rune('A'+i%26)) + \"\\n\"\n\t\ta.WriteString(line)\n\t\tif i%10 == 5 {\n\t\t\tb.WriteString(\"changed\\n\")\n\t\t} else {\n\t\t\tb.WriteString(line)\n\t\t}\n\t}\n\tops := Lines(a.String(), b.String())\n\tins, del := 0, 0\n\tfor _, op := range ops {\n\t\tswitch op.Kind {\n\t\tcase Insert:\n\t\t\tins++\n\t\tcase Delete:\n\t\t\tdel++\n\t\t}\n\t}\n\tif ins != 150 || del != 150 {\n\t\tt.Fatalf(\"inserts=%d deletes=%d, want 150/150\", ins, del)\n\t}\n}\n\nfunc TestHiddenUnifiedIdentical(t *testing.T) {\n\tif got := Unified(\"a\", \"b\", \"x\\ny\\n\", \"x\\ny\\n\", 3); got != \"\" {\n\t\tt.Fatalf(\"got %q, want empty\", got)\n\t}\n\tif got := Unified(\"a\", \"b\", \"\", \"\", 3); got != \"\" {\n\t\tt.Fatalf(\"got %q, want empty\", got)\n\t}\n}\n\nfunc TestHiddenUnifiedRanges(t *testing.T) {\n\tcases := []struct {\n\t\tname string\n\t\ta, b string\n\t\tctx  int\n\t\twant string\n\t}{\n\t\t{\"single\", \"x\\n\", \"y\\n\", 3, \"@@ -1 +1 @@\\n-x\\n+y\\n\"},\n\t\t{\"insert into empty\", \"\", \"x\\ny\\n\", 3, \"@@ -0,0 +1,2 @@\\n+x\\n+y\\n\"},\n\t\t{\"delete all\", \"x\\n\", \"\", 3, \"@@ -1 +0,0 @@\\n-x\\n\"},\n\t\t{\"insert middle ctx0\", \"a\\nb\\n\", \"a\\nX\\nb\\n\", 0, \"@@ -1,0 +2 @@\\n+X\\n\"},\n\t\t{\"delete middle ctx0\", \"a\\nX\\nb\\n\", \"a\\nb\\n\", 0, \"@@ -2 +1,0 @@\\n-X\\n\"},\n\t\t{\"negative ctx is 0\", \"a\\nX\\nb\\n\", \"a\\nb\\n\", -5, \"@@ -2 +1,0 @@\\n-X\\n\"},\n\t\t{\"insert at end ctx1\", \"a\\nb\\n\", \"a\\nb\\nc\\n\", 1, \"@@ -2 +2,2 @@\\n b\\n+c\\n\"},\n\t\t{\"two separate ctx0\", \"a\\nb\\nc\\nd\\n\", \"a\\nX\\nb\\nd\\n\", 0, \"@@ -1,0 