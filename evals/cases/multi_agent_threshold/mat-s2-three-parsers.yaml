  semver/semver.go: "// Package semver parses Semantic Versioning 2.0.0 versions, orders them, and\n// evaluates npm-style version constraints against them.\npackage semver\n\nimport \"errors\"\n\n// ErrInvalidVersion is wrapped by every error Parse returns\n// (errors.Is(err, ErrInvalidVersion) is true).\nvar ErrInvalidVersion = errors.New(\"semver: invalid version\")\n\n// ErrInvalidConstraint is wrapped by every error Satisfies returns\n// (errors.Is(err, ErrInvalidConstraint) is true).\nvar ErrInvalidConstraint = errors.New(\"semver: invalid constraint\")\n\n// Version is a parsed semantic version.\n//\n// Prerelease and Build hold the dot-separated identifiers of the prerelease\n// and build-metadata parts, in order. Each is nil when the corresponding part\n// is absent from the input.\ntype Version struct {\n\tMajor, Minor, Patch uint64\n\tPrerelease          []string\n\tBuild               []string\n}\n\n// Parse parses a strict semantic version of the form\n//\n//\t[v]MAJOR.MINOR.PATCH[-PRERELEASE][+BUILD]\n//\n// Rules (any violation returns an error wrapping ErrInvalidVersion):\n//\n//   - An optional single leading lowercase \"v\" is accepted and ignored\n//     (\"v1.2.3\" parses like \"1.2.3\"). An uppercase \"V\", or more than one\n//     \"v\", is rejected.\n//   - MAJOR, MINOR and PATCH are exactly three non-empty decimal numbers\n//     (ASCII digits only) separated by \".\"; a number with more than one digit\n//     must not start with \"0\" (\"01.2.3\" is invalid, \"0.0.0\" is valid). Each\n//     must fit in a uint64.\n//   - PRERELEASE (after the first \"-\") and BUILD (after the first \"+\") are\n//     non-empty lists of \".\"-separated identifiers. Every identifier is\n//     non-empty and consists only of ASCII letters, digits and \"-\".\n//   - A prerelease identifier made only of digits must not have a leading\n//     zero unless it is exactly \"0\" (\"1.0.0-01\" is invalid, \"1.0.0-0a\" is\n//     valid). Build identifiers may have leading zeros (\"1.0.0+001\" is valid).\n//     Numeric prerelease identifiers are not limited in size.\n//   - No whitespace or any other character is allowed anywhere, including\n//     leading or trailing.\nfunc Parse(s string) (Version, error) {\n\treturn Version{}, errors.New(\"not implemented\")\n}\n\n// String formats v as MAJOR.MINOR.PATCH, followed by \"-\" and the prerelease\n// identifiers joined by \".\" if there are any, followed by \"+\" and the build\n// identifiers joined by \".\" if there are any. It never emits a \"v\" prefix.\n// Example: \"1.2.3-rc.1+build.5\".\nfunc (v Version) String() string {\n\treturn \"\"\n}\n\n// Compare returns -1 if a < b, 0 if a == b, and +1 if a > b, using SemVer\n// 2.0.0 precedence. a and b are assumed to be valid (as produced by Parse).\n//\n//   - Major, then Minor, then Patch are compared numerically.\n//   - When those are equal, a version without prerelease identifiers is\n//     greater than one with them (1.0.0-alpha < 1.0.0).\n//   - Two prerelease lists are compared identifier by identifier from left to\n//     right: identifiers consisting only of digits compare numerically\n//     (regardless of length, so \"11\" > \"9\"); other identifiers compare\n//     lexically in ASCII byte order; a numeric identifier is always less than\n//     a non-numeric one. If all identifiers of the shorter list equal the\n//     corresponding ones of the longer list, the shorter list is less\n//     (1.0.0-alpha < 1.0.0-alpha.1).\n//   - Build metadata is ignored entirely (1.0.0+a == 1.0.0+b).\nfunc Compare(a, b Version) int {\n\treturn 0\n}\n\n// Satisfies reports whether v satisfies constraint.\n//\n// Grammar: a constraint is one or more OR groups separated by \"||\". Each OR\n// group is one or more terms separated by whitespace; whitespace around \"||\"\n// is optional. The constraint is satisfied if at least one group is\n// satisfied, and a group is satisfied if all of its terms are satisfied.\n//\n// A term is an optional operator immediately followed (no whitespace) by a\n// version accepted by Parse (so \"v\" prefixes, prerelease and build parts are\n// allowed; build metadata is ignored as in Compare). The operators are\n// \"=\", \"!=\", \">\", \">=\", \"<\", \"<=\", \"^\" and \"~\"; a term with no operator means\n// \"=\". With X the term's version:\n//\n//   - \"=X\"  : Compare(v, X) == 0\n//   - \"!=X\" : Compare(v, X) != 0\n//   - \">X\", \">=X\", \"<X\", \"<=X\": the corresponding Compare relation.\n//   - \"~X\"  : Compare(v, X) >= 0 and v.Major == X.Major and v.Minor == X.Minor\n//     (the same rule for 0.x versions: ~0.0.3 matches 0.0.9).\n//   - \"^X\" with X.Major > 0: Compare(v, X) >= 0 and v.Major == X.Major\n//     (^1.2.3 matches 1.9.0, not 2.0.0 and not 2.0.0-alpha).\n//   - \"^X\" with X.Major == 0 and X.Minor > 0: Compare(v, X) >= 0 and\n//     v.Major == 0 and v.Minor == X.Minor (^0.2.3 matches 0.2.9, not 0.3.0).\n//   - \"^X\" with X.Major == 0 and X.Minor == 0: Compare(v, X) >= 0 and\n//     v.Major == 0 and v.Minor == 0 and v.Patch == X.Patch\n//     (^0.0.3 matches 0.0.3, not 0.0.4).\n//\n// Prerelease versions get no special treatment beyond the Compare ordering\n// used above (for example \">=1.0.0-alpha\" matches \"1.0.0-beta\", and \"<2.0.0\"\n// matches \"2.0.0-rc.1\").\n//\n// The whole constraint is validated before it is evaluated. If it is\n// malformed, Satisfies returns false and an error wrapping\n// ErrInvalidConstraint, even if some group would have matched. Malformed\n// includes: an empty or all-whitespace constraint, an empty OR group\n// (e.g. \"||\", \">=1.0.0 ||\"), an operator without a version or separated from\n// its version by whitespace (\">= 1.0.0\"), an unknown operator (\"=>1.0.0\",\n// \"==1.0.0\"), wildcards (\"*\", \"1.x\"), and any version that Parse rejects\n// (including partial versions such as \"1.2\").\nfunc Satisfies(v Version, constraint string) (bool, error) {\n\treturn false, errors.New(\"not implemented\")\n}\n"
  semver/visible_test.go: "package semver\n\nimport \"testing\"\n\nfunc TestParseBasic(t *testing.T) {\n\tv, err := Parse(\"1.2.3-beta.1+build.7\")\n\tif err != nil {\n\t\tt.Fatalf(\"Parse: %v\", err)\n\t}\n\tif v.Major != 1 || v.Minor != 2 || v.Patch != 3 {\n\t\tt.Fatalf(\"core = %d.%d.%d, want 1.2.3\", v.Major, v.Minor, v.Patch)\n\t}\n\tif got := v.String(); got != \"1.2.3-beta.1+build.7\" {\n\t\tt.Fatalf(\"String() = %q\", got)\n\t}\n}\n\nfunc TestCompareBasic(t *testing.T) {\n\ta, _ := Parse(\"1.2.3\")\n\tb, _ := Parse(\"1.10.0\")\n\tif Compare(a, b) != -1 || Compare(b, a) != 1 || Compare(a, a) != 0 {\n\t\tt.Fatalf(\"Compare(1.2.3, 1.10.0) ordering wrong\")\n\t}\n}\n\nfunc TestSatisfiesBasic(t *testing.T) {\n\tv, _ := Parse(\"1.4.0\")\n\tok, err := Satisfies(v, \">=1.2.0 <2.0.0\")\n\tif err != nil || !ok {\n\t\tt.Fatalf(\"Satisfies(1.4.0, >=1.2.0 <2.0.0) = %v, %v; want true, nil\", ok, err)\n\t}\n\tok, err = Satisfies(v, \"^2.0.0\")\n\tif err != nil || ok {\n\t\tt.Fatalf(\"Satisfies(1.4.0, ^2.0.0) = %v, %v; want false, nil\", ok, err)\n\t}\n}\n"
  ini/ini.go: "// Package ini parses INI configuration files with sections, quoted values and\n// lazily resolved ${...} interpolation.\npackage ini\n\nimport (\n\t\"errors\"\n\t\"io\"\n)\n\n// ErrBadReference is wrapped by the error Get returns when a value contains a\n// malformed interpolation reference.\nvar ErrBadReference = errors.New(\"ini: malformed reference\")\n\n// ErrUndefined is wrapped by the error Get returns when a value references a\n// key that is not defined.\nvar ErrUndefined = errors.New(\"ini: undefined reference\")\n\n// ErrCycle is wrapped by the error Get returns when resolving a value\n// requires resolving that same value again (for example \"a = ${a}\", or\n// \"a = ${b}\" with \"b = ${a}\").\nvar ErrCycle = errors.New(\"ini: reference cycle\")\n\n// ParseError describes a syntax error found by Parse.\ntype ParseError struct {\n\tLine int    // 1-based line number of the offending line\n\tMsg  string // human-readable description (content not specified)\n}\n\n// Error returns exactly fmt.Sprintf(\"ini: line %d: %s\", e.Line, e.Msg).\nfunc (e *ParseError) Error() string {\n\treturn \"\"\n}\n\n// File is a parsed INI document.\ntype File struct{}\n\n// Parse reads an entire INI document from r.\n//\n// If reading r fails, that read error is returned unchanged. Every syntax\n// error is returned as a *ParseError whose Line is the 1-based number of the\n// first offending line; parsing stops at the first error and the *File\n// result is then nil.\n//\n// Lines. Input is split on \"\\n\"; a single trailing \"\\r\" on a line is removed\n// (CRLF input is accepted). Every line, including blank and comment lines,\n// counts toward line numbers. The final line need not end with \"\\n\".\n// Leading and trailing spaces and tabs of each line are ignored. After that:\n//\n//   - An empty line is ignored.\n//   - A line starting with \";\" or \"#\" is a comment and is ignored.\n//   - A line starting with \"[\" is a section header (see below).\n//   - Any other line is a key/value line (see below).\n//\n// Section headers. The header is \"[\" name \"]\". Spaces and tabs around the\n// name inside the brackets are ignored (\"[ main ]\" is section \"main\"). After\n// the \"]\" only spaces/tabs may follow, optionally followed by a comment that\n// starts with \";\" or \"#\". It is a ParseError if there is no \"]\", if the\n// name is empty, if the name contains any character other than ASCII letters,\n// digits, \"_\" and \"-\" (in particular \".\" is not allowed), or if anything else\n// follows the \"]\". A header naming a section that already exists reopens it:\n// later keys are added to that same section.\n//\n// Key/value lines. The line is split at the first \"=\" or \":\" (whichever comes\n// first); a line with neither is a ParseError. The key is the text before the\n// separator with surrounding spaces/tabs removed; it must be non-empty and\n// consist only of ASCII letters, digits, \"_\", \"-\" and \".\", otherwise it is a\n// ParseError. Keys before the first section header belong to the global\n// section, whose name is \"\". Section and key names are case-sensitive. If a\n// key is assigned more than once in the same section (even across reopened\n// headers) the last assignment wins.\n//\n// Values. Let T be the text after the separator.\n//\n//   - Quoted: if T, after removing leading spaces/tabs, starts with a\n//     double quote, the value is the text up to the matching closing double\n//     quote. Inside the quotes `\\\"` stands for a double quote and `\\\\` for a\n//     backslash; any other backslash sequence, or a missing closing quote, is\n//     a ParseError. After the closing quote only spaces/tabs may follow,\n//     optionally followed by a comment starting with \";\" or \"#\" (which may\n//     directly follow the quote, as in `\"x\";c`); anything else is a\n//     ParseError. Spaces, \";\" and \"#\" inside the quotes are kept literally.\n//   - Unquoted: otherwise the value is T, cut at the first \";\" or \"#\" that is\n//     immediately preceded by a space or tab (that character and everything\n//     after it is an inline comment), with leading and trailing spaces/tabs\n//     removed. A \";\" or \"#\" not preceded by a space or tab is part of the\n//     value: \"a = b;c\" gives \"b;c\", \"a = b ;c\" gives \"b\", \"a =;c\" gives \";c\",\n//     and \"a = ;c\" gives \"\". Quote characters and backslashes inside an\n//     unquoted value are literal. An empty value (\"a =\") is allowed.\n//\n// Interpolation is not performed by Parse; see Get. A value containing a\n// malformed, undefined or cyclic reference does not make Parse fail.\nfunc Parse(r io.Reader) (*File, error) {\n\treturn nil, errors.New(\"not implemented\")\n}\n\n// Get returns the value of key in section (use \"\" for the global section).\n//\n// If the section or the key does not exist, Get returns (\"\", false, nil).\n//\n// Otherwise the stored value (quoted or not) is interpolated at call time:\n// each occurrence of \"${\" ... \"}\" (up to the first following \"}\") is a\n// reference and is replaced by the fully interpolated value of the key it\n// names. A \"$\" not followed by \"{\" is literal. The reference text is split at\n// its first \".\": \"${sec.key}\" names key \"key\" in section \"sec\" (\"${sec.a.b}\"\n// names key \"a.b\"), \"${.key}\" names key \"key\" in the global section, and\n// \"${key}\" (no \".\") names key \"key\" in the same section as the value being\n// interpolated (for a value reached through a reference, that is the\n// referenced value's own section). Text produced by substitution is not\n// scanned for further references; only stored values are interpolated.\n//\n// On failure Get returns (\"\", true, err) where err wraps:\n//\n//   - ErrBadReference for a \"${\" with no following \"}\", or when the section\n//     part of a dotted reference is non-empty and not a valid section name,\n//     or the key part is empty or not a valid key name (e.g. \"${}\", \"${a.}\",\n//     \"${a b}\");\n//   - ErrUndefined when a referenced section or key does not exist;\n//   - ErrCycle when resolution would revisit a value that is currently being\n//     resolved. The same key may be referenced several times without a cycle\n//     (e.g. \"x = ${y}${y}\" or two keys both referencing a third).\n//\n// A failure anywhere in the chain of references makes the outer Get fail with\n// that error.\nfunc (f *File) Get(section, key string) (string, bool, error) {\n\treturn \"\", false, errors.New(\"not implemented\")\n}\n\n// Sections returns the names of all sections in order of first appearance.\n// The global section \"\" is included (first) if and only if at least one key\n// was defined before the first section header. A section whose header\n// appears but which has no keys is still included. Each name appears once.\n// The returned slice is a fresh copy owned by the caller.\nfunc (f *File) Sections() []string {\n\treturn nil\n}\n"
  ini/visible_test.go: "package ini\n\nimport (\n\t\"strings\"\n\t\"testing\"\n)\n\nfunc TestParseBasic(t *testing.T) {\n\tsrc := \"name = demo\\n[server]\\nhost = localhost\\nport: 8080\\n\"\n\tf, err := Parse(strings.NewReader(src))\n\tif err != nil {\n\t\tt.Fatalf(\"Parse: %v\", err)\n\t}\n\tif v, ok, err := f.Get(\"server\", \"port\"); err != nil || !ok || v != \"8080\" {\n\t\tt.Fatalf(\"Get(server, port) = %q, %v, %v\", v, ok, err)\n\t}\n\tif v, ok, err := f.Get(\"\", \"name\"); err != nil || !ok || v != \"demo\" {\n\t\tt.Fatalf(\"Get(\\\"\\\", name) = %q, %v, %v\", v, ok, err)\n\t}\n\tgot := strings.Join(f.Sections(), \",\")\n\tif got != \",server\" {\n\t\tt.Fatalf(\"Sections() = %q\", f.Sections())\n\t}\n}\n\nfunc TestInterpolationBasic(t *testing.T) {\n\tsrc := \"[paths]\\nroot = /srv\\ndata = ${root}/data\\n[app]\\nlog = ${paths.data}/app.log\\n\"\n\tf, err := Parse(strings.NewReader(src))\n\tif err != nil {\n\t\tt.Fatalf(\"Parse: %v\", err)\n\t}\n\tif v, ok, err := f.Get(\"app\", \"log\"); err != nil || !ok || v != \"/srv/data/app.log\" {\n\t\tt.Fatalf(\"Get(app, log) = %q, %v, %v\", v, ok, err)\n\t}\n}\n\nfunc TestParseErrorLine(t *testing.T) {\n\t_, err := Parse(strings.NewReader(\"[a]\\nok = 1\\nbroken line\\n\"))\n\tpe, ok := err.(*ParseError)\n\tif !ok {\n\t\tt.Fatalf(\"want *ParseError, got %T (%v)\", err, err)\n\t}\n\tif pe.Line != 3 {\n\t\tt.Fatalf(\"Line = %d, want 3\", pe.Line)\n\t}\n}\n"
  cron/cron.go: "// Package cron parses standard 5-field cron expressions and computes the next\n// time a schedule fires.\npackage cron\n\nimport (\n\t\"errors\"\n\t\"time\"\n)\n\n// Schedule is a parsed cron expression.\ntype Schedule struct{}\n\n// Parse parses a 5-field cron expression:\n//\n//\tminute hour day-of-month month day-of-week\n//\n// Fields are separated by one or more spaces or tabs; leading and trailing\n// whitespace is ignored. Exactly five fields are required. Macros such as\n// \"@hourly\" are not supported.\n//\n// Allowed values per field:\n//\n//\tminute        0-59\n//\thour          0-23\n//\tday-of-month  1-31\n//\tmonth         1-12, or JAN FEB MAR APR MAY JUN JUL AUG SEP OCT NOV DEC\n//\tday-of-week   0-7 (0 and 7 are both Sunday), or SUN MON TUE WED THU FRI SAT\n//\n// Names are exactly the three-letter forms above, matched case-insensitively\n// (\"jan\", \"Mon\"), and are allowed only in their own field, anywhere a number\n// is allowed (including range endpoints, e.g. \"MON-FRI\"). A name is\n// converted to its number (JAN=1 ... DEC=12, SUN=0 ... SAT=6) before range\n// rules are applied, so \"SAT-SUN\" is a reversed range and an error, while\n// \"6-7\" is Saturday and Sunday. Numbers are written with ASCII digits only\n// (no sign); leading zeros are allowed (\"05\").\n//\n// A field is a comma-separated list of one or more items; empty items\n// (\"1,,2\", \"1,\") are errors. Each item is one of:\n//\n//   - \"*\": every allowed value (for day-of-week: 0-6).\n//   - \"N\": the single value N.\n//   - \"A-B\": every value from A to B inclusive; A must be <= B.\n//   - \"*/S\": every S-th value starting at the field minimum, i.e. min,\n//     min+S, min+2S, ... (for day-of-week, stepping over 0-6).\n//   - \"A-B/S\": A, A+S, A+2S, ... while <= B.\n//\n// S must be a decimal integer >= 1; it may exceed the range size (then only\n// the start value is selected). A step after a single value (\"5/15\") is an\n// error. Parse returns a non-nil error (and a nil *Schedule) for a wrong\n// number of fields, any value outside its field's range, an unknown name or\n// a name in the wrong field, a reversed range, a missing or zero or\n// non-numeric step, malformed items such as \"1-\", \"-1\", \"1-2-3\", \"*/\", or\n// any other unparseable text.\n//\n// Day matching: the day-of-month field counts as unrestricted exactly when\n// its text is \"*\"; likewise for day-of-week. If both fields are restricted,\n// a day matches when EITHER field matches it. Otherwise a day matches when\n// both match (an unrestricted field matches every day). For example\n// \"0 0 13 * FRI\" fires on every 13th and on every Friday, and\n// \"0 0 */2 * MON\" fires on odd days of the month and on Mondays, while\n// \"0 0 13 * *\" fires only on the 13th.\nfunc Parse(expr string) (*Schedule, error) {\n\treturn nil, errors.New(\"not implemented\")\n}\n\n// Next returns the earliest time t such that t is strictly after `after`,\n// t has zero seconds and nanoseconds, and t's minute, hour, day-of-month,\n// month and day-of-week — read on the wall clock of after.Location() — match\n// the schedule. The result is in after.Location(). Seconds and sub-seconds\n// of `after` are thus effectively truncated: for after = 10:00:30 the first\n// candidate is 10:01:00, and for after = 10:00:00 it is also 10:01:00.\n//\n// If the schedule can never match (for example \"0 0 30 2 *\" or\n// \"0 0 31 4,6,9,11 *\"), Next returns the zero time.Time. A schedule that\n// matches only on February 29 must still be found, even across a century\n// year that is not a leap year (after 2096-03-01 the next Feb 29 is in 2104).\n//\n// Results are specified for locations whose UTC offset does not change\n// within the searched interval (such as time.UTC or a time.FixedZone);\n// across daylight-saving transitions the result is unspecified, except that\n// Next must still terminate and must not return a time that is not after\n// `after` (other than the zero time).\nfunc (s *Schedule) Next(after time.Time) time.Time {\n\treturn time.Time{}\n}\n"
  cron/visible_test.go: "package cron\n\nimport (\n\t\"testing\"\n\t\"time\"\n)\n\nfunc TestNextEvery15Minutes(t *testing.T) {\n\ts, err := Parse(\"*/15 * * * *\")\n\tif err != nil {\n\t\tt.Fatalf(\"Parse: %v\", err)\n\t}\n\tafter := time.Date(2024, 5, 10, 10, 7, 30, 0, time.UTC)\n\twant := time.Date(2024, 5, 10, 10, 15, 0, 0, time.UTC)\n\tif got := s.Next(after); !got.Equal(want) {\n\t\tt.Fatalf(\"Next(%v) = %v, want %v\", after, got, want)\n\t}\n}\n\nfunc TestNextWeekdays(t *testing.T) {\n\ts, err := Parse(\"30 9 * * MON-FRI\")\n\tif err != nil {\n\t\tt.Fatalf(\"Parse: %v\", err)\n\t}\n\tafter := time.Date(2024, 3, 1, 10, 0, 0, 0, time.UTC) // Friday\n\twant := time.Date(2024, 3, 4, 9, 30, 0, 0, time.UTC)  // Monday\n\tif got := s.Next(after); !got.Equal(want) {\n\t\tt.Fatalf(\"Next(%v) = %v, want %v\", after, got, want)\n\t}\n}\n\nfunc TestParseWrongFieldCount(t *testing.T) {\n\tif _, err := Parse(\"* * * *\"); err == nil {\n\t\tt.Fatal(\"Parse with 4 fields: expected error\")\n\t}\n}\n"
task: 'Three packages in this module are stubs: semver, ini and cron. Implement each one to the contract in its doc comment so that `go test ./...` passes. The packages are independent of each other. Do not modify tests.'
expect:
  program: bash
  args:
