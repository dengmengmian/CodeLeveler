  - "set -euo pipefail\ngit diff --quiet HEAD -- '*_test.go'\nmkdir -p \"$(dirname 'semver/zz_hidden_test.go')\"\ncat > 'semver/zz_hidden_test.go' <<'HIDDEN_EOF'\npackage semver\n\nimport (\n\t\"errors\"\n\t\"testing\"\n)\n\nfunc mustParse(t *testing.T, s string) Version {\n\tt.Helper()\n\tv, err := Parse(s)\n\tif err != nil {\n\t\tt.Fatalf(\"Parse(%q): unexpected error %v\", s, err)\n\t}\n\treturn v\n}\n\nfunc TestHiddenParseValid(t *testing.T) {\n\tcases := []struct{ in, str string }{\n\t\t{\"0.0.0\", \"0.0.0\"},\n\t\t{\"v1.2.3\", \"1.2.3\"},\n\t\t{\"10.20.30\", \"10.20.30\"},\n\t\t{\"1.0.0-0a\", \"1.0.0-0a\"},\n\t\t{\"1.0.0-alpha-1.0\", \"1.0.0-alpha-1.0\"},\n\t\t{\"1.0.0+001\", \"1.0.0+001\"},\n\t\t{\"1.0.0-x.7.z.92+exp.sha.5114f85\", \"1.0.0-x.7.z.92+exp.sha.5114f85\"},\n\t\t{\"1.0.0-99999999999999999999999\", \"1.0.0-99999999999999999999999\"},\n\t\t{\"18446744073709551615.0.0\", \"18446744073709551615.0.0\"},\n\t}\n\tfor _, c := range cases {\n\t\tv := mustParse(t, c.in)\n\t\tif got := v.String(); got != c.str {\n\t\t\tt.Errorf(\"Parse(%q).String() = %q, want %q\", c.in, got, c.str)\n\t\t}\n\t}\n}\n\nfunc TestHiddenParseFields(t *testing.T) {\n\tv := mustParse(t, \"v4.5.6-rc.1+b.2\")\n\tif v.Major != 4 || v.Minor != 5 || v.Patch != 6 {\n\t\tt.Errorf(\"core = %d.%d.%d\", v.Major, v.Minor, v.Patch)\n\t}\n\tif len(v.Prerelease) != 2 || v.Prerelease[0] != \"rc\" || v.Prerelease[1] != \"1\" {\n\t\tt.Errorf(\"Prerelease = %#v\", v.Prerelease)\n\t}\n\tif len(v.Build) != 2 || v.Build[0] != \"b\" || v.Build[1] != \"2\" {\n\t\tt.Errorf(\"Build = %#v\", v.Build)\n\t}\n\tplain := mustParse(t, \"1.2.3\")\n\tif plain.Prerelease != nil || plain.Build != nil {\n\t\tt.Errorf(\"absent parts must be nil: %#v\", plain)\n\t}\n}\n\nfunc TestHiddenParseInvalid(t *testing.T) {\n\tbad := []string{\n\t\t\"\", \"1\", \"1.2\", \"1.2.3.4\", \"01.2.3\", \"1.02.3\", \"1.2.03\",\n\t\t\"V1.2.3\", \"vv1.2.3\", \" 1.2.3\", \"1.2.3 \", \"1.2.3-\", \"1.2.3+\",\n\t\t\"1.2.3-01\", \"1.2.3-a..b\", 