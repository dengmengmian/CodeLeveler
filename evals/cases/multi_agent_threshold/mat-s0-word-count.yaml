id: mat-s0-word-count
name: S0 tiny workload
max_rounds: 30
files:
  go.mod: |
    module evalcase

    go 1.21
  words/words.go: "package words\n\n// Count returns the number of words in s. A word is a maximal run of\n// characters that are not Unicode white space (unicode.IsSpace).\nfunc Count(s string) int {\n\treturn 0\n}\n"
  words/words_test.go: "package words\n\nimport \"testing\"\n\nfunc TestCount(t *testing.T) {\n\tif got := Count(\"hello  world\"); got != 2 {\n\t\tt.Fatal(got)\n\t}\n}\n"
task: Implement Count in words/words.go to the contract in its doc comment. Do not modify tests.
expect:
  program: bash
  args:
  - -c
  - "set -euo pipefail\ngit diff --quiet HEAD -- '*_test.go'\nmkdir -p \"$(dirname 'words/zz_hidden_test.go')\"\ncat > 'words/zz_hidden_test.go' <<'HIDDEN_EOF'\npackage words\n\nimport \"testing\"\n\nfunc TestHiddenCount(t *testing.T) {\n\tfor in, want := range map[string]int{\"\": 0, \"   \": 0, \"a\": 1, \" a b \": 2, \"tab\\tsep\\nline\": 3, \"\\u3000全角\\u3000空格\": 2, \"one,two\": 1} {\n\t\tif got := Count(in); got != want {\n\t\t\tt.Fatalf(\"%q: %d want %d\", in, got, want)\n\t\t}\n\t}\n}\nHIDDEN_EOF\ngo test ./...\n"
