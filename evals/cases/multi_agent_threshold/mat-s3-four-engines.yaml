\", got)\n\t}\n}\nHIDDEN_EOF\nmkdir -p \"$(dirname 'jsonpath/zz_hidden_test.go')\"\ncat > 'jsonpath/zz_hidden_test.go' <<'HIDDEN_EOF'\npackage jsonpath\n\nimport (\n\t\"encoding/json\"\n\t\"errors\"\n\t\"testing\"\n)\n\nconst hiddenStore = `{\n  \"store\": {\n    \"book\": [\n      {\"category\":\"reference\",\"author\":\"Nigel Rees\",\"title\":\"Sayings of the Century\",\"price\":8.95},\n      {\"category\":\"fiction\",\"author\":\"Evelyn Waugh\",\"title\":\"Sword of Honour\",\"price\":12.99},\n      {\"category\":\"fiction\",\"author\":\"Herman Melville\",\"title\":\"Moby Dick\",\"isbn\":\"0-553-21311-3\",\"price\":8.99},\n      {\"category\":\"fiction\",\"author\":\"J. R. R. Tolkien\",\"title\":\"The Lord of the Rings\",\"isbn\":\"0-395-19395-8\",\"price\":22.99}\n    ],\n    \"bicycle\": {\"color\":\"red\",\"price\":19.95}\n  },\n  \"expensive\": 10\n}`\n\ntype hiddenCase struct {\n\tdoc  string\n\tpath string\n\twant string // JSON encoding of the result slice\n}\n\nfunc hiddenRun(t *testing.T, cases []hiddenCase) {\n\tt.Helper()\n\tfor _, c := range cases {\n\t\tvar doc any\n\t\tif err := json.Unmarshal([]byte(c.doc), &doc); err != nil {\n\t\t\tt.Fatalf(\"bad test doc: %v\", err)\n\t\t}\n\t\tgot, err := Query(doc, c.path)\n\t\tif err != nil {\n\t\t\tt.Errorf(\"Query(%q): unexpected error %v\", c.path, err)\n\t\t\tcontinue\n\t\t}\n\t\tif got == nil {\n\t\t\tt.Errorf(\"Query(%q): returned nil slice, want non-nil\", c.path)\n\t\t\tcontinue\n\t\t}\n\t\tb, err := json.Marshal(got)\n\t\tif err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t\tif string(b) != c.want {\n\t\t\tt.Errorf(\"Query(%q) = %s, want %s\", c.path, b, c.want)\n\t\t}\n\t}\n}\n\nfunc TestHiddenBasicSelectors(t *testing.T) {\n\td := hiddenStore\n\thiddenRun(t, []hiddenCase{\n\t\t{d, \"$.store.book[0].title\", `[\"Sayings of the Century\"]`},\n\t\t{d, \"$['store']['bicycle']['color']\", `[\"red\"]`},\n\t\t{d, \"$.store['bicycle'].price\", `[19.95]`},\n\t\t{d, \"$.store.book[-1].author\", `[\"J. R. R. Tolkien