  expr/expr.go: "// Package expr implements a small, dynamically typed expression language.\n//\n// # Values\n//\n// Every expression evaluates to a Value of one of three kinds: Number\n// (float64), String, or Bool. A Value only uses the field matching its Kind;\n// all other fields are zero, so results can be compared with ==. The zero\n// Value has Kind Invalid and is what Eval returns alongside an error.\n//\n// # Lexical rules\n//\n//   - Whitespace (space, tab, '\\n', '\\r') between tokens is ignored.\n//   - Number literals: one or more ASCII digits, optionally followed by '.' and\n//     one or more digits (\"12\", \"3.25\"). There are no exponents, no leading\n//     '.', and a '.' not followed by a digit is not part of the number (so\n//     \"1.\" is the number 1 followed by an invalid character '.').\n//   - String literals: double-quoted. Supported escapes are \\\" \\\\ \\n \\t; any\n//     other backslash sequence is a syntax error located at the backslash. A\n//     string with no closing quote is a syntax error located at its opening\n//     quote.\n//   - The keywords true and false are Bool literals.\n//   - Identifiers: [A-Za-z_][A-Za-z0-9_]* (other than true/false). An\n//     identifier immediately followed (after optional whitespace) by '(' is a\n//     function call; otherwise it is a variable reference.\n//   - Operators and punctuation: + - * / % < <= > >= == != ! && || ( ) ,\n//     Two-character operators are matched first. Any other character\n//     (including a lone '=', '&' or '|') is a syntax error at its offset.\n//\n// # Grammar and precedence\n//\n// From lowest to highest precedence; every binary level is left associative:\n//\n//\t||\n//\t&&\n//\t==  !=\n//\t<  <=  >  >=\n//\t+  -\n//\t*  /  %\n//\tunary -  !      (prefix, may be repeated: \"--1\", \"!!true\")\n//\tprimary: number | string | true | false | identifier\n//\t         | identifier \"(\" [ expr { \",\" expr } ] \")\" | \"(\" expr \")\"\n//\n// So \"1 < 2 < 3\" parses as \"(1 < 2) < 3\" (a type error), and \"-7 % 3\" is\n// \"(-7) % 3\".\n//\n// # Semantics\n//\n//   - + adds two Numbers or concatenates two Strings; any other combination is\n//     a type error.\n//   - - * / % require two Numbers. % is math.Mod (the result has the sign of\n//     the dividend). A zero right operand of / or % is an error.\n//   - < <= > >= require two Numbers or two Strings (strings compare bytewise,\n//     as Go's < on strings); result is Bool.\n//   - == and != require both operands to have the same Kind (otherwise a type\n//     error) and compare by value; result is Bool.\n//   - Unary - requires a Number; ! requires a Bool.\n//   - && and || require Bool operands and short-circuit: the right operand is\n//     not evaluated when the left operand decides the result (false && ... ,\n//     true || ...), so errors it would raise do not occur. The left operand\n//     is checked for Bool before short-circuiting.\n//   - For every other binary operator both operands are evaluated, left then\n//     right, before the operator checks their kinds. The first error raised in\n//     that order is the one returned.\n//   - Variables are looked up in vars (which may be nil); a missing name is an\n//     error.\n//\n// # Functions\n//\n// A call is processed in this order: the name is resolved (unknown name is an\n// error), the argument count is checked (wrong count is an error), then the\n// arguments are evaluated and checked.\n//\n//   - min(n, ...) / max(n, ...): one or more Number arguments; returns the\n//     smallest / largest.\n//   - len(s): exactly one String argument; returns the number of Unicode code\n//     points (runes) as a Number.\n//   - abs(n): exactly one Number argument; returns its absolute value.\n//   - if(cond, a, b): exactly three arguments. cond is evaluated first and must\n//     be Bool; then only a (when true) or only b (when false) is evaluated and\n//     returned. The branch not taken is never evaluated.\n//\n// For min, max, len and abs all arguments are evaluated left to right first,\n// then their kinds are checked in argument order.\n//\n// # Errors\n//\n// Eval parses the whole input before evaluating anything, so a syntax error\n// anywhere is reported even if evaluation would have failed earlier. Parsing\n// scans left to right and reports the first problem found. After a complete\n// expression, any remaining token is a syntax error at that token.\n//\n// Every error returned by Eval is a *Error. Pos is a 0-based byte offset into\n// src, determined as follows:\n//\n//   - unexpected token / invalid character: offset of that token/character;\n//   - unexpected end of input (including empty input): len(src);\n//   - unterminated string: offset of the opening quote; invalid escape: offset\n//     of the backslash;\n//   - unknown variable, unknown function, wrong argument count: offset of the\n//     identifier;\n//   - type error or division/modulo by zero in a binary operator (including\n//     && and ||): offset of the operator token;\n//   - type error in a unary operator: offset of the operator token;\n//   - type error in a function argument (including a non-Bool if condition):\n//     offset of the first token of that argument expression.\n//\n// Msg is a non-empty human-readable description whose wording is not\n// specified.\npackage expr\n\nimport \"errors\"\n\n// Kind identifies which field of a Value is meaningful.\ntype Kind int\n\nconst (\n\t// Invalid is the Kind of the zero Value.\n\tInvalid Kind = iota\n\t// Number values use Value.Num.\n\tNumber\n\t// String values use Value.Str.\n\tString\n\t// Bool values use Value.Bool.\n\tBool\n)\n\n// Value is a tagged union. Only the field selected by Kind is set; the others\n// are zero.\ntype Value struct {\n\tKind Kind\n\tNum  float64\n\tStr  string\n\tBool bool\n}\n\n// Error describes a syntax or evaluation error at byte offset Pos of the\n// source.\ntype Error struct {\n\tPos int\n\tMsg string\n}\n\n// Error formats the error exactly as fmt.Sprintf(\"offset %d: %s\", Pos, Msg).\nfunc (e *Error) Error() string {\n\treturn \"\"\n}\n\n// Eval parses src and evaluates it with the given variables. On success it\n// returns the resulting Value and a nil error. On failure it returns the zero\n// Value and a *Error as described in the package documentation.\nfunc Eval(src string, vars map[string]Value) (Value, error) {\n\treturn Value{}, errors.New(\"not implemented\")\n}\n"
  expr/visible_test.go: "package expr\n\nimport (\n\t\"errors\"\n\t\"testing\"\n)\n\nfunc TestArithmetic(t *testing.T) {\n\tgot, err := Eval(\"1 + 2 * 3\", nil)\n\tif err != nil {\n\t\tt.Fatalf(\"unexpected error: %v\", err)\n\t}\n\tif want := (Value{Kind: Number, Num: 7}); got != want {\n\t\tt.Fatalf(\"got %+v, want %+v\", got, want)\n\t}\n}\n\nfunc TestVariablesAndStrings(t *testing.T) {\n\tvars := map[string]Value{\"name\": {Kind: String, Str: \"world\"}}\n\tgot, err := Eval(`\"hello \" + name`, vars)\n\tif err != nil {\n\t\tt.Fatalf(\"unexpected error: %v\", err)\n\t}\n\tif want := (Value{Kind: String, Str: \"hello world\"}); got != want {\n\t\tt.Fatalf(\"got %+v, want %+v\", got, want)\n\t}\n}\n\nfunc TestDivisionByZeroPosition(t *testing.T) {\n\t_, err := Eval(\"4 / 0\", nil)\n\tvar e *Error\n\tif !errors.As(err, &e) {\n\t\tt.Fatalf(\"expected *Error, got %v\", err)\n\t}\n\tif e.Pos != 2 {\n\t\tt.Fatalf(\"got Pos %d, want 2\", e.Pos)\n\t}\n}\n"
  jsonpath/jsonpath.go: "// Package jsonpath evaluates a JSONPath dialect over documents decoded by\n// encoding/json into interface values: map[string]any (objects), []any\n// (arrays), float64, string, bool and nil. Any other Go value is treated as a\n// scalar (it has no children and no members).\n//\n// # Evaluation model\n//\n// A path is \"$\" followed by zero or more segments. Evaluation keeps an ordered\n// list of nodes, initially just the document. Each segment is applied to every\n// node of the list in order, and the per-node results are concatenated (in\n// that order) to form the next list. \"$\" alone returns the document itself as\n// the single result. Results are the values in the document (not copies).\n//\n// The children of a node are: for an array, its elements in index order; for\n// an object, its member values in ascending (byte-wise, as sort.Strings) key\n// order; for anything else, none.\n//\n// # Segments\n//\n//   - .name — member \"name\" of an object. name must match\n//     [A-Za-z_][A-Za-z0-9_]*; use the bracket form for other keys.\n//   - .* and [*] — all children of the node (arrays and objects).\n//   - ['name'] — member by quoted name. Quoted strings use single quotes; the\n//     only escapes are \\' and \\\\ (any other backslash sequence is a syntax\n//     error).\n//   - ['a','b',...] — union of member names: each listed member that exists,\n//     in the listed order (a name listed twice yields its value twice).\n//   - [n] — array element n; negative n counts from the end (n + len). Out of\n//     range yields nothing.\n//   - [n,m,...] — union of indices, each resolved like [n], in the listed order\n//     (duplicates are kept). A union contains only integers or only quoted\n//     names; mixing them, or putting a slice in a union, is a syntax error.\n//   - [start:end] and [start:end:step] — array slice with Python semantics.\n//     Each of start, end, step may be omitted (\"[:2]\", \"[1:]\", \"[::2]\",\n//     \"[::-1]\", \"[:]\"); step defaults to 1 and a step of 0 is a syntax error.\n//     With len = array length: negative start/end have len added. For step > 0,\n//     start defaults to 0, end to len, both are clamped to [0, len], and the\n//     indices start, start+step, ... while < end are selected. For step < 0,\n//     start defaults to len-1, end defaults to \"before the first element\",\n//     given values are clamped to [-1, len-1], and indices start, start+step,\n//     ... while > end are selected.\n//   - [?(expr)] — filter: the children of the node (see above, in that order)\n//     for which expr is true.\n//   - ..name — recursive descent: every descendant of the node that is the\n//     value of an object member whose key is name.\n//   - ..* — every descendant of the node.\n//\n// Descendants are enumerated in pre-order: for each child of the node (in\n// child order), the child itself comes first, immediately followed by all of\n// that child's own descendants, before the next child. The node itself is not\n// its own descendant. For example, on {\"a\":{\"b\":1},\"b\":2} the path \"$..b\"\n// yields [1, 2], and \"$..*\" yields [{\"b\":1}, 1, 2]. Only \"..name\" and \"..*\"\n// are allowed after \"..\"; anything else (such as \"..[0]\") is a syntax error.\n//\n// Selectors that do not apply to a node's type (a name on an array, an index,\n// slice on an object or scalar, a wildcard or filter on a scalar) yield\n// nothing for that node; missing members and out-of-range indices also yield\n// nothing. These are never errors.\n//\n// # Filter expressions\n//\n//\texpr    := and { \"||\" and }\n//\tand     := atom { \"&&\" atom }\n//\tatom    := \"(\" expr \")\" | operand [ op literal ]\n//\toperand := \"@\" { \".\" name }\n//\top      := \"==\" | \"!=\" | \"<\" | \"<=\" | \">\" | \">=\"\n//\tliteral := number | quoted-string | true | false | null\n//\n// && binds tighter than ||. A number literal is an optional '-', one or more\n// digits, and an optional '.' followed by one or more digits. The operand \"@\"\n// is the current child; each \".name\" steps into an object member (name as for\n// the .name segment).\n//\n//   - An operand without an operator is an existence test: true when every\n//     step resolves (the value may be null or false). Bare \"@\" always exists.\n//   - When the operand does not resolve (a step hits a missing member or a\n//     non-object), every comparison, including !=, is false.\n//   - == is true when the operand and literal have the same JSON type (number,\n//     string, bool, null) and equal values; != is its negation (so an object,\n//     an array, or a value of another type is != any literal).\n//   - < <= > >= are true only when both sides are numbers or both are strings\n//     (strings compare byte-wise); otherwise false.\n//\n// # Syntax\n//\n// The path must start with \"$\". Outside brackets no whitespace is allowed.\n// Inside brackets, space characters (' ') may appear between tokens (after\n// '[', before ']', around ',', ':', operators, parentheses, \"&&\", \"||\"), but\n// not inside a token: an integer's '-' must be directly followed by its\n// digits, and a member step \".name\" in a filter operand must directly follow\n// \"@\" or the previous step.\n//\n// The whole path is parsed before evaluation, so a syntax error is reported\n// regardless of the document. Syntax errors include: a missing \"$\", a\n// trailing \".\" or \"..\", an invalid name after \".\" or \"..\", an unterminated or\n// empty bracket, an unterminated string, an invalid escape, an unknown\n// literal word in a filter, a malformed number or integer, a missing ')' or\n// ']', unexpected characters, and a zero slice step.\npackage jsonpath\n\nimport \"errors\"\n\n// ErrSyntax is the sentinel for invalid paths. Every error returned by Query\n// satisfies errors.Is(err, ErrSyntax).\nvar ErrSyntax = errors.New(\"jsonpath: syntax error\")\n\n// Query evaluates path against doc and returns the matched values in the\n// order defined in the package documentation. When the path is valid but\n// nothing matches, it returns a non-nil empty slice and a nil error. When the\n// path is invalid, it returns a nil slice and an error wrapping ErrSyntax.\nfunc Query(doc any, path string) ([]any, error) {\n\treturn nil, errors.New(\"not implemented\")\n}\n"
  jsonpath/visible_test.go: "package jsonpath\n\nimport (\n\t\"encoding/json\"\n\t\"testing\"\n)\n\nfunc decodeVisible(t *testing.T, s string) any {\n\tt.Helper()\n\tvar v any\n\tif err := json.Unmarshal([]byte(s), &v); err != nil {\n\t\tt.Fatal(err)\n\t}\n\treturn v\n}\n\nfunc encodeVisible(t *testing.T, v any) string {\n\tt.Helper()\n\tb, err := json.Marshal(v)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\treturn string(b)\n}\n\nconst visibleDoc = `{\"store\":{\"book\":[{\"title\":\"A\",\"price\":8},{\"title\":\"B\",\"price\":12}],\"name\":\"shop\"}}`\n\nfunc TestChildAndIndex(t *testing.T) {\n\tdoc := decodeVisible(t, visibleDoc)\n\tgot, err := Query(doc, \"$.store.book[1].title\")\n\tif err != nil {\n\t\tt.Fatalf(\"unexpected error: %v\", err)\n\t}\n\tif s := encodeVisible(t, got); s != `[\"B\"]` {\n\t\tt.Fatalf(\"got %s, want [\\\"B\\\"]\", s)\n\t}\n}\n\nfunc TestWildcard(t *testing.T) {\n\tdoc := decodeVisible(t, visibleDoc)\n\tgot, err := Query(doc, \"$.store.book[*].price\")\n\tif err != nil {\n\t\tt.Fatalf(\"unexpected error: %v\", err)\n\t}\n\tif s := encodeVisible(t, got); s != `[8,12]` {\n\t\tt.Fatalf(\"got %s, want [8,12]\", s)\n\t}\n}\n\nfunc TestFilter(t *testing.T) {\n\tdoc := decodeVisible(t, visibleDoc)\n\tgot, err := Query(doc, \"$.store.book[?(@.price < 10)].title\")\n\tif err != nil {\n\t\tt.Fatalf(\"unexpected error: %v\", err)\n\t}\n\tif s := encodeVisible(t, got); s != `[\"A\"]` {\n\t\tt.Fatalf(\"got %s, want [\\\"A\\\"]\", s)\n\t}\n}\n"
  textdiff/textdiff.go: "// Package textdiff computes minimal line-based diffs, renders them in the\n// unified diff format, and applies unified diffs back onto text.\n//\n// # Lines\n//\n// Text is split into lines after every '\\n'. Each line keeps its terminating\n// '\\n'; only the final line of a text may lack one. The empty string has zero\n// lines, \"a\\n\" has one line (\"a\\n\"), and \"a\\nb\" has two lines (\"a\\n\", \"b\").\n// Two lines are equal only if they are byte-for-byte identical, so \"a\\n\" and\n// \"a\" are different lines.\npackage textdiff\n\nimport \"errors\"\n\n// Kind is the kind of an edit operation.\ntype Kind int\n\nconst (\n\t// Equal: the line is present in both texts.\n\tEqual Kind = iota\n\t// Insert: the line is present only in the new text.\n\tInsert\n\t// Delete: the line is present only in the old text.\n\tDelete\n)\n\n// Op is one line of an edit script.\ntype Op struct {\n\tKind Kind\n\t// Text is the whole line, including its terminating '\\n' when it has one.\n\tText string\n}\n\n// ErrMalformed is matched (via errors.Is) by every Apply error that can be\n// detected from the diff text alone, without looking at the original.\nvar ErrMalformed = errors.New(\"textdiff: malformed diff\")\n\n// ErrMismatch is matched (via errors.Is) by every Apply error caused by the\n// diff not fitting the original text.\nvar ErrMismatch = errors.New(\"textdiff: diff does not apply\")\n\n// Lines returns an edit script turning a into b.\n//\n// Concatenating the Text of the Equal and Delete ops, in order, yields a;\n// concatenating the Text of the Equal and Insert ops, in order, yields b.\n//\n// The script is minimal: the number of Insert plus Delete ops is as small as\n// possible (equivalently, the Equal ops form a longest common subsequence of\n// the two line sequences).\n//\n// Among all minimal scripts, the one returned is determined as follows. Scan\n// with a position i in a's lines and j in b's lines, both starting at 0:\n//\n//   - if both lines remain and a[i] == b[j], emit Equal and advance both;\n//   - otherwise, if a line of a remains and emitting Delete for a[i] still\n//     allows a minimal script (i.e. the longest common subsequence of a[i+1:]\n//     and b[j:] is as long as that of a[i:] and b[j:]; this is always true\n//     when b is exhausted), emit Delete and advance i;\n//   - otherwise emit Insert for b[j] and advance j.\n//\n// This is exactly the lexicographically smallest minimal script under the\n// order Equal < Delete < Insert. Consequences: equal lines are matched as\n// early as possible, and inside every maximal run of non-Equal ops all Delete\n// ops come before all Insert ops.\n//\n// If both texts are empty the result has length 0.\nfunc Lines(a, b string) []Op {\n\treturn nil\n}\n\n// Unified renders the diff from a to b in unified format using Lines(a, b).\n//\n// If a == b the result is the empty string. Otherwise the result is\n//\n//\t\"--- \" + aName + \"\\n\"\n//\t\"+++ \" + bName + \"\\n\"\n//\n// followed by one or more hunks and nothing else (no timestamps).\n//\n// Hunks: a negative context is treated as 0. Each hunk covers a group of\n// changes (Insert/Delete ops) plus up to context Equal lines before its first\n// change and up to context Equal lines after its last change (fewer at the\n// start or end of the text). Two consecutive changes separated by a run of g\n// Equal lines belong to the same hunk if g <= 2*context (all g lines are then\n// shown), and to separate hunks otherwise.\n//\n// Each hunk starts with the header \"@@ -R +R @@\\n\", the first range describing\n// the old text (a) and the second the new text (b). For a side with count\n// lines in the hunk:\n//\n//   - count == 1: R is \"L\", where L is the 1-based number of that line;\n//   - count >= 2: R is \"L,count\", where L is the 1-based number of the first line;\n//   - count == 0: R is \"L,0\", where L is the number of lines of that side that\n//     precede the hunk (0 at the start of the text).\n//\n// The header is followed by one line per op of the hunk, in script order:\n// ' ' for Equal, '-' for Delete, '+' for Insert, then the op's Text. If that\n// Text does not end in '\\n' (the last line of a text without a final newline),\n// the output line is followed by \"\\n\\\\ No newline at end of file\\n\" instead,\n// i.e. a '\\n' and then the marker line `\\ No newline at end of file`.\n// The result therefore always ends with '\\n'.\n//\n// Example: Unified(\"a\", \"b\", \"x\\n\", \"y\\n\", 3) ==\n// \"--- a\\n+++ b\\n@@ -1 +1 @@\\n-x\\n+y\\n\".\nfunc Unified(aName, bName, a, b string, context int) string {\n\treturn \"\"\n}\n\n// Apply applies a unified diff to original strictly and returns the new text.\n// For any a, b, names and context: Apply(a, Unified(aName, bName, a, b, context)) == b.\n//\n// An empty diff returns original unchanged. Otherwise the diff must satisfy\n// all of the following, or Apply returns an error matching ErrMalformed:\n//\n//   - it ends with '\\n'; every line below is a '\\n'-terminated line of it;\n//   - line 1 starts with \"--- \" and line 2 starts with \"+++ \" (names ignored);\n//   - at least one hunk follows, and nothing follows the last hunk;\n//   - each hunk header is exactly \"@@ -L[,N] +L[,N] @@\" (decimal numbers, an\n//     omitted \",N\" meaning a count of 1, nothing before or after), and the\n//     old and new counts are not both 0; when a count is at least 1 its L\n//     must be at least 1;\n//   - the header is followed by exactly as many body lines as its counts\n//     require: lines starting with ' ' count toward both sides, '-' toward\n//     the old side, '+' toward the new side; the hunk ends as soon as both\n//     counts are reached (an optional marker line may still follow, see\n//     below); any other line (including an empty line) where a body line is\n//     expected, or a body line exceeding a count, is malformed;\n//   - a line exactly `\\ No newline at end of file` is only allowed directly\n//     after a body line, and means that body line has no terminating '\\n'.\n//     The marked line must be the last old-side line of its hunk (for ' ' and\n//     '-') and the last new-side line of its hunk (for ' ' and '+'), and its\n//     hunk must be the last hunk;\n//   - hunks are in ascending order and do not overlap: the old start of each\n//     hunk (line index L-1 when the old count is at least 1, or insertion\n//     point L when it is 0) is not before the end of the previous hunk's old\n//     range;\n//   - the new-side L is consistent with the old-side L: the number of new\n//     lines preceding the hunk equals the number of old lines preceding it\n//     plus (new count - old count) summed over all previous hunks, and L is\n//     derived from that number with the same rules Unified uses.\n//\n// Applying: original lines before each hunk's old start are copied unchanged;\n// every ' ' and '-' body line must equal the next original line exactly,\n// including the presence or absence of its '\\n'; ' ' and '+' lines are\n// written to the result; original lines after the last hunk are copied\n// unchanged. Apply returns an error matching ErrMismatch if a hunk starts\n// beyond the end of original, a ' ' or '-' line does not match (or original\n// has no more lines), or a '+' line marked as having no newline would be\n// followed by copied original lines.\nfunc Apply(original, diff string) (string, error) {\n\treturn \"\", errors.New(\"not implemented\")\n}\n"
  textdiff/visible_test.go: "package textdiff\n\nimport (\n\t\"reflect\"\n\t\"testing\"\n)\n\nfunc TestLinesBasic(t *testing.T) {\n\tgot := Lines(\"a\\nb\\nc\\n\", \"a\\nx\\nc\\n\")\n\twant := []Op{{Equal, \"a\\n\"}, {Delete, \"b\\n\"}, {Insert, \"x\\n\"}, {Equal, \"c\\n\"}}\n\tif !reflect.DeepEqual(got, want) {\n\t\tt.Fatalf(\"Lines = %#v, want %#v\", got, want)\n\t}\n}\n\nfunc TestUnifiedBasic(t *testing.T) {\n\tgot := Unified(\"old.txt\", \"new.txt\", \"a\\nb\\nc\\n\", \"a\\nx\\nc\\n\", 1)\n\twant := \"--- old.txt\\n+++ new.txt\\n@@ -1,3 +1,3 @@\\n a\\n-b\\n+x\\n c\\n\"\n\tif got != want {\n\t\tt.Fatalf(\"Unified = %q, want %q\", got, want)\n\t}\n}\n\nfunc TestApplyRoundTrip(t *testing.T) {\n\ta := \"one\\ntwo\\nthree\\nfour\\n\"\n\tb := \"one\\n2\\nthree\\nfour\\nfive\\n\"\n\tgot, err := Apply(a, Unified(\"a\", \"b\", a, b, 3))\n\tif err != nil {\n\t\tt.Fatalf(\"Apply error: %v\", err)\n\t}\n\tif got != b {\n\t\tt.Fatalf(\"Apply = %q, want %q\", got, b)\n\t}\n}\n"
  toposort/toposort.go: "// Package toposort parses a dependency specification and orders its nodes.\n//\n// All comparisons between node names are plain byte-wise string comparisons\n// (Go's < on strings); \"sorted\" always means ascending in that order.\npackage toposort\n\nimport \"errors\"\n\n// Graph is a set of named nodes and \"depends on\" edges between them.\n// A Graph is not modified by any of its methods.\ntype Graph struct{}\n\n// ParseError reports a malformed line of a specification.\ntype ParseError struct {\n\t// Line is the 1-based number of the offending line.\n\tLine int\n\t// Msg describes the problem.\n\tMsg string\n}\n\n// Error returns \"line <Line>: <Msg>\".\nfunc (e *ParseError) Error() string {\n\treturn \"\"\n}\n\n// CycleError is returned by Order and Levels when the graph has a cycle.\ntype CycleError struct {\n\t// Path is one concrete cycle; see Order for which one.\n\tPath []string\n}\n\n// Error returns \"cycle: \" followed by Path joined with \" -> \",\n// e.g. \"cycle: a -> b -> c -> a\".\nfunc (e *CycleError) Error() string {\n\treturn \"\"\n}\n\n// Parse reads a specification. The input is split into lines at '\\n'.\n// On each line, everything from the first '#' to the end of the line is a\n// comment and is removed; the rest is trimmed of surrounding whitespace, and\n// if nothing remains the line is ignored. Otherwise the line must have the\n// form\n//\n//\ttarget: dep1 dep2 ...\n//\n// where:\n//   - the line contains exactly one ':' (otherwise it is malformed);\n//   - the text before ':' trimmed of whitespace is the target; it must be\n//     non-empty and must not contain whitespace (otherwise malformed);\n//   - the text after ':' is split on runs of whitespace into zero or more\n//     dependency names (\"a:\" just declares node a).\n//\n// Semantics: the target and every dependency named anywhere become nodes. The\n// target gets an edge to each listed dependency (\"target depends on dep\").\n// A target may appear on several lines; its dependencies accumulate. Repeated\n// edges collapse into one. A node may depend on itself (\"a: a\"); that is a\n// cycle, which Parse accepts and Order/Levels report.\n//\n// On the first malformed line Parse returns a nil *Graph and an error of type\n// *ParseError whose Line is that line's 1-based number. An input with no\n// nodes (e.g. \"\") yields an empty, non-nil Graph and no error.\nfunc Parse(spec string) (*Graph, error) {\n\treturn nil, errors.New(\"not implemented\")\n}\n\n// Nodes returns all node names, sorted. It returns an empty slice for an\n// empty graph.\nfunc (g *Graph) Nodes() []string {\n\treturn nil\n}\n\n// Deps returns the direct dependencies of name, sorted and without\n// duplicates. It returns an empty slice if name has no dependencies or is not\n// a node.\nfunc (g *Graph) Deps(name string) []string {\n\treturn nil\n}\n\n// Order returns every node exactly once, each node after all of its\n// dependencies. Among the nodes whose dependencies have all already been\n// output, the smallest name is always output next (Kahn's algorithm with a\n// min-priority queue), so the result is unique. An empty graph yields an\n// empty slice and a nil error.\n//\n// If the graph has a cycle, Order returns a nil slice and a *CycleError.\n// Its Path is chosen as follows: let m be the smallest node that lies on any\n// cycle (a node lies on a cycle if it can reach itself by following one or\n// more dependency edges). Path starts and ends with m, consecutive elements\n// satisfy \"Path[i] depends directly on Path[i+1]\", and it is the shortest\n// such cycle through m; among shortest ones it is the lexicographically\n// smallest sequence (compare element by element). Only the closing m is\n// repeated. Examples: with \"a: b\", \"b: c\", \"c: a\" the Path is [a b c a]; with\n// \"x: x\" it is [x x].\nfunc (g *Graph) Order() ([]string, error) {\n\treturn nil, errors.New(\"not implemented\")\n}\n\n// Levels groups the nodes into build levels: a node with no dependencies is\n// in level 0, and any other node is in level 1 + the highest level among its\n// direct dependencies. The result has one entry per level, from level 0 up to\n// the highest level, each sorted; every node appears exactly once. An empty\n// graph yields an empty slice and a nil error.\n//\n// If the graph has a cycle, Levels returns nil and the same *CycleError (same\n// Path) that Order returns.\nfunc (g *Graph) Levels() ([][]string, error) {\n\treturn nil, errors.New(\"not implemented\")\n}\n\n// Affected returns the changed nodes plus every node that transitively\n// depends on any of them (i.e. can reach one of them by following dependency\n// edges), sorted and without duplicates. Names in changed that are not nodes\n// are ignored. It works on graphs with cycles. If nothing is affected it\n// returns an empty slice.\nfunc (g *Graph) Affected(changed ...string) []string {\n\treturn nil\n}\n"
  toposort/visible_test.go: "package toposort\n\nimport (\n\t\"reflect\"\n\t\"testing\"\n)\n\nconst diamond = `\napp: lib util\nlib: base\nutil: base\n`\n\nfunc TestOrderDiamond(t *testing.T) {\n\tg, err := Parse(diamond)\n\tif err != nil {\n\t\tt.Fatalf(\"Parse error: %v\", err)\n\t}\n\tgot, err := g.Order()\n\tif err != nil {\n\t\tt.Fatalf(\"Order error: %v\", err)\n\t}\n\tif want := []string{\"base\", \"lib\", \"util\", \"app\"}; !reflect.DeepEqual(got, want) {\n\t\tt.Fatalf(\"Order = %v, want %v\", got, want)\n\t}\n}\n\nfunc TestLevelsDiamond(t *testing.T) {\n\tg, err := Parse(diamond)\n\tif err != nil {\n\t\tt.Fatalf(\"Parse error: %v\", err)\n\t}\n\tgot, err := g.Levels()\n\tif err != nil {\n\t\tt.Fatalf(\"Levels error: %v\", err)\n\t}\n\tif want := [][]string{{\"base\"}, {\"lib\", \"util\"}, {\"app\"}}; !reflect.DeepEqual(got, want) {\n\t\tt.Fatalf(\"Levels = %v, want %v\", got, want)\n\t}\n}\n\nfunc TestAffectedDiamond(t *testing.T) {\n\tg, err := Parse(diamond)\n\tif err != nil {\n\t\tt.Fatalf(\"Parse error: %v\", err)\n\t}\n\tif got, want := g.Affected(\"lib\"), []string{\"app\", \"lib\"}; !reflect.DeepEqual(got, want) {\n\t\tt.Fatalf(\"Affected = %v, want %v\", got, want)\n\t}\n}\n"
