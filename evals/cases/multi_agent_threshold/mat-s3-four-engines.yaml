1,\"b\":2},{\"a\":1,\"c\":3},{\"a\":2,\"c\":3}]`, \"$[?( @.a==2 )]\", `[{\"a\":2,\"c\":3}]`},\n\t\t{`[{\"s\":\"it's\"},{\"s\":\"x\"}]`, `$[?(@.s == 'it\\'s')].s`, `[\"it's\"]`},\n\t\t{`\"scalar\"`, \"$[?(@)]\", `[]`},\n\t})\n}\n\nfunc TestHiddenSyntaxErrors(t *testing.T) {\n\tvar doc any\n\tif err := json.Unmarshal([]byte(hiddenStore), &doc); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tbad := []string{\n\t\t\"\",\n\t\t\"store\",\n\t\t\"@.store\",\n\t\t\"$.\",\n\t\t\"$..\",\n\t\t\"$.store.\",\n\t\t\"$.0abc\",\n\t\t\"$.store-x\",\n\t\t\"$ .store\",\n\t\t\"$store\",\n\t\t\"$[\",\n\t\t\"$[]\",\n\t\t\"$[ ]\",\n\t\t\"$[0\",\n\t\t\"$['a\",\n\t\t\"$['a'\",\n\t\t\"$[a]\",\n\t\t\"$['a\\\\x']\",\n\t\t\"$[1:2:0]\",\n\t\t\"$[- 1]\",\n\t\t\"$[0,'a']\",\n\t\t\"$['a',0]\",\n\t\t\"$[1:2,3]\",\n\t\t\"$[1.5]\",\n\t\t\"$..[0]\",\n\t\t\"$..'a'\",\n\t\t\"$[?(@.a ==)]\",\n\t\t\"$[?(@.a == 'x']\",\n\t\t\"$[?(@.a == 'x')\",\n\t\t\"$[?@.a]\",\n\t\t\"$[?(@.a = 1)]\",\n\t\t\"$[?(@.a == nul)]\",\n\t\t\"$[?(@.a & @.b)]\",\n\t\t\"$[?(a == 1)]\",\n\t\t\"$[?(@. a)]\",\n\t\t\"$[?((@.a)]\",\n\t\t\"$[?()]\",\n\t\t\"$.missing[\",\n\t}\n\tfor _, p := range bad {\n\t\tgot, err := Query(doc, p)\n\t\tif err == nil {\n\t\t\tt.Errorf(\"Query(%q) = %v, want syntax error\", p, got)\n\t\t\tcontinue\n\t\t}\n\t\tif !errors.Is(err, ErrSyntax) {\n\t\t\tt.Errorf(\"Query(%q): error %v does not wrap ErrSyntax\", p, err)\n\t\t}\n\t\tif got != nil {\n\t\t\tt.Errorf(\"Query(%q): result %v on error, want nil\", p, got)\n\t\t}\n\t}\n}\n\nfunc TestHiddenResultsAreDocumentValues(t *testing.T) {\n\tvar doc any\n\tif err := json.Unmarshal([]byte(`{\"a\":{\"b\":[1]}}`), &doc); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tgot, err := Query(doc, \"$.a\")\n\tif err != nil || len(got) != 1 {\n\t\tt.Fatalf(\"Query = %v, %v\", got, err)\n\t}\n\tgot[0].(map[string]any)[\"new\"] = true\n\tif _, ok := doc.(map[string]any)[\"a\"].(map[string]any)[\"new\"]; !ok {\n\t\tt.Fatal(\"result must be the document's own value, not a copy\")\n\t}\n}\nHIDDEN_EOF\nmkdir -p \"$(dirname 'textdiff/zz_hidden_test.go')\"\ncat > 'textdiff/zz_hidden_test.go' <<'HIDDEN_EOF'\npackage textdiff\n\nimport (\n\t\"errors\"\n\t\"math/rand\"\n\t\"reflect\"\n\t\"strings\"\n\t\"testing\"\n)\n\nfunc hdr(body string) string { return \"--- a\\n+++ b\\n\" + body }\n\nfunc TestHiddenLinesEmpty(t *testing.T) {\n\tif got := Lines(\"\", \"\"); len(got) != 0 {\n\t\tt.Fatalf(\"Lines(\\\"\\\", \\\"\\\") = %#v, want empty\", got)\n\t}\n\tif got, want := Lines(\"\", \"x\\ny\"), []Op{{Insert, \"x\\n\"}, {Insert, \"y\"}}; !reflect.DeepEqual(got, want) {\n\t\tt.Fatalf(\"got %#v, want %#v\", got, want)\n\t}\n\tif got, want := Lines(\"x\\n\", \"\"), []Op{{Delete, \"x\\n\"}}; !reflect.DeepEqual(got, want) {\n\t\tt.Fatalf(\"got %#v, want %#v\", got, want)\n\t}\n}\n\nfunc TestHiddenLinesNewlineMatters(t *testing.T) {\n\tgot := Lines(\"a\", \"a\\n\")\n\twant := []Op{{Delete, \"a\"}, {Insert, \"a\\n\"}}\n\tif !reflect.DeepEqual(got, want) {\n\t\tt.Fatalf(\"got %#v, want %#v\", got, want)\n\t}\n\tgot = Lines(\"a\\nb\", \"a\\nb\")\n\twant = []Op{{Equal, \"a\\n\"}, {Equal, \"b\"}}\n\tif !reflect.DeepEqual(got, want) {\n\t\tt.Fatalf(\"got %#v, want %#v\", got, want)\n\t}\n}\n\nfunc TestHiddenLinesTieBreak(t *testing.T) {\n\tcases := []struct {\n\t\ta, b string\n\t\twant []Op\n\t}{\n\t\t{\"a\\nb\\n\", \"b\\na\\n\", []Op{{Delete, \"a\\n\"}, {Equal, \"b\\n\"}, {Insert, \"a\\n\"}}},\n\t\t{\"a\\n\", \"a\\na\\n\", []Op{{Equal, \"a\\n\"}, {Insert, \"a\\n\"}}},\n\t\t{\"a\\na\\n\", \"a\\n\", []Op{{Equal, \"a\\n\"}, {Delete, \"a\\n\"}}},\n\t\t{\"a\\nb\\nc\\n\", \"c\\nb\\na\\n\", []Op{{Delete, \"a\\n\"}, {Delete, \"b\\n\"}, {Equal, \"c\\n\"}, {Insert, \"b\\n\"}, {Insert, \"a\\n\"}}},\n\t\t{\"x\\ny\\n\", \"p\\nq\\n\", []Op{{Delete, \"x\\n\"}, {Delete, \"y\\n\"}, {Insert, \"p\\n\"}, {Insert, \"q\\n\"}}},\n\t\t{\"b\\n\", \"a\\nb\\n\", []Op{{Insert, \"a\\n\"}, {Equal, \"b\\n\"}}},\n\t\t{\"a\\nb\\nc\\nd\\n\", \"a\\nc\\nb\\nd\\n\", []Op{{Equal, \"a\\n\"}, {Delete, \"b\\n\"}, {Equal, \"c\\n\"}, {Insert, \"b\\n\"}, {Equal, \"d\\n\"}}},\n\t}\n\tfor _, c := range cases {\n\t\tif got := Lines(c.a, c.b); !reflect.DeepEqual(got, c.want) {\n\t\t\tt.Errorf(\"Lines(%q, %q) = %#v, want %#v\", c.a, c.b, got, c.want)\n\t\t}\n\t}\n}\n\nfunc lcsLen(x, y []string) int {\n\tprev := make([]int, len(y)+1)\n\tcur := make([]int, len(y)+1)\n\tfor i := 1; i <= len(x); i++ {\n\t\tfor j := 1; j <= len(y); j++ {\n\t\t\tswitch {\n\t\t\tcase x[i-1] == y[j-1]:\n\t\t\t\tcur[j] = prev[j-1] + 1\n\t\t\tcase prev[j] >= cur[j-1]:\n\t\t\t\tcur[j] = prev[j]\n\t\t\tdefault:\n\t\t\t\tcur[j] = cur[j-1]\n\t\t\t}\n\t\t}\n\t\tprev, cur = cur, prev\n\t}\n\treturn prev[len(y)]\n}\n\nfunc testSplit(s string) []string {\n\tvar out []string\n\tfor s != \"\" {\n\t\ti := strings.IndexByte(s, '\\n')\n\t\tif i < 0 {\n\t\t\tout = append(out, s)\n\t\t\tbreak\n\t\t}\n\t\tout = append(out, s[:i+1])\n\t\ts = s[i+1:]\n\t}\n\treturn out\n}\n\nfunc randText(r *rand.Rand) string {\n\tn := r.Intn(13)\n\tvar sb strings.Builder\n\tfor i := 0; i < n; i++ {\n\t\tsb.WriteString(string(rune('a' + r.Intn(4))))\n\t\tif i < n-1 || r.Intn(4) != 0 {\n\t\t\tsb.WriteByte('\\n')\n\t\t}\n\t}\n\treturn sb.String()\n}\n\nfunc TestHiddenLinesMinimalAndConsistent(t *testing.T) {\n\tr := rand.New(rand.NewSource(42))\n\tfor iter := 0; iter < 400; iter++ {\n\t\ta, b := randText(r), randText(r)\n\t\tops := Lines(a, b)\n\t\tvar ra, rb strings.Builder\n\t\tedits := 0\n\t\tseenInsert := false\n\t\tfor _, op := range ops {\n\t\t\tswitch op.Kind {\n\t\t\tcase Equal:\n\t\t\t\tra.WriteString(op.Text)\n\t\t\t\trb.WriteString(op.Text)\n\t\t\t\tseenInsert = false\n\t\t\tcase Delete:\n\t\t\t\tra.WriteString(op.Text)\n\t\t\t\tedits++\n\t\t\t\tif seenInsert {\n\t\t\t\t\tt.Fatalf(\"Lines(%q, %q): Delete after Insert in a change run: %#v\", a, b, ops)\n\t\t\t\t}\n\t\t\tcase Insert:\n\t\t\t\trb.WriteString(op.Text)\n\t\t\t\tedits++\n\t\t\t\tseenInsert = true\n\t\t\t}\n\t\t}\n\t\tif ra.String() != a || rb.String() != b {\n\t\t\tt.Fatalf(\"Lines(%q,\
    \ %q) does not reconstruct inputs: %#v\", a, b, ops)\n\t\t}\n\t\tx, y := testSplit(a), testSplit(b)\n\t\tif want := len(x) + len(y) - 2*lcsLen(x, y); edits != want {\n\t\t\tt.Fatalf(\"Lines(%q, %q) has %d edits, minimal is %d\", a, b, edits, want)\n\t\t}\n\t}\n}\n\nfunc TestHiddenLinesLarge(t *testing.T) {\n\tvar a, b strings.Builder\n\tfor i := 0; i < 1500; i++ {\n\t\tline := strings.Repeat(\"l\", i%7) + string(rune('A'+i%26)) + \"\\n\"\n\t\ta.WriteString(line)\n\t\tif i%10 == 5 {\n\t\t\tb.WriteString(\"changed\\n\")\n\t\t} else {\n\t\t\tb.WriteString(line)\n\t\t}\n\t}\n\tops := Lines(a.String(), b.String())\n\tins, del := 0, 0\n\tfor _, op := range ops {\n\t\tswitch op.Kind {\n\t\tcase Insert:\n\t\t\tins++\n\t\tcase Delete:\n\t\t\tdel++\n\t\t}\n\t}\n\tif ins != 150 || del != 150 {\n\t\tt.Fatalf(\"inserts=%d deletes=%d, want 150/150\", ins, del)\n\t}\n}\n\nfunc TestHiddenUnifiedIdentical(t *testing.T) {\n\tif got := Unified(\"a\", \"b\", \"x\\ny\\n\", \"x\\ny\\n\", 3); got != \"\" {\n\t\tt.Fatalf(\"got %q, want empty\", got)\n\t}\n\tif got := Unified(\"a\", \"b\", \"\", \"\", 3); got != \"\" {\n\t\tt.Fatalf(\"got %q, want empty\", got)\n\t}\n}\n\nfunc TestHiddenUnifiedRanges(t *testing.T) {\n\tcases := []struct {\n\t\tname string\n\t\ta, b string\n\t\tctx  int\n\t\twant string\n\t}{\n\t\t{\"single\", \"x\\n\", \"y\\n\", 3, \"@@ -1 +1 @@\\n-x\\n+y\\n\"},\n\t\t{\"insert into empty\", \"\", \"x\\ny\\n\", 3, \"@@ -0,0 +1,2 @@\\n+x\\n+y\\n\"},\n\t\t{\"delete all\", \"x\\n\", \"\", 3, \"@@ -1 +0,0 @@\\n-x\\n\"},\n\t\t{\"insert middle ctx0\", \"a\\nb\\n\", \"a\\nX\\nb\\n\", 0, \"@@ -1,0 +2 @@\\n+X\\n\"},\n\t\t{\"delete middle ctx0\", \"a\\nX\\nb\\n\", \"a\\nb\\n\", 0, \"@@ -2 +1,0 @@\\n-X\\n\"},\n\t\t{\"negative ctx is 0\", \"a\\nX\\nb\\n\", \"a\\nb\\n\", -5, \"@@ -2 +1,0 @@\\n-X\\n\"},\n\t\t{\"insert at end ctx1\", \"a\\nb\\n\", \"a\\nb\\nc\\n\", 1, \"@@ -2 +2,2 @@\\n b\\n+c\\n\"},\n\t\t{\"two separate ctx0\", \"a\\nb\\nc\\nd\\n\", \"a\\nX\\nb\\nd\\n\", 0, \"@@ -1,0 +2 @@\\n+X\\n@@ -3 +3,0 @@\\n-c\\n\"},\n\t}\n\tfor _, c := range cases {\n\t\tgot := Unified(\"a\", \"b\", c.a, c.b, c.ctx)\n\t\tif want := hdr(c.want); got != want {\n\t\t\tt.Errorf(\"%s: got %q, want %q\", c.name, got, want)\n\t\t}\n\t}\n}\n\nfunc tenLines(repl map[int]string) string {\n\tvar sb strings.Builder\n\tfor i := 0; i < 10; i++ {\n\t\ts := string(rune('a' + i))\n\t\tif r, ok := repl[i]; ok {\n\t\t\ts = r\n\t\t}\n\t\tsb.WriteString(s + \"\\n\")\n\t}\n\treturn sb.String()\n}\n\nfunc TestHiddenUnifiedHunkMerging(t *testing.T) {\n\ta := tenLines(nil)\n\t// changes at lines 3 and 9: gap of 5 equal lines (d..h)\n\tb := tenLines(map[int]string{2: \"C\", 8: \"I\"})\n\tif got, want := Unified(\"a\", \"b\", a, b, 1), hdr(\"@@ -2,3 +2,3 @@\\n b\\n-c\\n+C\\n d\\n@@ -8,3 +8,3 @@\\n h\\n-i\\n+I\\n j\\n\"); got != want {\n\t\tt.Errorf(\"ctx1: got %q, want %q\", got, want)\n\t}\n\tif got, want := Unified(\"a\", \"b\", a, b, 2), hdr(\"@@ -1,5 +1,5 @@\\n a\\n b\\n-c\\n+C\\n d\\n e\\n@@ -7,4 +7,4 @@\\n g\\n h\\n-i\\n+I\\n j\\n\"); got != want {\n\t\tt.Errorf(\"ctx2: got %q, want %q\", got, want)\n\t}\n\tif got, want := Unified(\"a\", \"b\", a, b, 3), hdr(\"@@ -1,10 +1,10 @@\\n a\\n b\\n-c\\n+C\\n d\\n e\\n f\\n g\\n h\\n-i\\n+I\\n j\\n\"); got != want {\n\t\tt.Errorf(\"ctx3: got %q, want %q\", got, want)\n\t}\n\t// changes at lines 3 and 8: gap of exactly 4 = 2*2 merges\n\tb2 := tenLines(map[int]string{2: \"C\", 7: \"H\"})\n\tif got, want := Unified(\"a\", \"b\", a, b2, 2), hdr(\"@@ -1,10 +1,10 @@\\n a\\n b\\n-c\\n+C\\n d\\n e\\n f\\n g\\n-h\\n+H\\n i\\n j\\n\"); got != want {\n\t\tt.Errorf(\"gap==2ctx: got %q, want %q\", got, want)\n\t}\n\tif got, want := Unified(\"a\", \"b\", a, b2, 1), hdr(\"@@ -2,3 +2,3 @@\\n b\\n-c\\n+C\\n d\\n@@ -7,3 +7,3 @@\\n g\\n-h\\n+H\\n i\\n\"); got != want {\n\t\tt.Errorf(\"gap>2ctx: got %q, want %q\", got, want)\n\t}\n\t// huge context covers the whole file\n\tb3 := tenLines(map[int]string{4: \"E\"})\n\tif got := Unified(\"a\", \"b\", a, b3, 100); !strings.HasPrefix(got, hdr(\"@@ -1,10 +1,10 @@\\n a\\n\")) {\n\t\tt.Errorf(\"ctx100: got %q\", got)\n\t}\n}\n\nfunc TestHiddenUnifiedNames(t *testing.T) {\n\tgot := Unified(\"src/old name.go\", \"src/new.go\", \"x\\n\", \"y\\n\", 0)\n\tif want := \"--- src/old name.go\\n+++ src/new.go\\n@@ -1 +1 @@\\n-x\\n+y\\n\"; got != want {\n\t\tt.Fatalf(\"got %q, want %q\", got, want)\n\t}\n}\n\nfunc TestHiddenUnifiedNoNewline(t *testing.T) {\n\tconst m = \"\\\\ No newline at end of file\\n\"\n\tcases := []struct {\n\t\ta, b string\n\t\tctx  int\n\t\twant string\n\t}{\n\t\t{\"a\\nb\", \"a\\nc\", 1, \"@@ -1,2 +1,2 @@\\n a\\n-b\\n\" + m + \"+c\\n\" + m},\n\t\t{\"a\", \"a\\n\", 3, \"@@ -1 +1 @@\\n-a\\n\" + m + \"+a\\n\"},\n\t\t{\"a\\n\", \"a\", 3, \"@@ -1 +1 @@\\n-a\\n+a\\n\" + m},\n\t\t{\"x\\ny\", \"X\\ny\", 1, \"@@ -1,2 +1,2 @@\\n-x\\n+X\\n y\\n\" + m},\n\t\t{\"x\\ny\", \"X\\ny\", 0, \"@@ -1 +1 @@\\n-x\\n+X\\n\"},\n\t}\n\tfor _, c := range cases {\n\t\tif got, want := Unified(\"a\", \"b\", c.a, c.b, c.ctx), hdr(c.want); got != want {\n\t\t\tt.Errorf(\"Unified(%q, %q, %d) = %q, want %q\", c.a, c.b, c.ctx, got, want)\n\t\t}\n\t}\n}\n\nfunc TestHiddenRoundTrip(t *testing.T) {\n\tr := rand.New(rand.NewSource(7))\n\tfor iter := 0; iter < 600; iter++ {\n\t\ta, b := randText(r), randText(r)\n\t\tctx := r.Intn(4)\n\t\td := Unified(\"a\", \"b\", a, b, ctx)\n\t\tgot, err := Apply(a, d)\n\t\tif err != nil {\n\t\t\tt.Fatalf(\"Apply(%q, Unified(%q, %q, %d)=%q) error: %v\", a, a, b, ctx, d, err)\n\t\t}\n\t\tif got != b {\n\t\t\tt.Fatalf(\"Apply(%q, %q) = %q, want %q\", a, d, got, b)\n\t\t}\n\t}\n}\n\nfunc TestHiddenApplyEmptyDiff(t *testing.T) {\n\tgot, err := Apply(\"keep\\nme\", \"\")\n\tif err != nil || got != \"keep\\nme\" {\n\t\tt.Fatalf(\"got %q, %v\", got, err)\n\t}\n}\n\nfunc TestHiddenApplyHandWritten(t *testing.T) {\n\torig := \"a\\nb\\nc\\nd\\n\"\n\td := hdr(\"@@ -1,0 +2 @@\\n+X\\n@@ -3 +3,0 @@\\n-c\\n\")\n\tgot, err := Apply(orig, d)\n\tif err != nil || got != \"a\\nX\\nb\\nd\\n\" {\n\t\tt.Fatalf(\"got %q, %v\", got, err)\n\t}\n\t// insertion at the very end and a context line without newline\n\tgot, err = Apply(\"p\\nq\", hdr(\"@@ -2 +2,2 @@\\n+n\\n q\\n\\\\ No newline at end of file\\n\"))\n\tif err != nil || got != \"p\\nn\\nq\" {\n\t\tt.Fatalf(\"got %q, %v\", got, err)\n\t}\n\t// names in headers are ignored\n\tgot, err = Apply(\"x\\n\", \"--- whatever\\n+++ else\\n@@ -1 +1 @@\\n-x\\n+y\\n\")\n\tif err != nil || got != \"y\\n\" {\n\t\tt.Fatalf(\"got %q, %v\", got, err)\n\t}\n}\n\nfunc TestHiddenApplyMalformed(t *testing.T) {\n\tconst orig = \"a\\nb\\nc\\n\"\n\tconst m = \"\\\\ No newline at end of file\\n\"\n\tcases := map[string]string{\n\t\t\"no trailing newline\":     hdr(\"@@ -1 +1 @@\\n-a\\n+x\"),\n\t\t\"missing headers\":         \"@@ -1 +1 @@\\n-a\\n+x\\n\",\n\t\t\"headers only\":            hdr(\"\"),\n\t\t\"header extra text\":       hdr(\"@@ -1 +1 @@ ctx\\n-a\\n+x\\n\"),\n\t\t\"truncated body\":          hdr(\"@@ -1,2 +1,2 @@\\n-a\\n+x\\n\"),\n\t\t\"exceeds count\":           hdr(\"@@ -1 +1 @@\\n-a\\n-b\\n+x\\n\"),\n\t\t\"empty body line\":         hdr(\"@@ -1,2 +1,2 @@\\n a\\n\\n-b\\n+x\\n\"),\n\t\t\"trailing garbage\":        hdr(\"@@ -1 +1 @@\\n-a\\n+x\\ngarbage\\n\"),\n\t\t\"out of order\":            hdr(\"@@ -2 +2 @@\\n-b\\n+y\\n@@ -1 +1 @@\\n-a\\n+x\\n\"),\n\t\t\"overlapping\":             hdr(\"@@ -1,2 +1,2 @@\\n a\\n-b\\n+y\\n@@ -2 +2 @@\\n-b\\n+z\\n\"),\n\t\t\"inconsistent new start\":  hdr(\"@@ -2 +3 @@\\n-b\\n+y\\n\"),\n\t\t\"inconsistent later hunk\": hdr(\"@@ -1 +1,2 @@\\n-a\\n+x\\n+y\\n@@ -3 +3 @@\\n-c\\n+z\\n\"),\n\t\t\"empty hunk\":              hdr(\"@@ -1,0 +1,0 @@\\n\"),\n\t\t\"zero start with count\":   hdr(\"@@ -0 +1 @@\\n-a\\n+x\\n\"),\n\t\t\"marker after header\":     hdr(\"@@ -1 +1 @@\\n\" + m + \"-a\\n+x\\n\"),\n\t\t\"marker not last old\":     hdr(\"@@ -1,2 +1,2 @@\\n-a\\n\" + m + \"-b\\n+x\\n+y\\n\"),\n\t\t\"marker hunk not last\":    hdr(\"@@ -1 +1 @@\\n-a\\n+x\\n\" + m + \"@@ -3 +3 @@\\n-c\\n+z\\n\"),\n\t\t\"double marker\":           hdr(\"@@ -1 +1 @@\\n-a\\n+x\\n\" + m + m),\n\t}\n\tfor name, d := range cases {\n\t\t_, err := Apply(orig, d)\n\t\tif !errors.Is(err, ErrMalformed) {\n\t\t\tt.Errorf(\"%s: err = %v, want ErrMalformed\", name, err)\n\t\t}\n\t\tif errors.Is(err, ErrMismatch) {\n\t\t\tt.Errorf(\"%s: err = %v also matches ErrMismatch\", name, err)\n\t\t}\n\t}\n}\n\nfunc TestHiddenApplyMismatch(t *testing.T) {\n\tcases := []struct {\n\t\tname, orig, diff string\n\t}{\n\t\t{\"deleted line differs\", \"a\\nb\\nc\\n\", hdr(\"@@ -2 +2 @@\\n-q\\n+y\\n\")},\n\t\t{\"context line differs\", \"a\\nb\\nc\\n\", hdr(\"@@ -1,2 +1,2 @@\\n z\\n-b\\n+y\\n\")},\n\t\t{\"newline presence differs\", \"a\\nb\", hdr(\"@@ -2 +2 @@\\n-b\\n+y\\n\")},\n\t\t{\"missing newline differs\", \"a\\nb\\n\", hdr(\"@@ -2 +2 @@\\n-b\\n\\\\ No newline at end of file\\n+y\\n\")},\n\t\t{\"start beyond end\", \"a\\nb\\nc\\n\", hdr(\"@@ -10 +10 @@\\n-a\\n+x\\n\")},\n\t\t{\"insertion point beyond end\", \"a\\nb\\nc\\n\", hdr(\"@@ -4,0 +5 @@\\n+x\\n\")},\n\t\t{\"original runs out\", \"a\\nb\\nc\\n\", hdr(\"@@ -3,2 +3,2 @@\\n c\\n-d\\n+x\\n\")},\n\t\t{\"no-newline line followed by original\", \"a\\nb\\n\", hdr(\"@@ -1 +1 @@\\n-a\\n+x\\n\\\\ No newline at end of file\\n\")},\n\t}\n\tfor _, c := range cases {\n\t\t_, err := Apply(c.orig, c.diff)\n\t\tif !errors.Is(err, ErrMismatch) {\n\t\t\tt.Errorf(\"%s: err = %v, want ErrMismatch\", c.name, err)\n\t\t}\n\t\tif errors.Is(err, ErrMalformed) {\n\t\t\tt.Errorf(\"%s: err = %v also matches ErrMalformed\", c.name, err)\n\t\t}\n\t}\n}\nHIDDEN_EOF\nmkdir -p \"$(dirname 'toposort/zz_hidden_test.go')\"\ncat > 'toposort/zz_hidden_test.go' <<'HIDDEN_EOF'\npackage toposort\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n\t\"reflect\"\n\t\"strings\"\n\t\"testing\"\n)\n\nfunc mustParse(t *testing.T, spec string) *Graph {\n\tt.Helper()\n\tg, err := Parse(spec)\n\tif err != nil {\n\t\tt.Fatalf(\"Parse(%q) error: %v\", spec, err)\n\t}\n\tif g == nil {\n\t\tt.Fatalf(\"\
    Parse(%q) returned nil graph\", spec)\n\t}\n\treturn g\n}\n\nfunc eqStrings(t *testing.T, what string, got, want []string) {\n\tt.Helper()\n\tif len(got) == 0 && len(want) == 0 {\n\t\treturn\n\t}\n\tif !reflect.DeepEqual(got, want) {\n\t\tt.Errorf(\"%s = %v, want %v\", what, got, want)\n\t}\n}\n\nfunc TestHiddenParseSemantics(t *testing.T) {\n\tspec := \"# build graph\\n\" +\n\t\t\"\\n\" +\n\t\t\"app: lib util # trailing comment: with colon\\n\" +\n\t\t\"   \\t\\n\" +\n\t\t\"lib: base\\r\\n\" +\n\t\t\"app:\\tlog  lib\\n\" +\n\t\t\"util:\\n\" +\n\t\t\"  # indented comment\\n\" +\n\t\t\"lib: base base\\n\"\n\tg := mustParse(t, spec)\n\teqStrings(t, \"Nodes\", g.Nodes(), []string{\"app\", \"base\", \"lib\", \"log\", \"util\"})\n\teqStrings(t, \"Deps(app)\", g.Deps(\"app\"), []string{\"lib\", \"log\", \"util\"})\n\teqStrings(t, \"Deps(lib)\", g.Deps(\"lib\"), []string{\"base\"})\n\tif got := g.Deps(\"util\"); len(got) != 0 {\n\t\tt.Errorf(\"Deps(util) = %v, want empty\", got)\n\t}\n\tif got := g.Deps(\"base\"); len(got) != 0 {\n\t\tt.Errorf(\"Deps(base) = %v, want empty\", got)\n\t}\n\tif got := g.Deps(\"nope\"); len(got) != 0 {\n\t\tt.Errorf(\"Deps(nope) = %v, want empty\", got)\n\t}\n}\n\nfunc TestHiddenParseEmpty(t *testing.T) {\n\tfor _, spec := range []string{\"\", \"\\n\\n\", \"# only a comment\\n   # another: x: y\\n\"} {\n\t\tg := mustParse(t, spec)\n\t\tif n := g.Nodes(); len(n) != 0 {\n\t\t\tt.Errorf(\"Parse(%q).Nodes() = %v, want empty\", spec, n)\n\t\t}\n\t\to, err := g.Order()\n\t\tif err != nil || len(o) != 0 {\n\t\t\tt.Errorf(\"Parse(%q).Order() = %v, %v; want empty, nil\", spec, o, err)\n\t\t}\n\t\tl, err := g.Levels()\n\t\tif err != nil || len(l) != 0 {\n\t\t\tt.Errorf(\"Parse(%q).Levels() = %v, %v; want empty, nil\", spec, l, err)\n\t\t}\n\t}\n}\n\nfunc TestHiddenParseErrors(t *testing.T) {\n\tcases := []struct {\n\t\tspec string\n\t\tline int\n\t}{\n\t\t{\"a: b\\n\\nnocolon here\\n\", 3},\n\t\t{\"# c\\na: b: c\\n\", 2},\n\t\t{\"a: b\\n: c\\n\", 2},\n\t\t{\"a b: c\\n\", 1},\n\t\t{\"a: b\\n# x\\n\\n  \\n   bad\\n\", 5},\n\t\t{\"ok:\\nx:y:z\\nalso bad\\n\", 2},\n\t}\n\tfor _, c := range cases {\n\t\tg, err := Parse(c.spec)\n\t\tif g != nil {\n\t\t\tt.Errorf(\"Parse(%q) returned non-nil graph with error\", c.spec)\n\t\t}\n\t\tvar pe *ParseError\n\t\tif !errors.As(err, &pe) {\n\t\t\tt.Errorf(\"Parse(%q) error = %v, want *ParseError\", c.spec, err)\n\t\t\tcontinue\n\t\t}\n\t\tif pe.Line != c.line {\n\t\t\tt.Errorf(\"Parse(%q) Line = %d, want %d\", c.spec, pe.Line, c.line)\n\t\t}\n\t\tif prefix := fmt.Sprintf(\"line %d: \", c.line); !strings.HasPrefix(err.Error(), prefix) {\n\t\t\tt.Errorf(\"Parse(%q) Error() = %q, want prefix %q\", c.spec, err.Error(), prefix)\n\t\t}\n\t}\n\t// a colon inside a comment does not count\n\tg := mustParse(t, \"a: b # c: d\\n\")\n\teqStrings(t, \"Nodes\", g.Nodes(), []string{\"a\", \"b\"})\n}\n\nfunc TestHiddenOrderHeapTieBreak(t *testing.T) {\n\t// A level-by-level sort would give [a c b]; Kahn with a min-heap gives [a b c].\n\tg := mustParse(t, \"b: a\\nc:\\na:\\n\")\n\tgot, err := g.Order()\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\teqStrings(t, \"Order\", got, []string{\"a\", \"b\", \"c\"})\n\n\tg = mustParse(t, \"z: y\\ny: x\\nb:\\nx:\\na: z\\n\")\n\tgot, err = g.Order()\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\teqStrings(t, \"Order\", got, []string{\"b\", \"x\", \"y\", \"z\", \"a\"})\n}\n\nfunc TestHiddenOrderStable(t *testing.T) {\n\tg := mustParse(t, \"app: lib util\\nlib: base\\nutil: base\\n\")\n\tfirst, err1 := g.Order()\n\tsecond, err2 := g.Order()\n\tif err1 != nil || err2 != nil || !reflect.DeepEqual(first, second) {\n\t\tt.Fatalf(\"Order not repeatable: %v %v / %v %v\", first, err1, second, err2)\n\t}\n}\n\nfunc TestHiddenOrderLongChain(t *testing.T) {\n\tvar sb strings.Builder\n\tfor i := 0; i < 1000; i++ {\n\t\tfmt.Fprintf(&sb, \"n%04d: n%04d\\n\", i, i+1)\n\t}\n\tg := mustParse(t, sb.String())\n\tgot, err := g.Order()\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif len(got) != 1001 || got[0] != \"n1000\" || got[1000] != \"n0000\" {\n\t\tt.Fatalf(\"chain order wrong: len=%d first=%v last=%v\", len(got), got[:1], got[len(got)-1:])\n\t}\n\tlv, err := g.Levels()\n\tif err != nil || len(lv) != 1001 || lv[1000][0] != \"n0000\" {\n\t\tt.Fatalf(\"chain levels wrong: len=%d err=%v\", len(lv), err)\n\t}\n}\n\nfunc cycleOf(t *testing.T, spec string) *CycleError {\n\tt.Helper()\n\tg := mustParse(t, spec)\n\torder, err := g.Order()\n\tif order != nil {\n\t\tt.Errorf(\"Order(%q) returned non-nil order %v on cycle\", spec, order)\n\t}\n\tvar ce *CycleError\n\tif !errors.As(err, &ce) {\n\t\tt.Fatalf(\"Order(%q) error = %v, want *CycleError\", spec, err)\n\t}\n\treturn ce\n}\n\nfunc TestHiddenCyclePaths(t *testing.T) {\n\tcases := []struct {\n\t\tname, spec string\n\t\twant       []string\n\t}{\n\t\t{\"three cycle\", \"a: b\\nb: c\\nc: a\\n\", []string{\"a\", \"b\", \"c\", \"a\"}},\n\t\t{\"three cycle rotated input\", \"c: a\\nb: c\\na: b\\n\", []string{\"a\", \"b\", \"c\", \"a\"}},\n\t\t{\"self loop\", \"x: x\\n\", []string{\"x\", \"x\"}},\n\t\t{\"smallest node not on cycle\", \"a: b\\nb: c\\nc: b\\n\", []string{\"b\", \"c\", \"b\"}},\n\t\t{\"acyclic part alongside\", \"a: b\\nb: a\\nc:\\n0: c\\n\", []string{\"a\", \"b\", \"a\"}},\n\t\t{\"shortest wins\", \"m: z y\\nz: m\\ny: q\\nq: m\\n\", []string{\"m\", \"z\", \"m\"}},\n\t\t{\"tie picks smaller\", \"a: c b\\nb: a\\nc: a\\n\", []string{\"a\", \"b\", \"a\"}},\n\t\t{\"tie decided early\", \"a: b c\\nb: z\\nc: y\\nz: a\\ny: a\\n\", []string{\"a\", \"b\", \"z\", \"a\"}},\n\t\t{\"self loop vs longer\", \"b: b a\\na: b\\n\", []string{\"a\", \"b\", \"a\"}},\n\t\t{\"self loop shortest\", \"a: b a\\nb: a\\n\", []string{\"a\", \"a\"}},\n\t}\n\tfor _, c := range cases {\n\t\tce := cycleOf(t, c.spec)\n\t\tif !reflect.DeepEqual(ce.Path, c.want) {\n\t\t\tt.Errorf(\"%s: Path = %v, want %v\", c.name, ce.Path, c.want)\n\t\t}\n\t}\n}\n\nfunc TestHiddenCycleErrorMessage(t *testing.T) {\n\tce := cycleOf(t, \"a: b\\nb: c\\nc: a\\n\")\n\tif got, want := ce.Error(), \"cycle: a -> b -> c -> a\"; got != want {\n\t\tt.Fatalf(\"Error() = %q, want %q\", got, want)\n\t}\n}\n\nfunc TestHiddenLevels(t *testing.T) {\n\tg := mustParse(t, \"app: lib util\\nlib: base\\nutil: base\\ntool:\\ndeep: app\\nx: base lib\\n\")\n\tgot, err := g.Levels()\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\twant := [][]string{{\"base\", \"tool\"}, {\"lib\", \"util\"}, {\"app\", \"x\"}, {\"deep\"}}\n\tif !reflect.DeepEqual(got, want) {\n\t\tt.Fatalf(\"Levels = %v, want %v\", got, want)\n\t}\n}\n\nfunc TestHiddenLevelsCycle(t *testing.T) {\n\tspec := \"ok: base\\nq: r\\nr: s\\ns: q\\n\"\n\tg := mustParse(t, spec)\n\tlv, err := g.Levels()\n\tif lv != nil {\n\t\tt.Errorf(\"Levels returned %v on cycle\", lv)\n\t}\n\tvar ce *CycleError\n\tif !errors.As(err, &ce) {\n\t\tt.Fatalf(\"Levels error = %v, want *CycleError\", err)\n\t}\n\tif want := []string{\"q\", \"r\", \"s\", \"q\"}; !reflect.DeepEqual(ce.Path, want) {\n\t\tt.Errorf(\"Levels cycle Path = %v, want %v\", ce.Path, want)\n\t}\n\t_, oerr := g.Order()\n\tvar oce *CycleError\n\tif !errors.As(oerr, &oce) || !reflect.DeepEqual(oce.Path, ce.Path) {\n\t\tt.Errorf(\"Order and Levels cycle paths differ: %v vs %v\", oerr, err)\n\t}\n}\n\nfunc TestHiddenAffected(t *testing.T) {\n\tg := mustParse(t, \"app: lib util\\nlib: base\\nutil: base\\ntool:\\ncli: app\\n\")\n\teqStrings(t, \"Affected(base)\", g.Affected(\"base\"), []string{\"app\", \"base\", \"cli\", \"lib\", \"util\"})\n\teqStrings(t, \"Affected(util)\", g.Affected(\"util\"), []string{\"app\", \"cli\", \"util\"})\n\teqStrings(t, \"Affected(cli)\", g.Affected(\"cli\"), []string{\"cli\"})\n\teqStrings(t, \"Affected(tool, cli, cli)\", g.Affected(\"tool\", \"cli\", \"cli\"), []string{\"cli\", \"tool\"})\n\teqStrings(t, \"Affected(ghost, lib)\", g.Affected(\"ghost\", \"lib\"), []string{\"app\", \"cli\", \"lib\"})\n\tif got := g.Affected(\"ghost\"); len(got) != 0 {\n\t\tt.Errorf(\"Affected(ghost) = %v, want empty\", got)\n\t}\n\tif got := g.Affected(); len(got) != 0 {\n\t\tt.Errorf(\"Affected() = %v, want empty\", got)\n\t}\n}\n\nfunc TestHiddenAffectedWithCycle(t *testing.T) {\n\tg := mustParse(t, \"a: b\\nb: a\\nc: a\\nd: c\\ne:\\n\")\n\teqStrings(t, \"Affected(a)\", g.Affected(\"a\"), []string{\"a\", \"b\", \"c\", \"d\"})\n\teqStrings(t, \"Affected(c)\", g.Affected(\"c\"), []string{\"c\", \"d\"})\n}\nHIDDEN_EOF\ngo test -race ./...\n"
