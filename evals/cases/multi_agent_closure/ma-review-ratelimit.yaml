id: ma-review-ratelimit
name: Fix a token bucket against its documented contract
max_rounds: 50
files:
  go.mod: |
    module evalcase

    go 1.21
  limiter/limiter.go: "package limiter\n\nimport \"time\"\n\n// Bucket is a token bucket.\n//\n// Contract:\n//   - it never holds more than capacity tokens;\n//   - tokens refill continuously at ratePerSec, so fractions of a second\n//     accumulate (a request every 300ms at 4 tokens/sec is always allowed,\n//     even at capacity 1);\n//   - a clock that moves backwards never removes tokens;\n//   - it is safe for concurrent use.\ntype Bucket struct {\n\tcapacity   int\n\ttokens     int\n\tratePerSec int\n\tlast       time.Time\n\tnow        func() time.Time\n}\n\n// New returns a full bucket.\nfunc New(capacity, ratePerSec int, now func() time.Time) *Bucket {\n\treturn &Bucket{capacity: capacity, tokens: capacity, ratePerSec: ratePerSec, last: now(), now: now}\n}\n\n// Allow takes one token if one is available.\nfunc (b *Bucket) Allow() bool {\n\tt := b.now()\n\telapsed := t.Sub(b.last)\n\tb.tokens += int(elapsed.Seconds()) * b.ratePerSec\n\tb.last = t\n\tif b.tokens > 0 {\n\t\tb.tokens--\n\t\treturn true\n\t}\n\treturn false\n}\n"
  limiter/limiter_test.go: "package limiter\n\nimport (\n\t\"testing\"\n\t\"time\"\n)\n\nfunc TestStartsFull(t *testing.T) {\n\tnow := time.Unix(0, 0)\n\tb := New(2, 1, func() time.Time { return now })\n\tif !b.Allow() || !b.Allow() || b.Allow() {\n\t\tt.Fatal(\"want exactly two\")\n\t}\n}\n"
task: 'Users report two problems with limiter.Bucket: after an idle period it allows bursts larger than its capacity, and under a steady trickle of requests it rejects requests that its refill rate should allow. Fix the limiter so every point of the contract in limiter.go''s doc comment holds. Keep the constructor signature and do not modify existing tests.'
expect:
  program: bash
  args:
  - -c
  - "set -euo pipefail\ngit diff --quiet HEAD -- '*_test.go'\nmkdir -p \"$(dirname 'limiter/zz_hidden_test.go')\"\ncat > 'limiter/zz_hidden_test.go' <<'HIDDEN_EOF'\npackage limiter\n\nimport (\n\t\"sync\"\n\t\"testing\"\n\t\"time\"\n)\n\ntype clock struct {\n\tmu sync.Mutex\n\tt  time.Time\n}\n\nfunc (c *clock) now() time.Time { c.mu.Lock(); defer c.mu.Unlock(); return c.t }\nfunc (c *clock) add(d time.Duration) { c.mu.Lock(); c.t = c.t.Add(d); c.mu.Unlock() }\n\nfunc TestHiddenCapacityCap(t *testing.T) {\n\tc := &clock{t: time.Unix(100, 0)}\n\tb := New(3, 1, c.now)\n\tc.add(time.Hour)\n\tn := 0\n\tfor b.Allow() {\n\t\tn++\n\t\tif n > 10 {\n\t\t\tbreak\n\t\t}\n\t}\n\tif n != 3 {\n\t\tt.Fatalf(\"burst after idle = %d, want 3\", n)\n\t}\n}\n\nfunc TestHiddenFractionalRefill(t *testing.T) {\n\tc := &clock{t: time.Unix(100, 0)}\n\tb := New(1, 4, c.now)\n\tb.Allow()\n\tallowed := 0\n\tfor i := 0; i < 20; i++ {\n\t\tc.add(300 * time.Millisecond)\n\t\tif b.Allow() {\n\t\t\tallowed++\n\t\t}\n\t}\n\tif allowed != 20 {\n\t\tt.Fatalf(\"trickle allowed %d of 20\", allowed)\n\t}\n}\n\nfunc TestHiddenBackwardsClock(t *testing.T) {\n\tc := &clock{t: time.Unix(100, 0)}\n\tb := New(2, 1, c.now)\n\tc.add(-time.Hour)\n\tif !b.Allow() || !b.Allow() {\n\t\tt.Fatal(\"backwards clock removed tokens\")\n\t}\n}\n\nfunc TestHiddenConcurrent(t *testing.T) {\n\tc := &clock{t: time.Unix(100, 0)}\n\tb := New(1000, 1, c.now)\n\tvar wg sync.WaitGroup\n\tvar mu sync.Mutex\n\tok := 0\n\tfor g := 0; g < 8; g++ {\n\t\twg.Add(1)\n\t\tgo func() {\n\t\t\tdefer wg.Done()\n\t\t\tfor i := 0; i < 200; i++ {\n\t\t\t\tif b.Allow() {\n\t\t\t\t\tmu.Lock()\n\t\t\t\t\tok++\n\t\t\t\t\tmu.Unlock()\n\t\t\t\t}\n\t\t\t}\n\t\t}()\n\t}\n\twg.Wait()\n\tif ok != 1000 {\n\t\tt.Fatalf(\"concurrent allowed %d, want 1000\", ok)\n\t}\n}\nHIDDEN_EOF\ngo test -race ./...\n"
