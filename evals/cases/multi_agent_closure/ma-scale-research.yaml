task: 'Write INVENTORY.md at the repository root. For each package directory under internal/, add a section headed exactly `## <package name>`. Under it, list every exported top-level function as a bullet `- Name` and every exported method as a bullet `- Type.Name` (no types, constants or variables), then one line `imports: <comma-separated names of the internal packages it imports, or none>`. Do not change any Go file.'
expect:
  program: bash
  args:
  - -c
  - |
    set -euo pipefail
    git diff --quiet HEAD -- '*.go' && go build ./... && python3 - '{"accounts": {"names": ["AuditOrder2", "ExportOrder0", "Order.Encode", "Order.Load", "Order.Lookup", "Order.Publish", "Order.Schedule", "RefreshOrder3", "RenderOrder4", "RetryOrder1"], "imports": []}, "alerts": {"names": ["CompactLedger3", "Ledger.Encode", "Ledger.Export", "Ledger.Index", "Ledger.Publish", "Ledger.Retry", "LookupLedger4", "ParseLedger1", "ResolveLedger2", "StoreLedger0"], "imports": ["accounts"]}, "billing": {"names": ["AuditRoute4", "EncodeRoute3", "MergeRoute1", "PublishRoute2", "Route.Cancel", "Route.Decode", "Route.Lookup", "Route.Split", "Route.Validate", "StoreRoute0"], "imports": ["alerts"]}, "catalog": {"names": ["Batch.Lookup", "Batch.Parse", "Batch.Refresh", "Batch.Render", "Batch.Store", "CompactBatch0", "IndexBatch4", "ResolveBatch3", "ScheduleBatch1", "SplitBatch2"], "imports": []}, "dispatch": {"names": ["CancelToken0", "CompactToken2", "EncodeToken4", "PublishToken3", "StoreToken1", "Token.Audit", "Token.Decode", "Token.Export", "Token.Load", "Token.Split"], "imports": ["catalog"]}, "gateway": {"names": ["EncodeQuota1", "ExportQuota0", "ParseQuota4", "PublishQuota3", "Quota.Audit", "Quota.Load", "Quota.Merge", "Quota.Render", "Quota.Split", "RetryQuota2"], "imports": ["billing"]}, "inventory": {"names": ["CompactReport4", "EncodeReport2", "PublishReport0", "Report.Audit", "Report.Cancel", "Report.Export", "Report.Merge", "Report.Store", "ScheduleReport1", "ValidateReport3"], "imports": ["gateway"]}, "ledger": {"names": ["AuditShard0", "MergeShard2", "RetryShard1", "Shard.Compact", "Shard.Export", "Shard.Load", "Shard.Lookup", "Shard.Refresh", "StoreShard3", "ValidateShard4"], "imports": ["accounts"]}, "routing": {"names": ["ExportTenant0", "LookupTenant1", "MergeTenant2", "ScheduleTenant3", "StoreTenant4", "Tenant.Audit", "Tenant.Decode", "Tenant.Encode", "Tenant.Publish", "Tenant.Validate"], "imports": ["billing"]}, "search": {"names": ["EncodeInvoice3", "Invoice.Decode", "Invoice.Export", "Invoice.Index", "Invoice.Store", "Invoice.Validate", "MergeInvoice1", "ParseInvoice2", "RetryInvoice0", "ScheduleInvoice4"], "imports": ["alerts"]}}' <<'PY_EOF'
    import json, re, sys
    expected = json.loads(sys.argv[1])
    text = open("INVENTORY.md").read()
    sections = re.split(r"^## +", text, flags=re.M)[1:]
    got = {}
    for sec in sections:
        head, _, body = sec.partition("\n")
        names = set(re.findall(r"^\s*[-*]\s+`?([A-Za-z_][\w.]*)`?\s*$", body, flags=re.M))
        m = re.search(r"^imports:\s*(.*)$", body, flags=re.M)
        imports = sorted(x.strip().strip("`") for x in (m.group(1) if m else "").split(",") if x.strip() and x.strip().strip("`") != "none")
        got[head.strip().strip("`")] = {"names": sorted(names), "imports": imports}
    bad = []
    for pkg, want in expected.items():
        have = got.get(pkg)
        if have is None:
            bad.append(f"missing section {pkg}")
            continue
        if have["names"] != want["names"]:
            bad.append(f"{pkg} names: got {have['names']} want {want['names']}")
        if have["imports"] != want["imports"]:
            bad.append(f"{pkg} imports: got {have['imports']} want {want['imports']}")
    print("\n".join(bad) or "inventory ok")
    sys.exit(1 if bad else 0)
    PY_EOF
