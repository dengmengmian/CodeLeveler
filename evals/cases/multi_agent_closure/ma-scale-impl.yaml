id: ma-scale-impl
name: Implement eight independent helper packages
max_rounds: 120
files:
  go.mod: |
    module evalcase

    go 1.21
  slug/slug.go: "package slug\n\n// Slugify lowercases s, keeps ASCII letters and digits, turns every run of\n// other characters into a single '-', and trims '-' from both ends.\nfunc Slugify(s string) string {\n\treturn s\n}\n"
  slug/slug_test.go: "package slug\n\nimport \"testing\"\n\nfunc TestSlugify(t *testing.T) {\n\tif got := Slugify(\"Hello, World!\"); got != \"hello-world\" {\n\t\tt.Fatal(got)\n\t}\n}\n"
  stats/median.go: "package stats\n\n// Median returns the median of xs and true, or 0 and false when xs is empty.\n// It never reorders the caller's slice.\nfunc Median(xs []float64) (float64, bool) {\n\treturn 0, false\n}\n"
  stats/median_test.go: "package stats\n\nimport \"testing\"\n\nfunc TestMedianOdd(t *testing.T) {\n\tif m, ok := Median([]float64{3, 1, 2}); !ok || m != 2 {\n\t\tt.Fatal(m, ok)\n\t}\n}\n"
  humandur/format.go: "package humandur\n\nimport \"time\"\n\n// Format renders d as hours, minutes and seconds, omitting zero units:\n// 1h2m3s, 2m, 45s. Sub-second parts are dropped. Zero is \"0s\"; a negative\n// duration is prefixed with '-'.\nfunc Format(d time.Duration) string {\n\treturn \"\"\n}\n"
  humandur/format_test.go: "package humandur\n\nimport (\n\t\"testing\"\n\t\"time\"\n)\n\nfunc TestFormat(t *testing.T) {\n\tif got := Format(time.Hour + 2*time.Minute + 3*time.Second); got != \"1h2m3s\" {\n\t\tt.Fatal(got)\n\t}\n}\n"
  csvq/split.go: "package csvq\n\n// Split splits one CSV line on commas. A field wrapped in double quotes may\n// contain commas, and \"\" inside it is one literal quote. An unterminated\n// quoted field is an error.\nfunc Split(line string) ([]string, error) {\n\treturn nil, nil\n}\n"
  csvq/split_test.go: "package csvq\n\nimport \"testing\"\n\nfunc TestSplitPlain(t *testing.T) {\n\tgot, err := Split(\"a,b,c\")\n\tif err != nil || len(got) != 3 || got[2] != \"c\" {\n\t\tt.Fatal(got, err)\n\t}\n}\n"
  roman/roman.go: "package roman\n\n// ToRoman renders n (1..3999) as a Roman numeral; anything else is an error.\nfunc ToRoman(n int) (string, error) {\n\treturn \"\", nil\n}\n"
  roman/roman_test.go: "package roman\n\nimport \"testing\"\n\nfunc TestToRoman(t *testing.T) {\n\tif got, err := ToRoman(1994); err != nil || got != \"MCMXCIV\" {\n\t\tt.Fatal(got, err)\n\t}\n}\n"
  wrap/wrap.go: "package wrap\n\n// Wrap splits text into lines of at most width runes, breaking only at\n// spaces and collapsing runs of whitespace. A word longer than width stands\n// on its own line unbroken. Empty or all-space text gives no lines.\nfunc Wrap(text string, width int) []string {\n\treturn nil\n}\n"
  wrap/wrap_test.go: "package wrap\n\nimport (\n\t\"reflect\"\n\t\"testing\"\n)\n\nfunc TestWrap(t *testing.T) {\n\tif got := Wrap(\"the quick brown fox\", 10); !reflect.DeepEqual(got, []string{\"the quick\", \"brown fox\"}) {\n\t\tt.Fatal(got)\n\t}\n}\n"
  dedupe/dedupe.go: "package dedupe\n\n// Strings returns xs without repeats, keeping each value's first position.\n// Comparison ignores ASCII case and surrounding spaces; the first spelling wins.\nfunc Strings(xs []string) []string {\n\treturn xs\n}\n"
  dedupe/dedupe_test.go: "package dedupe\n\nimport (\n\t\"reflect\"\n\t\"testing\"\n)\n\nfunc TestStrings(t *testing.T) {\n\tif got := Strings([]string{\"a\", \"b\", \"a\"}); !reflect.DeepEqual(got, []string{\"a\", \"b\"}) {\n\t\tt.Fatal(got)\n\t}\n}\n"
  bytesize/format.go: "package bytesize\n\n// Format renders n bytes: below 1024 as \"<n> B\"; otherwise in the largest of\n// KiB, MiB, GiB, TiB that keeps the value >= 1, with one decimal rounded\n// half up, and a trailing \".0\" dropped (\"1.5 KiB\", \"2 MiB\"). Negative n is an\n// error-free \"-\" prefix of the same rendering.\nfunc Format(n int64) string {\n\treturn \"\"\n}\n"
  bytesize/format_test.go: "package bytesize\n\nimport \"testing\"\n\nfunc TestFormat(t *testing.T) {\n\tif got := Format(1536); got != \"1.5 KiB\" {\n\t\tt.Fatal(got)\n\t}\n}\n"
task: 'Eight packages in this module are stubs: slug, stats, humandur, csvq, roman, wrap, dedupe and bytesize. Implement each one to the contract in its doc comment so that `go test ./...` passes. The packages are independent of each other. Do not modify tests.'
expect:
  program: bash
  args:
  - -c
  - "set -euo pipefail\ngit diff --quiet HEAD -- '*_test.go'\nmkdir -p \"$(dirname 'slug/zz_hidden_test.go')\"\ncat > 'slug/zz_hidden_test.go' <<'HIDDEN_EOF'\npackage slug\n\nimport \"testing\"\n\nfunc TestHiddenSlug(t *testing.T) {\n\tfor in, want := range map[string]string{\"  --Go 1.21 é Rocks--  \": \"go-1-21-rocks\", \"\": \"\", \"___\": \"\", \"a__b\": \"a-b\"} {\n\t\tif got := Slugify(in); got != want {\n\t\t\tt.Fatalf(\"%q: %q want %q\", in, got, want)\n\t\t}\n\t}\n}\nHIDDEN_EOF\nmkdir -p \"$(dirname 'stats/zz_hidden_test.go')\"\ncat > 'stats/zz_hidden_test.go' <<'HIDDEN_EOF'\npackage stats\n\nimport \"testing\"\n\nfunc TestHiddenMedian(t *testing.T) {\n\tif _, ok := Median(nil); ok {\n\t\tt.Fatal(\"empty\")\n\t}\n\txs := []float64{4, 1, 3, 2}\n\tif m, ok := Median(xs); !ok || m != 2.5 {\n\t\tt.Fatal(m)\n\t}\n\tif xs[0] != 4 || xs[1] != 1 {\n\t\tt.Fatal(\"reordered input\", xs)\n\t}\n}\nHIDDEN_EOF\nmkdir -p \"$(dirname 'humandur/zz_hidden_test.go')\"\ncat > 'humandur/zz_hidden_test.go' <<'HIDDEN_EOF'\npackage humandur\n\nimport (\n\t\"testing\"\n\t\"time\"\n)\n\nfunc TestHiddenFormat(t *testing.T) {\n\tcases := map[time.Duration]string{0: \"0s\", 2 * time.Minute: \"2m\", 45*time.Second + 900*time.Millisecond: \"45s\", -(time.Hour + time.Second): \"-1h1s\", 500 * time.Millisecond: \"0s\", 26 * time.Hour: \"26h\"}\n\tfor d, want := range cases {\n\t\tif got := Format(d); got != want {\n\t\t\tt.Fatalf(\"%v: %q want %q\", d, got, want)\n\t\t}\n\t}\n}\nHIDDEN_EOF\nmkdir -p \"$(dirname 'csvq/zz_hidden_test.go')\"\ncat > 'csvq/zz_hidden_test.go' <<'HIDDEN_EOF'\npackage csvq\n\nimport (\n\t\"reflect\"\n\t\"testing\"\n)\n\nfunc TestHiddenSplit(t *testing.T) {\n\tgot, err := Split(`x,\"a,b\",\"say \"\"hi\"\"\",`)\n\tif err != nil || !reflect.DeepEqual(got, []string{\"x\", \"a,b\", `say \"hi\"`, \"\"}) {\n\t\tt.Fatalf(\"%q %v\", got, err)\n\t}\n\tif _, err := Split(`a,\"open`); err == nil {\n\t\tt.Fatal(\"unterminated\")\n\t}\n}\nHIDDEN_EOF\nmkdir -p \"$(dirname 'roman/zz_hidden_test.go')\"\ncat > 'roman/zz_hidden_test.go' <<'HIDDEN_EOF'\npackage roman\n\nimport \"testing\"\n\nfunc TestHiddenRoman(t *testing.T) {\n\tfor n, want := range map[int]string{1: \"I\", 4: \"IV\", 9: \"IX\", 40: \"XL\", 3999: \"MMMCMXCIX\", 444: \"CDXLIV\"} {\n\t\tif got, err := ToRoman(n); err != nil || got != want {\n\t\t\tt.Fatalf(\"%d: %q %v\", n, got, err)\n\t\t}\n\t}\n\tfor _, bad := range []int{0, -1, 4000} {\n\t\tif _, err := ToRoman(bad); err == nil {\n\t\t\tt.Fatal(bad)\n\t\t}\n\t}\n}\nHIDDEN_EOF\nmkdir -p \"$(dirname 'wrap/zz_hidden_test.go')\"\ncat > 'wrap/zz_hidden_test.go' <<'HIDDEN_EOF'\npackage wrap\n\nimport (\n\t\"reflect\"\n\t\"testing\"\n)\n\nfunc TestHiddenWrap(t *testing.T) {\n\tif got := Wrap(\"   \", 5); len(got) != 0 {\n\t\tt.Fatal(got)\n\t}\n\tif got := Wrap(\"a  extraordinarily   long b\", 5); !reflect.DeepEqual(got, []string{\"a\", \"extraordinarily\", \"long\", \"b\"}) {\n\t\tt.Fatalf(\"%q\", got)\n\t}\n\tif got := Wrap(\"ab cd ef\", 5); !reflect.DeepEqual(got, []string{\"ab cd\", \"ef\"}) {\n\t\tt.Fatalf(\"%q\", got)\n\t}\n}\nHIDDEN_EOF\nmkdir -p \"$(dirname 'dedupe/zz_hidden_test.go')\"\ncat > 'dedupe/zz_hidden_test.go' <<'HIDDEN_EOF'\npackage dedupe\n\nimport (\n\t\"reflect\"\n\t\"testing\"\n)\n\nfunc TestHiddenDedupe(t *testing.T) {\n\tin := []string{\" Go\", \"go \", \"Rust\", \"GO\", \"rust\", \"zig\"}\n\tif got := Strings(in); !reflect.DeepEqual(got, []string{\" Go\", \"Rust\", \"zig\"}) {\n\t\tt.Fatalf(\"%q\", got)\n\t}\n\tif got := Strings(nil); len(got) != 0 {\n\t\tt.Fatal(got)\n\t}\n}\nHIDDEN_EOF\nmkdir -p \"$(dirname 'bytesize/zz_hidden_test.go')\"\ncat > 'bytesize/zz_hidden_test.go' <<'HIDDEN_EOF'\npackage bytesize\n\nimport \"testing\"\n\nfunc TestHiddenFormat(t *testing.T) {\n\tfor n, want := range map[int64]string{0: \"0 B\", 1023: \"1023 B\", 1024: \"1 KiB\", 2 << 20: \"2 MiB\", 1<<30 + 1<<29: \"1.5 GiB\", -1536: \"-1.5 KiB\", 1076: \"1.1 KiB\", 5 << 40: \"5 TiB\"} {\n\t\tif got := Format(n); got != want {\n\t\t\tt.Fatalf(\"%d: %q want %q\", n, got, want)\n\t\t}\n\t}\n}\nHIDDEN_EOF\ngo test ./...\n"
