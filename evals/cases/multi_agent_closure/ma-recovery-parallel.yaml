id: ma-recovery-parallel
name: Implement four independent packages across a process restart
max_rounds: 60
files:
  go.mod: |
    module evalcase

    go 1.21
  roman/roman.go: "package roman\n\n// ToRoman renders n (1..3999) as a Roman numeral; anything else is an error.\nfunc ToRoman(n int) (string, error) {\n\treturn \"\", nil\n}\n"
  roman/roman_test.go: "package roman\n\nimport \"testing\"\n\nfunc TestToRoman(t *testing.T) {\n\tif got, err := ToRoman(1994); err != nil || got != \"MCMXCIV\" {\n\t\tt.Fatal(got, err)\n\t}\n}\n"
  wrap/wrap.go: "package wrap\n\n// Wrap splits text into lines of at most width runes, breaking only at\n// spaces and collapsing runs of whitespace. A word longer than width stands\n// on its own line unbroken. Empty or all-space text gives no lines.\nfunc Wrap(text string, width int) []string {\n\treturn nil\n}\n"
  wrap/wrap_test.go: "package wrap\n\nimport (\n\t\"reflect\"\n\t\"testing\"\n)\n\nfunc TestWrap(t *testing.T) {\n\tif got := Wrap(\"the quick brown fox\", 10); !reflect.DeepEqual(got, []string{\"the quick\", \"brown fox\"}) {\n\t\tt.Fatal(got)\n\t}\n}\n"
  dedupe/dedupe.go: "package dedupe\n\n// Strings returns xs without repeats, keeping each value's first position.\n// Comparison ignores ASCII case and surrounding spaces; the first spelling wins.\nfunc Strings(xs []string) []string {\n\treturn xs\n}\n"
  dedupe/dedupe_test.go: "package dedupe\n\nimport (\n\t\"reflect\"\n\t\"testing\"\n)\n\nfunc TestStrings(t *testing.T) {\n\tif got := Strings([]string{\"a\", \"b\", \"a\"}); !reflect.DeepEqual(got, []string{\"a\", \"b\"}) {\n\t\tt.Fatal(got)\n\t}\n}\n"
  bytesize/format.go: "package bytesize\n\n// Format renders n bytes: below 1024 as \"<n> B\"; otherwise in the largest of\n// KiB, MiB, GiB, TiB that keeps the value >= 1, with one decimal rounded\n// half up, and a trailing \".0\" dropped (\"1.5 KiB\", \"2 MiB\"). Negative n is an\n// error-free \"-\" prefix of the same rendering.\nfunc Format(n int64) string {\n\treturn \"\"\n}\n"
  bytesize/format_test.go: "package bytesize\n\nimport \"testing\"\n\nfunc TestFormat(t *testing.T) {\n\tif got := Format(1536); got != \"1.5 KiB\" {\n\t\tt.Fatal(got)\n\t}\n}\n"
task: 'Four packages in this module are stubs: roman, wrap, dedupe and bytesize. Implement each one to the contract in its doc comment so that `go test ./...` passes. The packages are independent of each other. Do not modify tests.'
expect:
  program: bash
  args:
  - -c
  - "set -euo pipefail\nmkdir -p \"$(dirname 'roman/zz_hidden_test.go')\"\ncat > 'roman/zz_hidden_test.go' <<'HIDDEN_EOF'\npackage roman\n\nimport \"testing\"\n\nfunc TestHiddenRoman(t *testing.T) {\n\tfor n, want := range map[int]string{1: \"I\", 4: \"IV\", 9: \"IX\", 40: \"XL\", 3999: \"MMMCMXCIX\", 444: \"CDXLIV\"} {\n\t\tif got, err := ToRoman(n); err != nil || got != want {\n\t\t\tt.Fatalf(\"%d: %q %v\", n, got, err)\n\t\t}\n\t}\n\tfor _, bad := range []int{0, -1, 4000} {\n\t\tif _, err := ToRoman(bad); err == nil {\n\t\t\tt.Fatal(bad)\n\t\t}\n\t}\n}\nHIDDEN_EOF\nmkdir -p \"$(dirname 'wrap/zz_hidden_test.go')\"\ncat > 'wrap/zz_hidden_test.go' <<'HIDDEN_EOF'\npackage wrap\n\nimport (\n\t\"reflect\"\n\t\"testing\"\n)\n\nfunc TestHiddenWrap(t *testing.T) {\n\tif got := Wrap(\"   \", 5); len(got) != 0 {\n\t\tt.Fatal(got)\n\t}\n\tif got := Wrap(\"a  extraordinarily   long b\", 5); !reflect.DeepEqual(got, []string{\"a\", \"extraordinarily\", \"long\", \"b\"}) {\n\t\tt.Fatalf(\"%q\", got)\n\t}\n\tif got := Wrap(\"ab cd ef\", 5); !reflect.DeepEqual(got, []string{\"ab cd\", \"ef\"}) {\n\t\tt.Fatalf(\"%q\", got)\n\t}\n}\nHIDDEN_EOF\nmkdir -p \"$(dirname 'dedupe/zz_hidden_test.go')\"\ncat > 'dedupe/zz_hidden_test.go' <<'HIDDEN_EOF'\npackage dedupe\n\nimport (\n\t\"reflect\"\n\t\"testing\"\n)\n\nfunc TestHiddenDedupe(t *testing.T) {\n\tin := []string{\" Go\", \"go \", \"Rust\", \"GO\", \"rust\", \"zig\"}\n\tif got := Strings(in); !reflect.DeepEqual(got, []string{\" Go\", \"Rust\", \"zig\"}) {\n\t\tt.Fatalf(\"%q\", got)\n\t}\n\tif in[1] != \"go \" {\n\t\tt.Fatal(\"input modified\")\n\t}\n\tif got := Strings(nil); len(got) != 0 {\n\t\tt.Fatal(got)\n\t}\n}\nHIDDEN_EOF\nmkdir -p \"$(dirname 'bytesize/zz_hidden_test.go')\"\ncat > 'bytesize/zz_hidden_test.go' <<'HIDDEN_EOF'\npackage bytesize\n\nimport \"testing\"\n\nfunc TestHiddenFormat(t *testing.T) {\n\tfor n, want := range map[int64]string{0: \"0 B\", 1023: \"1023 B\", 1024: \"1 KiB\", 2 << 20: \"2 MiB\", 1<<30 + 1<<29: \"1.5 GiB\", -1536: \"-1.5 KiB\", 1076: \"1.1 KiB\", 5 << 40: \"5 TiB\"} {\n\t\tif got := Format(n); got != want {\n\t\t\tt.Fatalf(\"%d: %q want %q\", n, got, want)\n\t\t}\n\t}\n}\nHIDDEN_EOF\ngo test ./...\n"
