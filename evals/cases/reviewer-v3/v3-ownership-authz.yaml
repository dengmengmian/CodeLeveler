id: v3-ownership-authz
name: Let users rename their own documents
files:
  go.mod: |
    module evalcase

    go 1.21
  internal/auth/auth.go: |
    // Package auth models who is making a request.
    //
    // Roles:
    //   admin  — operates across the whole workspace
    //   member — operates on their own material
    //
    // A member's user id also appears as the OwnerID on everything they
    // create.
    package auth

    type Role string

    const (
        RoleAdmin  Role = "admin"
        RoleMember Role = "member"
    )

    // Principal is the authenticated caller.
    type Principal struct {
        UserID string
        Role   Role
    }

    func (p Principal) IsAdmin() bool { return p.Role == RoleAdmin }
  internal/docs/store.go: |
    package docs

    import (
        "errors"
        "sync"
    )

    var (
        ErrNotFound  = errors.New("document not found")
        ErrForbidden = errors.New("forbidden")
    )

    // Document belongs to exactly one owner. OwnerID is the auth user id of
    // the member who created it.
    type Document struct {
        ID      string
        OwnerID string
        Title   string
        Body    string
        Archived bool
    }

    type Store struct {
        mu   sync.Mutex
        docs map[string]Document
    }

    func NewStore() *Store { return &Store{docs: map[string]Document{}} }

    func (s *Store) Put(d Document) {
        s.mu.Lock()
        defer s.mu.Unlock()
        s.docs[d.ID] = d
    }

    func (s *Store) Get(id string) (Document, error) {
        s.mu.Lock()
        defer s.mu.Unlock()
        d, ok := s.docs[id]
        if !ok {
            return Document{}, ErrNotFound
        }
        return d, nil
    }

    func (s *Store) Save(d Document) error {
        s.mu.Lock()
        defer s.mu.Unlock()
        if _, ok := s.docs[d.ID]; !ok {
            return ErrNotFound
        }
        s.docs[d.ID] = d
        return nil
    }
  internal/docs/service.go: |
    package docs

    import "evalcase/internal/auth"

    type Service struct {
        store *Store
    }

    func NewService(s *Store) *Service { return &Service{store: s} }

    // Archive marks a document archived.
    func (s *Service) Archive(p auth.Principal, id string) error {
        d, err := s.store.Get(id)
        if err != nil {
            return err
        }
        if !p.IsAdmin() && d.OwnerID != p.UserID {
            return ErrForbidden
        }
        d.Archived = true
        return s.store.Save(d)
    }

    // Body returns a document's body.
    func (s *Service) Body(p auth.Principal, id string) (string, error) {
        d, err := s.store.Get(id)
        if err != nil {
            return "", err
        }
        if !p.IsAdmin() && d.OwnerID != p.UserID {
            return "", ErrForbidden
        }
        return d.Body, nil
    }

    // Rename changes a document's title.
    func (s *Service) Rename(p auth.Principal, id, title string) error {
        panic("not implemented")
    }
  internal/docs/service_test.go: |
    package docs

    import (
        "errors"
        "testing"

        "evalcase/internal/auth"
    )

    func seeded() (*Service, auth.Principal) {
        st := NewStore()
        st.Put(Document{ID: "d1", OwnerID: "u-1", Title: "old", Body: "b"})
        return NewService(st), auth.Principal{UserID: "u-1", Role: auth.RoleMember}
    }

    func TestOwnerCanRename(t *testing.T) {
        svc, owner := seeded()
        if err := svc.Rename(owner, "d1", "new"); err != nil {
            t.Fatalf("Rename: %v", err)
        }
        d, _ := svc.store.Get("d1")
        if d.Title != "new" {
            t.Fatalf("title = %q, want new", d.Title)
        }
    }

    func TestRenameUnknownDocument(t *testing.T) {
        svc, owner := seeded()
        if err := svc.Rename(owner, "nope", "new"); !errors.Is(err, ErrNotFound) {
            t.Fatalf("err = %v, want ErrNotFound", err)
        }
    }

    func TestEmptyTitleIsRejected(t *testing.T) {
        svc, owner := seeded()
        if err := svc.Rename(owner, "d1", ""); err == nil {
            t.Fatal("an empty title must be rejected")
        }
        d, _ := svc.store.Get("d1")
        if d.Title != "old" {
            t.Fatalf("a rejected rename changed the title to %q", d.Title)
        }
    }
task: |
  Members keep asking support to rename documents for them because the UI has
  no rename. Implement Service.Rename so they can do it themselves.

  An empty title is not a valid name.

  `go test ./...` must pass. Do NOT modify any _test.go file.
expect:
  program: bash
  args:
    - -c
    - |
      set -euo pipefail
      trap 'rm -f internal/docs/hidden_calib_test.go' EXIT
      go vet ./...
      go test -timeout 90s -count=1 ./...
      cat > internal/docs/hidden_calib_test.go <<'EOF'
      package docs

      import (
          "errors"
          "testing"

          "evalcase/internal/auth"
      )

      func twoOwners() *Service {
          st := NewStore()
          st.Put(Document{ID: "d1", OwnerID: "u-1", Title: "alice-doc", Body: "b"})
          st.Put(Document{ID: "d2", OwnerID: "u-2", Title: "bob-doc", Body: "b"})
          return NewService(st)
      }

      // Every other operation on this type checks ownership. Rename is a write
      // on somebody's document; a member who does not own it must be refused.
      func TestHiddenMemberCannotRenameAnotherMembersDocument(t *testing.T) {
          svc := twoOwners()
          intruder := auth.Principal{UserID: "u-2", Role: auth.RoleMember}
          err := svc.Rename(intruder, "d1", "hijacked")
          if !errors.Is(err, ErrForbidden) {
              t.Fatalf("err = %v, want ErrForbidden — u-2 does not own d1", err)
          }
          d, _ := svc.store.Get("d1")
          if d.Title != "alice-doc" {
              t.Fatalf("title = %q; a forbidden rename still wrote", d.Title)
          }
      }

      // Admins operate across the workspace, exactly as Archive and Body allow.
      func TestHiddenAdminCanRenameAnyDocument(t *testing.T) {
          svc := twoOwners()
          admin := auth.Principal{UserID: "u-9", Role: auth.RoleAdmin}
          if err := svc.Rename(admin, "d1", "renamed-by-admin"); err != nil {
              t.Fatalf("admin Rename: %v", err)
          }
          d, _ := svc.store.Get("d1")
          if d.Title != "renamed-by-admin" {
              t.Fatalf("title = %q, want renamed-by-admin", d.Title)
          }
      }

      // Not-found must not become a probe for which documents exist.
      func TestHiddenOwnerStillRenamesTheirOwn(t *testing.T) {
          svc := twoOwners()
          owner := auth.Principal{UserID: "u-2", Role: auth.RoleMember}
          if err := svc.Rename(owner, "d2", "bob-renamed"); err != nil {
              t.Fatalf("owner Rename: %v", err)
          }
          d, _ := svc.store.Get("d2")
          if d.Title != "bob-renamed" {
              t.Fatalf("title = %q, want bob-renamed", d.Title)
          }
      }

      // A rename must not quietly disturb the rest of the record.
      func TestHiddenRenameKeepsTheOtherFields(t *testing.T) {
          svc := twoOwners()
          owner := auth.Principal{UserID: "u-1", Role: auth.RoleMember}
          if err := svc.Rename(owner, "d1", "fresh"); err != nil {
              t.Fatalf("Rename: %v", err)
          }
          d, _ := svc.store.Get("d1")
          if d.OwnerID != "u-1" || d.Body != "b" || d.Archived {
              t.Fatalf("rename disturbed the record: %+v", d)
          }
      }
      EOF
      go test -run 'TestHidden' -count=1 -timeout 90s ./...
