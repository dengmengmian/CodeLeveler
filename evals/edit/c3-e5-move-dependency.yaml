# C3-E5 — Move/rename with dependency consistency. The function must end up in
# a new file under a new name, vanish from the old one, and the caller must
# follow. Half-moves — both copies alive, the old name lingering, the caller
# left behind — are what the acceptance rules out.
id: c3-e5-move-dependency
name: "[edit] Distinct moves out of aggregate.go as DistinctNames"
repo: fixtures/repos/navsvc
max_rounds: 40
relevant_paths:
  - internal/report/aggregate.go
required_impact_paths:
  - internal/report/aggregate.go
  - internal/report/distinct.go
  - cmd/navsvc/names.go
distractor_paths:
  - legacy/oldsummary.go
forbidden_edit_paths:
  - legacy/oldsummary.go
files:
  cmd/navsvc/names.go: |
    package main

    import (
    	"fmt"
    	"io"

    	"navsvc/internal/report"
    	"navsvc/pkg/api"
    )

    // printNameCount writes the distinct-name count for a finished run. Kept
    // separate from run() so the reporting shape is testable.
    func printNameCount(w io.Writer, batches []api.Batch) {
    	fmt.Fprintf(w, "names: %d\n", report.Distinct(batches))
    }
task: |
  We are splitting `internal/report/aggregate.go`: it has grown two
  unrelated jobs. `Distinct` (the distinct-name count) moves into its own
  file, `internal/report/distinct.go`, and gets the clearer name
  `DistinctNames`. Same behaviour, new home.

  Afterwards `aggregate.go` contains only `Aggregate`, the old `Distinct`
  name is gone from the codebase, and every caller — see
  `cmd/navsvc/names.go` — uses the new name.

  Do not change existing tests. `go build ./...` and `go test ./...` must pass.
expect:
  program: bash
  args:
    - "-c"
    - |
      set -euo pipefail
      test -f internal/report/distinct.go
      grep -q "func DistinctNames(" internal/report/distinct.go
      if grep -rn "func Distinct(" internal/ cmd/ > /dev/null; then
        echo "old symbol still defined" >&2; exit 1
      fi
      if grep -n "Distinct(" internal/report/aggregate.go > /dev/null; then
        echo "aggregate.go still carries the moved function" >&2; exit 1
      fi
      cat > internal/report/zz_hidden_e5_test.go <<'GO'
      package report

      import (
      	"testing"

      	"navsvc/pkg/api"
      )

      func TestDistinctNamesKeepsTheOldBehaviour(t *testing.T) {
      	batches := []api.Batch{{Records: []api.Record{
      		{Name: "a", Value: 1, Valid: true},
      		{Name: "a", Value: 2, Valid: true},
      		{Name: "b", Value: 3, Valid: true},
      	}}}
      	if got := DistinctNames(batches); got != 2 {
      		t.Fatalf("want 2 distinct names, got %d", got)
      	}
      }
      GO
      trap 'rm -f internal/report/zz_hidden_e5_test.go' EXIT
      go build ./... > /dev/null
      go test ./internal/report/ > /dev/null
      git diff --quiet -- legacy/
      go test ./... > /dev/null

# Benchmark-author validity metadata. Metrics-only.
validity:
  maintained_checks:
    - ["go", "build", "./..."]
    - ["go", "test", "./..."]
  constraints:
    existing_tests_unmodified: true
  semantics:
    status: UNAMBIGUOUS
    critical_observable: >-
      The function's final location, final name, the old name's absence, and
      the caller following the rename — with behaviour unchanged.
    oracle_interpretation: >-
      internal/report/distinct.go defines DistinctNames with the old
      semantics; no "func Distinct(" remains anywhere; aggregate.go no longer
      references it; the tree builds with the updated caller.
    rationale: >-
      The task names the source file, the destination file, the new name and
      the caller. Every obligation is a stated instruction, none inferred.
