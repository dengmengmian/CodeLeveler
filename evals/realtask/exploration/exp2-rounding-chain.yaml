# EXP2 — Indirect dependency trace. The symptom shows up at the CLI entry
# point, but the defect sits four hops down: main → invoice.Service →
# pricing.Engine (interface) → tiered.Engine (impl) → money.CentsFromMillis
# (truncates instead of rounding half-up). Distractors that LOOK like the
# culprit but are correct: tax has its own (correct) rounding, discount does
# integer math, and a second Engine implementation (flat) exists but is not
# wired into the default path.
id: exp2-rounding-chain
name: "[exploration] invoice totals come out one cent low on some line items"
max_rounds: 100
files:
  go.mod: |
    module invoicer

    go 1.21
  README.md: |
    # invoicer

    Generates invoices from order files.

    ```
    invoicer <order-file>
    ```

    Order files are one line per item: `<name>;<quantity>;<unit-price-millicents>`.
    All money math is integer: unit prices are stored in millicents
    (1/1000 of a currency unit... i.e. tenths of a cent) and invoice lines
    are rendered in cents. Business rule: fractional cents round HALF-UP.
  docs/pricing.md: |
    # Pricing rules

    - Unit prices are integers in millicents (tenths of a cent).
    - A line's raw price is `quantity * unit_price_millicents`.
    - Rendered amounts are in cents. Fractions of a cent round half-up
      (0.5 cents and above rounds up). This applies to every rendered
      amount: lines, subtotal, tax and total are each rounded independently
      from their own millicent value.
    - Tax is 8% of the subtotal, computed in millicents, rounded half-up.
  money/money.go: |
    package money

    // Millis is an amount in millicents (tenths of a cent). All arithmetic
    // stays in Millis until an amount is rendered.
    type Millis int64

    // Cents is a rendered amount in whole cents.
    type Cents int64
  money/round.go: |
    package money

    // CentsFromMillis renders a millicent amount in whole cents.
    func CentsFromMillis(m Millis) Cents {
        return Cents(m / 10)
    }
  money/format.go: |
    package money

    import "fmt"

    // Format renders cents as a dollar string, e.g. 1234 -> "$12.34".
    func Format(c Cents) string {
        sign := ""
        if c < 0 {
            sign = "-"
            c = -c
        }
        return fmt.Sprintf("%s$%d.%02d", sign, c/100, c%100)
    }
  money/format_test.go: |
    package money

    import "testing"

    func TestFormatRendersDollars(t *testing.T) {
        cases := map[Cents]string{0: "$0.00", 5: "$0.05", 1234: "$12.34", -250: "-$2.50"}
        for c, want := range cases {
            if got := Format(c); got != want {
                t.Fatalf("Format(%d) = %q, want %q", c, got, want)
            }
        }
    }

    func TestCentsFromMillisWholeCents(t *testing.T) {
        // Whole-cent inputs: no fraction involved.
        if got := CentsFromMillis(310); got != 31 {
            t.Fatalf("CentsFromMillis(310) = %d, want 31", got)
        }
        if got := CentsFromMillis(1000); got != 100 {
            t.Fatalf("CentsFromMillis(1000) = %d, want 100", got)
        }
    }
  catalog/item.go: |
    package catalog

    import "invoicer/money"

    // Item is one orderable product.
    type Item struct {
        Name       string
        UnitMillis money.Millis
        Quantity   int64
    }
  catalog/parse.go: |
    package catalog

    import (
        "fmt"
        "strconv"
        "strings"

        "invoicer/money"
    )

    // ParseOrder reads `name;quantity;unit_price_millicents` lines.
    func ParseOrder(text string) ([]Item, error) {
        var items []Item
        for lineNo, line := range strings.Split(strings.TrimSpace(text), "\n") {
            line = strings.TrimSpace(line)
            if line == "" || strings.HasPrefix(line, "#") {
                continue
            }
            parts := strings.Split(line, ";")
            if len(parts) != 3 {
                return nil, fmt.Errorf("line %d: want name;qty;millis, got %q", lineNo+1, line)
            }
            qty, err := strconv.ParseInt(parts[1], 10, 64)
            if err != nil || qty <= 0 {
                return nil, fmt.Errorf("line %d: bad quantity %q", lineNo+1, parts[1])
            }
            millis, err := strconv.ParseInt(parts[2], 10, 64)
            if err != nil || millis < 0 {
                return nil, fmt.Errorf("line %d: bad unit price %q", lineNo+1, parts[2])
            }
            items = append(items, Item{Name: parts[0], Quantity: qty, UnitMillis: money.Millis(millis)})
        }
        if len(items) == 0 {
            return nil, fmt.Errorf("order is empty")
        }
        return items, nil
    }
  catalog/parse_test.go: |
    package catalog

    import "testing"

    func TestParseOrderReadsLines(t *testing.T) {
        items, err := ParseOrder("widget;2;1500\n# comment\ngadget;1;995\n")
        if err != nil {
            t.Fatal(err)
        }
        if len(items) != 2 || items[0].Quantity != 2 || items[1].UnitMillis != 995 {
            t.Fatalf("unexpected items: %+v", items)
        }
    }

    func TestParseOrderRejectsGarbage(t *testing.T) {
        if _, err := ParseOrder("just-a-name\n"); err == nil {
            t.Fatal("malformed line must be rejected")
        }
    }
  pricing/engine.go: |
    package pricing

    import (
        "invoicer/catalog"
        "invoicer/money"
    )

    // Engine prices one order line, in millicents.
    type Engine interface {
        LineMillis(item catalog.Item) money.Millis
    }
  pricing/tiered/tiered.go: |
    // Package tiered implements the default pricing engine: volume discounts
    // kick in at 10+ and 100+ units.
    package tiered

    import (
        "invoicer/catalog"
        "invoicer/money"
    )

    type Engine struct{}

    func New() Engine {
        return Engine{}
    }

    // LineMillis prices a line: quantity times unit price, minus the volume
    // tier discount (5% off 10+, 10% off 100+), all in millicents.
    func (Engine) LineMillis(item catalog.Item) money.Millis {
        raw := int64(item.UnitMillis) * item.Quantity
        switch {
        case item.Quantity >= 100:
            raw = raw * 90 / 100
        case item.Quantity >= 10:
            raw = raw * 95 / 100
        }
        return money.Millis(raw)
    }
  pricing/tiered/tiered_test.go: |
    package tiered

    import (
        "testing"

        "invoicer/catalog"
    )

    func TestLineMillisAppliesTiers(t *testing.T) {
        e := New()
        small := e.LineMillis(catalog.Item{Quantity: 2, UnitMillis: 1000})
        if small != 2000 {
            t.Fatalf("no-tier line = %d, want 2000", small)
        }
        ten := e.LineMillis(catalog.Item{Quantity: 10, UnitMillis: 1000})
        if ten != 9500 {
            t.Fatalf("5%% tier line = %d, want 9500", ten)
        }
    }
  pricing/flat/flat.go: |
    // Package flat is the promotional no-discount engine. It is selectable in
    // code but NOT wired into the CLI's default path.
    package flat

    import (
        "invoicer/catalog"
        "invoicer/money"
    )

    type Engine struct{}

    func New() Engine {
        return Engine{}
    }

    func (Engine) LineMillis(item catalog.Item) money.Millis {
        return money.Millis(int64(item.UnitMillis) * item.Quantity)
    }
  tax/tax.go: |
    package tax

    import "invoicer/money"

    // RatePercent is the flat tax rate applied to the subtotal.
    const RatePercent = 8

    // OnMillis computes the tax on a subtotal, in millicents, rounding the
    // millicent result half-up per docs/pricing.md.
    func OnMillis(subtotal money.Millis) money.Millis {
        raw := int64(subtotal) * RatePercent
        // raw is in hundredths of a millicent; round half-up to millicents.
        return money.Millis((raw + 50) / 100)
    }
  tax/tax_test.go: |
    package tax

    import (
        "testing"

        "invoicer/money"
    )

    func TestTaxRoundsHalfUp(t *testing.T) {
        // 8% of 1006 millis = 80.48 -> 80; 8% of 1069 = 85.52 -> 86.
        if got := OnMillis(money.Millis(1006)); got != 80 {
            t.Fatalf("tax(1006) = %d, want 80", got)
        }
        if got := OnMillis(money.Millis(1069)); got != 86 {
            t.Fatalf("tax(1069) = %d, want 86", got)
        }
    }
  discount/discount.go: |
    package discount

    import "invoicer/money"

    // Coupon takes whole percentage points off a millicent amount. Integer
    // math; the caller rounds when rendering.
    func Coupon(amount money.Millis, percent int64) money.Millis {
        if percent <= 0 {
            return amount
        }
        if percent >= 100 {
            return 0
        }
        return money.Millis(int64(amount) * (100 - percent) / 100)
    }
  invoice/service.go: |
    package invoice

    import (
        "invoicer/catalog"
        "invoicer/money"
        "invoicer/pricing"
        "invoicer/tax"
    )

    // Line is one rendered invoice row.
    type Line struct {
        Name  string
        Cents money.Cents
    }

    // Invoice is the rendered result.
    type Invoice struct {
        Lines    []Line
        Subtotal money.Cents
        Tax      money.Cents
        Total    money.Cents
    }

    // Service turns an order into an invoice using a pricing engine.
    type Service struct {
        engine pricing.Engine
    }

    func NewService(engine pricing.Engine) *Service {
        return &Service{engine: engine}
    }

    // Generate prices every item and renders the rollup. Each rendered
    // amount is rounded independently from its own millicent value, per
    // docs/pricing.md.
    func (s *Service) Generate(items []catalog.Item) Invoice {
        var inv Invoice
        var subtotalMillis money.Millis
        for _, item := range items {
            lineMillis := s.engine.LineMillis(item)
            subtotalMillis += lineMillis
            inv.Lines = append(inv.Lines, Line{
                Name:  item.Name,
                Cents: money.CentsFromMillis(lineMillis),
            })
        }
        taxMillis := tax.OnMillis(subtotalMillis)
        inv.Subtotal = money.CentsFromMillis(subtotalMillis)
        inv.Tax = money.CentsFromMillis(taxMillis)
        inv.Total = money.CentsFromMillis(subtotalMillis + taxMillis)
        return inv
    }
  invoice/render.go: |
    package invoice

    import (
        "fmt"
        "strings"

        "invoicer/money"
    )

    // Render prints the invoice in the CLI's output format.
    func Render(inv Invoice) string {
        var b strings.Builder
        for _, line := range inv.Lines {
            fmt.Fprintf(&b, "%s: %s\n", line.Name, money.Format(line.Cents))
        }
        fmt.Fprintf(&b, "Subtotal: %s\n", money.Format(inv.Subtotal))
        fmt.Fprintf(&b, "Tax: %s\n", money.Format(inv.Tax))
        fmt.Fprintf(&b, "Total: %s\n", money.Format(inv.Total))
        return b.String()
    }
  cmd/invoicer/main.go: |
    package main

    import (
        "fmt"
        "os"

        "invoicer/catalog"
        "invoicer/invoice"
        "invoicer/pricing/tiered"
    )

    func main() {
        if len(os.Args) != 2 {
            fmt.Fprintln(os.Stderr, "usage: invoicer <order-file>")
            os.Exit(2)
        }
        data, err := os.ReadFile(os.Args[1])
        if err != nil {
            fmt.Fprintln(os.Stderr, err)
            os.Exit(1)
        }
        items, err := catalog.ParseOrder(string(data))
        if err != nil {
            fmt.Fprintln(os.Stderr, err)
            os.Exit(1)
        }
        service := invoice.NewService(tiered.New())
        fmt.Print(invoice.Render(service.Generate(items)))
    }
task: |
  Bug report from accounting:

  "Some invoices are a cent short. Example order file:

      widget;3;105

  Three units at 105 millicents come to 315 millicents, which is 31.5 cents.
  Our pricing rules (docs/pricing.md) say fractional cents round half-up, so
  that line must render as $0.32 — the invoice shows $0.31. Totals and tax
  lines are affected the same way on other orders. Amounts that land exactly
  on a whole cent are always correct."

  Expected behavior: every rendered amount (line, subtotal, tax, total)
  follows the documented half-up rounding rule. Amounts already on a whole
  cent must be unchanged.

  Fix the defect and add a regression test that locks the half-up rule.
  `go test ./...` must pass.
expect:
  program: bash
  args:
    - "-c"
    - |
      set -euo pipefail
      go test ./... > /dev/null
      d="$(mktemp -d)"
      cp -R . "$d/work"
      cd "$d/work"
      go build -o invoicer ./cmd/invoicer
      cat > order.txt <<'ORDER'
      widget;3;105
      gadget;2;1000
      ORDER
      out="$(./invoicer order.txt)"
      # widget: 315 millis -> 32 cents (half-up). gadget: 2000 -> 200 cents.
      grep -qx 'widget: $0.32' <<<"$out"
      grep -qx 'gadget: $2.00' <<<"$out"
      # subtotal 2315 millis -> 232 cents; tax 8% = 185.2 -> 185 millis -> 19 cents (185/10=18.5 up)
      grep -qx 'Subtotal: $2.32' <<<"$out"
      grep -qx 'Tax: $0.19' <<<"$out"
      # total 2315+185 = 2500 millis -> 250 cents
      grep -qx 'Total: $2.50' <<<"$out"
      # half-up rule locked by a test
      grep -rqliE 'half|round' --include='*_test.go' . > /dev/null
