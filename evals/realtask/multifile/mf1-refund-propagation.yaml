# MF1 — Cross-module bug fix. The refund flag is honored in NONE of the three
# consumers (ledger total, report largest/active scan, CLI count). A half-fix
# that only touches the ledger leaves the report and the CLI wrong; the hidden
# acceptance exercises all three through the real binary.
id: mf1-refund-propagation
name: "[multifile] refunded expenses still counted across ledger, report and CLI"
max_rounds: 80
files:
  go.mod: |
    module expensetrack

    go 1.21
  ledger/entry.go: |
    package ledger

    // Entry is one recorded expense. A refunded entry stays in the ledger for
    // audit history but must not count as spending anywhere in the product.
    type Entry struct {
    	ID          string
    	Description string
    	AmountCents int64
    	Refunded    bool
    }
  ledger/total.go: |
    package ledger

    // NetTotal sums the ledger's spending in cents.
    func NetTotal(entries []Entry) int64 {
    	var total int64
    	for _, e := range entries {
    		total += e.AmountCents
    	}
    	return total
    }
  ledger/total_test.go: |
    package ledger

    import "testing"

    func TestNetTotalSumsEntries(t *testing.T) {
    	entries := []Entry{
    		{ID: "a", AmountCents: 1200},
    		{ID: "b", AmountCents: 3300},
    	}
    	if got := NetTotal(entries); got != 4500 {
    		t.Fatalf("NetTotal = %d, want 4500", got)
    	}
    }
  report/monthly.go: |
    package report

    import "expensetrack/ledger"

    // Summary is the monthly rollup shown to the user.
    type Summary struct {
    	TotalCents   int64
    	LargestCents int64
    	ActiveCount  int
    }

    // Monthly builds the rollup for one month of entries.
    func Monthly(entries []ledger.Entry) Summary {
    	summary := Summary{TotalCents: ledger.NetTotal(entries)}
    	for _, e := range entries {
    		if e.AmountCents > summary.LargestCents {
    			summary.LargestCents = e.AmountCents
    		}
    	}
    	summary.ActiveCount = len(entries)
    	return summary
    }
  report/monthly_test.go: |
    package report

    import (
    	"testing"

    	"expensetrack/ledger"
    )

    func TestMonthlyRollsUpBasics(t *testing.T) {
    	entries := []ledger.Entry{
    		{ID: "a", AmountCents: 1500},
    		{ID: "b", AmountCents: 3000},
    	}
    	s := Monthly(entries)
    	if s.TotalCents != 4500 || s.LargestCents != 3000 || s.ActiveCount != 2 {
    		t.Fatalf("unexpected summary: %+v", s)
    	}
    }
  cmd/expensetrack/main.go: |
    package main

    import (
    	"encoding/csv"
    	"fmt"
    	"os"
    	"strconv"

    	"expensetrack/ledger"
    	"expensetrack/report"
    )

    // Reads a CSV of `id,description,amount_cents,refunded` rows and prints
    // the monthly summary.
    func main() {
    	if len(os.Args) != 2 {
    		fmt.Fprintln(os.Stderr, "usage: expensetrack <entries.csv>")
    		os.Exit(2)
    	}
    	file, err := os.Open(os.Args[1])
    	if err != nil {
    		fmt.Fprintln(os.Stderr, err)
    		os.Exit(1)
    	}
    	defer file.Close()
    	rows, err := csv.NewReader(file).ReadAll()
    	if err != nil {
    		fmt.Fprintln(os.Stderr, err)
    		os.Exit(1)
    	}
    	var entries []ledger.Entry
    	for _, row := range rows {
    		amount, err := strconv.ParseInt(row[2], 10, 64)
    		if err != nil {
    			fmt.Fprintln(os.Stderr, err)
    			os.Exit(1)
    		}
    		entries = append(entries, ledger.Entry{
    			ID:          row[0],
    			Description: row[1],
    			AmountCents: amount,
    			Refunded:    row[3] == "true",
    		})
    	}
    	s := report.Monthly(entries)
    	fmt.Printf("Total: %d\n", s.TotalCents)
    	fmt.Printf("Largest: %d\n", s.LargestCents)
    	fmt.Printf("Active entries: %d\n", s.ActiveCount)
    }
task: |
  Users report that refunded expenses are still being counted as spending.
  When an expense is marked refunded, the monthly report still includes it in
  the total, it can still show up as the largest expense, and the active-entry
  count still includes it.

  Expected behavior: a refunded entry contributes to NONE of those three
  numbers — not the total, not the largest expense, and not the active-entry
  count. Refunded entries stay in the ledger (audit history); they just must
  not be reported as spending.

  Acceptance criteria:
  - `go test ./...` passes.
  - Test coverage exists for the refunded behavior (the current tests only
    cover non-refunded entries).
  - The command-line summary reflects the same rules end to end.
expect:
  program: bash
  args:
    - "-c"
    - |
      set -euo pipefail
      go test ./... > /dev/null
      # Hidden behavioral check through the real binary: 2 active entries
      # (1200 + 3300) and one refunded 9900 that must not appear anywhere.
      d="$(mktemp -d)"
      cat > "$d/entries.csv" <<'CSV'
      a,coffee,1200,false
      b,keyboard,3300,false
      c,monitor,9900,true
      CSV
      out="$(go run ./cmd/expensetrack "$d/entries.csv")"
      grep -qx 'Total: 4500' <<<"$out"
      grep -qx 'Largest: 3300' <<<"$out"
      grep -qx 'Active entries: 2' <<<"$out"
      # The refunded rule must be locked by tests, not just implemented.
      grep -rqli 'refund' --include='*_test.go' . > /dev/null
