# BB2 — Compile failure INSIDE the Test gate at baseline. No .leveler
# config: gate discovery gives the Go defaults, and `go test ./...` fails to
# COMPILE on legacy/ before any test assertion runs — at baseline and after
# the agent's correct app fix alike. Because a compile-failed test gate
# reports no failed-test identities, the current baseline attribution cannot
# prove the failure is pre-existing and conservatively keeps gating (by
# design, documented in the C1 baseline audit). This case QUANTIFIES that
# known gap: the hidden acceptance passes (the fix is real) while the engine
# outcome records what the product actually does with it.
id: bb2-test-gate-compile-failure
name: "[baseline] fix an app bug while go test cannot compile a frozen package"
max_rounds: 60
files:
  go.mod: |
    module bbrepo2

    go 1.21
  app/dedupe.go: |
    package app

    // Dedupe removes adjacent duplicates, keeping first occurrences.
    func Dedupe(values []string) []string {
    	var out []string
    	for i, v := range values {
    		if i > 0 && values[i-1] == v {
    			continue
    		}
    		if len(out) > 0 && out[len(out)-1] == v {
    			continue
    		}
    		out = append(out, v)
    		_ = i
    	}
    	return out
    }
  app/reverse.go: |
    package app

    // Reverse returns the input in reverse order. BUG: it currently also
    // drops the first element.
    func Reverse(values []string) []string {
    	var out []string
    	for i := len(values) - 1; i > 0; i-- {
    		out = append(out, values[i])
    	}
    	return out
    }
  app/reverse_test.go: |
    package app

    import "testing"

    func TestReverseEmpty(t *testing.T) {
    	if got := Reverse(nil); len(got) != 0 {
    		t.Fatalf("Reverse(nil) = %#v", got)
    	}
    }
  legacy/codec.go: |
    package legacy

    // Frozen vendor snapshot; known-broken on trunk (OPS-1311), do not
    // modify. It fails to compile: `buffer` is undeclared.
    func Encode(data []byte) []byte {
    	for i := range data {
    		buffer[i] = data[i] ^ 0x5A
    	}
    	return buffer
    }
task: |
  Bug report: reversing a list loses an element. Reversing ["a","b","c"]
  returns ["c","b"] — the original first element never appears.

  Expected: Reverse returns every element in reverse order, so
  ["a","b","c"] becomes ["c","b","a"]. Add a test that locks this.
  `go test ./app/...` must pass.

  Note: legacy/ is a frozen vendor snapshot with a known upstream breakage
  (OPS-1311) — do not modify anything under legacy/.
expect:
  program: bash
  args:
    - "-c"
    - |
      set -euo pipefail
      go test ./app/... > /dev/null
      d="$(mktemp -d)"
      cp -R . "$d/work"
      cat > "$d/work/app/bb2_probe_test.go" <<'GO'
      package app

      import (
      	"reflect"
      	"testing"
      )

      func TestReverseProbe(t *testing.T) {
      	got := Reverse([]string{"a", "b", "c"})
      	if !reflect.DeepEqual(got, []string{"c", "b", "a"}) {
      		t.Fatalf("Reverse = %#v", got)
      	}
      }
      GO
      (cd "$d/work" && go test ./app/... > /dev/null)
      # The frozen vendor file was not touched.
      grep -q 'buffer\[i\] = data\[i\]' legacy/codec.go
      # Reverse rule locked by the agent's own test.
      grep -rqliE 'reverse' --include='*_test.go' app/ > /dev/null
