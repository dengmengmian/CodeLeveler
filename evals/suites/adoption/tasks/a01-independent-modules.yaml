    }
  src/checksum.rs: |
    /// One-byte rotating checksum: wrapping add of each byte, then XOR 0xA5.
    pub fn crc8_rot(input: &[u8]) -> u8 {
        todo!("implement in this file")
    }
  tests/spec.rs: |
    use evalcase::checksum::crc8_rot;
    use evalcase::normalize::normalize_ws;

    #[test]
    fn normalize_collapses_ws() {
        assert_eq!(normalize_ws("  a \t b\n c  "), "a b c");
    }

    #[test]
    fn checksum_is_stable() {
        assert_eq!(crc8_rot(b"ab"), crc8_rot(b"ab"));
        assert_ne!(crc8_rot(b"ab"), crc8_rot(b"ba"));
    }
task: |
