name: Documentation
description: Report missing, incorrect, or unclear documentation
title: "[Docs]: "
labels:
  - documentation
body:
  - type: input
    id: location
    attributes:
      label: Documentation location
      description: Link to the page or provide the repository file path and section.
      placeholder: "URL, file path, or section name"
    validations:
      required: true

  - type: dropdown
    id: issue-type
    attributes:
      label: Documentation issue
      options:
        - Incorrect information
        - Missing information
        - Unclear instructions
        - Broken link or example
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What needs to change?
      description: Explain what is incorrect, missing, or unclear.
    validations:
      required: true

  - type: textarea
    id: proposed-change
    attributes:
      label: Suggested improvement
      description: Describe the correction or content you would expect to find.
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add examples, screenshots, or related links if they help explain the issue.

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
