name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A newer push to the same branch/PR supersedes the run in flight: its result
# would be stale before it finished, and it holds runners the new run needs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: fmt · clippy · test (${{ matrix.os }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy

      # Caches dependencies only (the workspace's own artifacts are pruned),
      # falls back to the newest cache of an older Cargo.lock, and saves from
      # main only. Caching all of `target` made each OS entry 2–3 GiB: the set
      # overran the repository's 10 GB cache limit and evicted itself, and the
      # Windows save alone took ~8 minutes on the critical path.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux sandbox runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
          bwrap --ro-bind / / true

      # Windows confines writes with its own backend; tests assert fail-closed
      # filesystem behavior and honest capability probes.
      # rustfmt is platform-agnostic; running it on every OS triples queue
      # time for the same check. Linux is the required copy.
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Keep Windows security boundaries visible as their own required step.
      # These exercise real NTFS directory sharing/junction behavior, real
      # integrity-labelled write roots, and Job Object descendant termination
      # on the runner. `leveler-confine.exe` is the launcher the confined path
      # runs through, so it is built before anything asks for confinement — a
      # per-crate `cargo test -p ...` does not build another package's binary.
      - name: Windows security canaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build -p leveler-win-confine --all-features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p leveler-tools windows_ --all-features -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p leveler-execution windows_ --all-features -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Installer checksum canaries
        if: runner.os == 'Linux'
        run: sh packaging/scripts/test_install.sh

      # `release.yml` only runs on a tag, so a root file it packages can be
      # deleted and stay broken until someone actually wants a release. Check
      # the payload on every push.
      - name: Release payload
        if: runner.os == 'Linux'
        run: sh packaging/scripts/check_release_payload.sh

      # The remote-control surface as its own required step. It is one chain
      # across three crates — a phone, a relay nobody trusts, and a host — and a
      # break in pairing, project isolation, the approval timeout or revocation
      # should be visible here rather than buried in the workspace run that
      # follows. Unix only: the MVP host is macOS/Linux.
      - name: Remote control acceptance
        if: runner.os != 'Windows'
        run: |
          cargo test -p leveler-remote-protocol --all-features --locked
          cargo test -p leveler-remote-agent --all-features --locked
          cargo test -p leveler-relay --all-features --locked

      # Browser acceptance is opt-in, so the workspace run below cannot imply
      # it passed. Run it here against a browser each runner image already
      # has — Edge on Windows, Chrome elsewhere — so "Windows is a supported
      # platform" rests on a real CDP session, a real click and a real process
      # cleanup rather than on the crate having compiled. A runner without that
      # browser prints SKIP and stays green; it never prints PASS.
      - name: Browser acceptance (Windows · Edge)
        if: runner.os == 'Windows'
        env:
          LEVELER_BROWSER_ACCEPTANCE: edge
        run: cargo test -p leveler-browser --test acceptance --locked -- --test-threads=1 --nocapture

      - name: Browser acceptance (Chrome)
        if: runner.os != 'Windows'
        env:
          LEVELER_BROWSER_ACCEPTANCE: chrome
        run: cargo test -p leveler-browser --test acceptance --locked -- --test-threads=1 --nocapture

      - name: Test
        # --no-fail-fast: run every test binary and report ALL failures in one
        # run instead of stopping at the first failing crate (so a Windows-only
        # failure in a late crate is not hidden behind an earlier one).
        run: cargo test --workspace --all-features --locked --no-fail-fast

  # The phone client. It is Dart, so it cannot ride the Rust job. Analyze and
  # test only: CI has no simulator, and building the app needs one platform
  # toolchain per target. What this does guard is the cross-language envelope
  # conformance, which is the part a host change can silently break.
  mobile:
    name: leveler-mobile · analyze · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/leveler-mobile
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # Reads testdata/signed_envelope.golden.json from the repository root, so
      # the app and the host are checked against one answer key rather than
      # against each other's assumptions.
      - name: Test
        run: flutter test

  # Protocol contract closure for the WebUI: Rust is the source of truth
  # (schemas/ is guarded by schema_export.rs in the Rust job); this job makes
  # the OTHER half of the chain loud — schemas → generated TS. `check:protocol`
  # fails when schemas/ changed but src/types/protocol.gen.ts was not
  # regenerated, so a new ClientCommand/RuntimeEvent variant can never drift
  # silently past the web client again.
  web-ui:
    name: leveler-web UI · contract · typecheck · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/leveler-web/web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/leveler-web/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Protocol contract (schemas → generated TS)
        run: npm run check:protocol

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  supply-chain:
    name: deny · audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo-audit
        # Expires 2026-10-01. rsa is only an unreachable sqlx-mysql lockfile
        # edge; this workspace enables sqlite only (`cargo tree --target all
        # -i rsa` is empty). Remove when sqlx drops the edge or a fix ships.
        run: cargo audit --ignore RUSTSEC-2023-0071
