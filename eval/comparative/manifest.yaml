    path: evals/smoke/rust-first-even.yaml
    category: A-small-fix
    timeout_seconds: 900
    delegation_opportunity: NONE
  - id: go-normalize-email
    path: evals/core/go-normalize-email.yaml
    category: B-medium-bug
    timeout_seconds: 900
    delegation_opportunity: NONE
  - id: ts-concurrency-limit
    path: evals/core/ts-concurrency-limit.yaml
    category: B-medium-bug
    timeout_seconds: 900
    delegation_opportunity: NONE
  - id: n3-caller-propagation
    path: evals/navigation/n3-caller-propagation.yaml
    category: C-cross-file
    timeout_seconds: 1200
    delegation_opportunity: LOW
  - id: rust-area-trait
    path: evals/hard/rust-area-trait.yaml
    category: F-behavior-preserving
    timeout_seconds: 900
    delegation_opportunity: NONE
  - id: c4-r2-test-recovery
    path: evals/recovery/c4-r2-test-recovery.yaml
