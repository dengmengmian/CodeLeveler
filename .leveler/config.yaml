# Verification commands used by repository contract tests.
# Mandatory contributor rules delivered to the model.
rules:
  always_delivered:
    - 核心原则
    - 任务与授权
    - TDD 与调试
    - 验证策略
    - 架构门禁
    - Permission Mode 产品契约
    - 工程与安全
    - 专项工作
    - 输出与完成
  budget_bytes: 16000

verify:
  format:
    program: cargo
    args: ["fmt", "--all", "--", "--check"]
  build:
    program: cargo
    args: ["check", "--workspace", "--all-features", "--locked"]
  test:
    program: cargo
    args:
      - test
      - --workspace
      - --all-features
      - --locked
      # Needs nested confinement (its tests start sandboxes of their own).
      - --exclude
      - leveler-execution
      # Needs nested confinement: command tools execute confined children.
      - --exclude
      - leveler-tools
      # Need a daemon/control plane, a real process tree, or both.
      - --exclude
      - leveler-agent
      - --exclude
      - leveler-app
      - --exclude
      - leveler-cli
      - --exclude
      - leveler-remote-agent
