# CodeLeveler's own Agent Verification Contract.
#
# This repository keeps a confined verification contract for explicit check
# workflows. It does not decide task completion. The full suite remains the
# operator/CI/release gate.
#
# This is a Gate / Release contract, not the default per-task verification.
# Ordinary development uses Minimum Sufficient Verification (AGENTS.md 验证策略):
# check and test the affected package first and stop once the change is covered.
# Run this contract only for explicit full verification, commit/PR gates, or
# release.
#
# Layer 1 — this contract. Every command here runs confined to the workspace,
# the per-command scratch and the tool cache: no nested sandbox, no daemon or
# control-plane socket, no write to the user's home.
#
# ── Rule delivery ────────────────────────────────────────────────────────────
# Which project rules are MANDATORY is host data, not a model decision. Entries
# match each self-contained section heading or id; naming a parent heading does
# not select its child headings. Mandatory sections get the byte budget first,
# so an optional section can never displace one. `budget_bytes` is the ONE
# ceiling for every rule document this request delivers (UTF-8 bytes of prompt
# text), not a per-file allowance. Anything not delivered is named in the prompt
# with its source and section id, and `read_project_rules` can return it, but no
# mandatory rule depends on the model choosing to call that tool.
#
# The repository rule-delivery test checks that the whole document and every
# entry reach the model under this policy.
rules:
  always_delivered:
    - 核心原则
    - 任务与授权
    - TDD 与调试
    - 验证策略
    - 架构门禁
    - Permission Mode 产品契约
    - 工程与安全
    - 专项工作
    - 输出与完成
  budget_bytes: 16000
#
# Layer 2 — `cargo test --workspace --all-features --locked --no-fail-fast`
# (what CI runs). It additionally contains tests that require host capabilities
# the sandbox deliberately does not grant. macOS seatbelt and Linux bubblewrap
# cannot nest, so a test that starts a sandbox of its own fails with
# `sandbox_apply: Operation not permitted`; daemon and user-shell tests need a
# real socket and process tree. Those are excluded below, per crate.
#
# The exclusions are measured, not guessed: each excluded crate owns at least
# one test that fails under confinement. Adding a crate here to make a run
# green is not a verification decision — it is deleting evidence.
verify:
  format:
    program: cargo
    args: ["fmt", "--all", "--", "--check"]
  build:
    program: cargo
    args: ["check", "--workspace", "--all-features", "--locked"]
  test:
    program: cargo
    args:
      - test
      - --workspace
      - --all-features
      - --locked
      # Needs nested confinement (its tests start sandboxes of their own).
      - --exclude
      - leveler-execution
      # Needs nested confinement: command tools execute confined children.
      - --exclude
      - leveler-tools
      # Need a daemon/control plane, a real process tree, or both.
      - --exclude
      - leveler-agent
      - --exclude
      - leveler-app
      - --exclude
      - leveler-cli
      - --exclude
      - leveler-remote-agent
