# Verification commands used by repository contract tests.
verify:
  format:
    program: cargo
    args: ["fmt", "--all", "--", "--check"]
  build:
    program: cargo
    args: ["check", "--workspace", "--all-features", "--locked"]
  test:
    program: cargo
    args:
      - test
      - --workspace
      - --all-features
      - --locked
      # Needs nested confinement (its tests start sandboxes of their own).
      - --exclude
      - leveler-execution
      # Needs nested confinement: command tools execute confined children.
      - --exclude
      - leveler-tools
      # Need a daemon/control plane, a real process tree, or both.
      - --exclude
      - leveler-agent
      - --exclude
      - leveler-app
      - --exclude
      - leveler-cli
      - --exclude
      - leveler-remote-agent
