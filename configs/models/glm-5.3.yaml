# GLM-5.3 — flagship text model on GLM Coding Plan.
# Docs: https://docs.bigmodel.cn/cn/guide/models/text/glm-5.3 (read 2026-09-20)
# Official limits: 1M context, 128K maximum output. Thinking is always enabled;
# reasoning_effort supports low/high/max and defaults to max.
id: glm-5.3
provider: bigmodel
model_id: glm-5.3
protocol: openai_chat
capabilities:
  streaming: true
  tool_calling: true
  parallel_tool_calls: false
  structured_output: true
  reasoning: true
  vision: false
reasoning:
  style: thinking_flag
  supported_efforts: [low, high, max]
  default_effort: max
  # Preserved thinking: the model keeps its earlier turns' reasoning instead of
  # discarding it between requests. The wire spelling is
  # `thinking: {type: "enabled", clear_thinking: false}`; without it the
  # endpoint's default clears prior thinking and a tool loop loses the chain it
  # was built to keep. Source: https://docs.z.ai/guides/capabilities/thinking-mode
  preserved_thinking: true
  # GLM-5.3 and GLM-5.3-FLASH always think: the thinking parameter cannot turn
  # it off, so `off` is not offered for this route. Source: the same page.
  forced: true
limits:
  context_window: 1048576
  # Quality bound: where long-context recall is expected to degrade.
  # Declared facts only — never a runtime cap, and no longer the fold
  # threshold by itself: the effective threshold is
  # `min(reliable_context, soft_percent% × (context_window - max_output_tokens
  # - headroom))`, where the soft share defaults to 95%.
  reliable_context: 786432
  max_output_tokens: 131072
  max_tool_schema_bytes: 32768
  max_parallel_tool_calls: 1
# No `compatibility:` block: nothing here overrides a default. Everything this
# route needs beyond the model facts is resolved from the wire family.
#
# The replay contract is NOT declared. GLM's interleaved thinking with tools
# requires the thinking blocks to be preserved and returned with the
# tool results, and preserved thinking requires the complete, unmodified
# `reasoning_content` of every historical assistant turn; a turn that produced
# none omits the key (unlike DeepSeek). That is a property of the wire family,
# resolved by `ReasoningReplayContract::for_route`; declaring it again here
# would be a second source of the same fact. Use
# `reasoning_replay_scope` / `reasoning_content_key_required` only to override
# a deployment whose behaviour differs from the family default.
# Source: https://docs.z.ai/guides/capabilities/thinking-mode
