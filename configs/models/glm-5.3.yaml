# GLM-5.3 — flagship text model on GLM Coding Plan.
# Docs: https://docs.bigmodel.cn/cn/guide/models/text/glm-5.3 (read 2026-09-20)
# Official limits: 1M context, 128K maximum output. Thinking is always enabled;
# reasoning_effort supports low/high/max and defaults to max.
id: glm-5.3
provider: bigmodel
model_id: glm-5.3
protocol: openai_chat
capabilities:
  streaming: true
  tool_calling: true
  parallel_tool_calls: false
  structured_output: true
  reasoning: true
  vision: false
reasoning:
  style: thinking_flag
  supported_efforts: [low, high, max]
  default_effort: max
limits:
  context_window: 1048576
  # Product-side folding budget, not a vendor quality claim.
  reliable_context: 786432
  max_output_tokens: 131072
  max_tool_schema_bytes: 32768
  max_parallel_tool_calls: 1
compatibility:
  synthesize_tool_call_ids: true
  drop_unsupported_fields: true
