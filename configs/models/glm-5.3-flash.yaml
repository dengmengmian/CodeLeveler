# GLM-5.3-Flash — native multimodal model on GLM Coding Plan.
# Docs: https://docs.bigmodel.cn/cn/guide/models/vlm/glm-5.3-flash (read 2026-09-20)
# Official limits: 1M context, 128K maximum output. Text parameters match GLM-5.3;
# image input is supported. CodeLeveler's vision flag describes image input only.
id: glm-5.3-flash
provider: bigmodel
model_id: glm-5.3-flash
protocol: openai_chat
capabilities:
  streaming: true
  tool_calling: true
  parallel_tool_calls: false
  structured_output: true
  reasoning: true
  vision: true
reasoning:
  style: thinking_flag
  supported_efforts: [low, high, max]
  default_effort: max
  # Preserved thinking: the model keeps its earlier turns' reasoning instead of
  # discarding it between requests. The wire spelling is
  # `thinking: {type: "enabled", clear_thinking: false}`; without it the
  # endpoint's default clears prior thinking and a tool loop loses the chain it
  # was built to keep. Source: https://docs.z.ai/guides/capabilities/thinking-mode
  preserved_thinking: true
  # GLM-5.3 and GLM-5.3-FLASH always think: the thinking parameter cannot turn
  # it off, so `off` is not offered for this route. Source: the same page.
  forced: true
limits:
  context_window: 1048576
  # Quality bound: where long-context recall is expected to degrade. The
  # effective fold threshold also reserves `max_output_tokens`.
  reliable_context: 786432
  max_output_tokens: 131072
  max_tool_schema_bytes: 32768
  max_parallel_tool_calls: 1
# No `compatibility:` block: nothing here overrides a default.
#
# The replay contract is NOT declared: the GLM wire family's tool-loop
# requirement is resolved from the model id. Use
# `reasoning_replay_scope` / `reasoning_content_key_required` only to override
# a deployment whose behaviour differs from the family default. While
# `preserved_thinking = true` the endpoint requires the retained thinking back,
# so a replay opt-out is refused at startup; set `preserved_thinking = false`
# (which sends `clear_thinking: true`) for a route that neither preserves nor
# replays.
# Source: https://docs.z.ai/guides/capabilities/thinking-mode
