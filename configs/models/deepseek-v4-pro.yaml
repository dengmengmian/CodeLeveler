# DeepSeek-V4-Pro — https://api-docs.deepseek.com/zh-cn/quick_start/pricing
# Context 1M, max output 384K. Thinking on; effort max (wire: low|high|max).
# Price (CNY / MTok, cache miss): input 3, output 6. pricing field is USD
# (~7.2 CNY/USD): 0.4167 / 0.8333.
id: deepseek-v4-pro
provider: deepseek
model_id: deepseek-v4-pro
protocol: openai_chat
capabilities:
  streaming: true
  tool_calling: true
  parallel_tool_calls: false
  structured_output: true
  reasoning: true
  vision: false
reasoning:
  style: thinking_flag
  effort: max
limits:
  context_window: 1048576
  reliable_context: 786432
  max_output_tokens: 393216
  max_tool_schema_bytes: 32768
  max_parallel_tool_calls: 1
pricing:
  input_usd_per_mtok: 0.4167
  output_usd_per_mtok: 0.8333
compatibility:
  synthesize_tool_call_ids: true
  drop_unsupported_fields: true
