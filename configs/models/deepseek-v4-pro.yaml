id: deepseek-v4-pro
provider: deepseek
model_id: deepseek-v4-pro
protocol: openai_chat
capabilities:
  streaming: true
  tool_calling: true
  parallel_tool_calls: false
  structured_output: true
  reasoning: true
  vision: false
reasoning:
  style: thinking_flag
  effort: high
limits:
  context_window: 1048576
  reliable_context: 786432
  max_output_tokens: 65536
  max_tool_schema_bytes: 32768
  max_parallel_tool_calls: 1
compatibility:
  synthesize_tool_call_ids: true
  drop_unsupported_fields: true
  # DeepSeek rejects a forced tool_choice while thinking (HTTP 400), and
  # thinking is its server-side default — the adapter must explicitly disable
  # thinking on forced-choice requests. Measured 2026-08-07.
  thinking_supports_forced_tool_choice: false
  # DeepSeek thinking mode validates assistant tool-call ids: an id it does
  # not recognize as its own thinking-mode generation (e.g. one produced in a
  # thinking-disabled round) is rejected unless the message echoes
  # `reasoning_content` (captured text, or "" when none). Measured 2026-08-07.
  passback_reasoning_content: true
