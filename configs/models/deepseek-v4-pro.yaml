# DeepSeek-V4-Pro — https://api-docs.deepseek.com/zh-cn/quick_start/pricing
# Context 1M, max output 384K.
# Reasoning (https://api-docs.deepseek.com/guides/thinking_mode/ 2026-08-18):
#   native wire: low | high | max
#   provider default: high (thinking on)
#   CodeLeveler default: max
# Pricing is intentionally omitted: DeepSeek's peak/off-peak and cache rates
# are time-dependent and cannot be represented by the static pricing schema.
id: deepseek-v4-pro
provider: deepseek
model_id: deepseek-v4-pro
protocol: openai_chat
capabilities:
  streaming: true
  tool_calling: true
  parallel_tool_calls: true
  structured_output: true
  reasoning: true
  vision: false
reasoning:
  style: thinking_flag
  supported_efforts: [low, high, max]
  default_effort: max
limits:
  context_window: 1048576
  reliable_context: 786432
  max_output_tokens: 393216
  max_tool_schema_bytes: 32768
  max_parallel_tool_calls: 0
compatibility:
  # DeepSeek rejects a forced tool_choice while thinking (HTTP 400), and
  # thinking is its server-side default — the adapter must explicitly disable
  # thinking on forced-choice requests. Measured 2026-08-07.
  thinking_supports_forced_tool_choice: false
  # A tool-bearing request must replay the FULL `reasoning_content` of every
  # historical assistant turn still in the active context — not only tool-call
  # turns; stripping or truncating a retained turn's reasoning is not legal.
  # The scope is `when_tools_present`: tool-free requests keep the legacy wire.
  # The legal lever is the context lifecycle, which removes whole old turns.
  reasoning_replay_scope: when_tools_present
  # DeepSeek validates the key's presence on a replayed assistant turn that
  # produced no reasoning; the empty string satisfies it (measured 2026-08-07).
  reasoning_content_key_required: true
