# DeepSeek Flash — https://api-docs.deepseek.com/zh-cn/quick_start/pricing
# Replaces the pre-release `deepseek-v4-flash` config. Existing user config
# should migrate to `deepseek/deepseek-flash`; the provider wire id is now
# `deepseek-flash`.
# Context 1M, max output 384K.
# Reasoning: native wire low | high | max; CodeLeveler default max.
# Pricing is intentionally omitted: DeepSeek's peak/off-peak and cache rates
# are time-dependent and cannot be represented by the static pricing schema.
id: deepseek-flash
provider: deepseek
model_id: deepseek-flash
protocol: openai_chat
capabilities:
  streaming: true
  tool_calling: true
  parallel_tool_calls: true
  structured_output: true
  reasoning: true
  vision: true
reasoning:
  style: thinking_flag
  supported_efforts: [low, high, max]
  default_effort: max
limits:
  context_window: 1048576
  reliable_context: 786432
  max_output_tokens: 393216
  max_tool_schema_bytes: 32768
  max_parallel_tool_calls: 0
compatibility:
  thinking_supports_forced_tool_choice: false
  # The replay contract is NOT declared here: DeepSeek's thinking mode requires
  # a tool-bearing request to replay the full reasoning of every historical
  # assistant turn still in active context, and to carry the `reasoning_content`
  # key (empty string) on a turn that produced none. That is a property of the
  # wire family, resolved by `ReasoningReplayContract::for_route`, so writing it
  # again here would be a second source of the same fact. Declare
  # `reasoning_replay_scope` / `reasoning_content_key_required` only to override
  # a deployment whose behaviour differs from the family default.
