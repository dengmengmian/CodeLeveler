# DeepSeek Flash — https://api-docs.deepseek.com/zh-cn/quick_start/pricing
# Replaces the pre-release `deepseek-v4-flash` config. Existing user config
# should migrate to `deepseek/deepseek-flash`; the provider wire id is now
# `deepseek-flash`.
# Context 1M, max output 384K.
# Reasoning: native wire low | high | max; CodeLeveler default max.
# Pricing is intentionally omitted: DeepSeek's peak/off-peak and cache rates
# are time-dependent and cannot be represented by the static pricing schema.
id: deepseek-flash
provider: deepseek
model_id: deepseek-flash
protocol: openai_chat
capabilities:
  streaming: true
  tool_calling: true
  parallel_tool_calls: true
  structured_output: true
  reasoning: true
  vision: true
reasoning:
  style: thinking_flag
  supported_efforts: [low, high, max]
  default_effort: max
limits:
  context_window: 1048576
  reliable_context: 786432
  max_output_tokens: 393216
  max_tool_schema_bytes: 32768
  max_parallel_tool_calls: 0
compatibility:
  synthesize_tool_call_ids: true
  drop_unsupported_fields: true
  thinking_supports_forced_tool_choice: false
  passback_reasoning_content: true
