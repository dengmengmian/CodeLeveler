# Kimi K3 — flagship coding model (Kimi Code model id: k3).
# Docs: https://www.kimi.com/code/docs/kimi-code/models
# Context up to 1M (Allegretto+); Moderato caps at 256k.
# Reasoning (https://www.kimi.com/code/docs/kimi-code/models 2026-08-18):
#   native: low | high | max
#   provider default: high (null → high; unknown → HTTP 400)
#   CodeLeveler default: max
# Thinking is always on and the route takes no `thinking` field: a request that
# disables thinking is answered by K2.8 Preview (a different, no-thinking
# model), so the route offers no `off` level rather than silently changing
# model. Preservation is unconditional, so every historical assistant message's
# `reasoning_content` is replayed on every request — see
# ReasoningReplayContract.
id: k3
provider: kimi
model_id: k3
protocol: openai_chat
capabilities:
  streaming: true
  tool_calling: true
  parallel_tool_calls: true
  structured_output: true
  reasoning: true
  vision: true
reasoning:
  style: open_ai_effort
  supported_efforts: [low, high, max]
  default_effort: max
limits:
  context_window: 1048576
  reliable_context: 786432
  max_output_tokens: 65536
  max_tool_schema_bytes: 32768
  max_parallel_tool_calls: 16
compatibility:
  # Kimi Coding endpoints reject caller-chosen temperature (only default allowed).
  supports_temperature: false
