# Kimi K3.1 Pro Highspeed — the same model at 2–3× output speed (≈2× quota).
# Docs: https://www.kimi.com/code/docs/kimi-code/models (read 2026-10-27)
#       https://platform.kimi.ai/docs/guide/kimi-k3-1-pro-quickstart
# Model id: k3.1-pro-highspeed. 1M context on the tiers that unlock it.
# Same protocol as `k3.1-pro`: `reasoning_effort` low | high | max, no
# `thinking` field, thinking cannot be disabled, and preservation is
# unconditional. Only the output speed differs.
id: k3.1-pro-highspeed
provider: kimi
model_id: k3.1-pro-highspeed
protocol: openai_chat
capabilities:
  streaming: true
  tool_calling: true
  parallel_tool_calls: true
  structured_output: true
  reasoning: true
  vision: true
reasoning:
  style: open_ai_effort
  supported_efforts: [low, high, max]
  # Provider default is `high` on the Kimi Code endpoint and `max` on the API
  # platform; CodeLeveler's own stated default is `max`, matching the rest of
  # the Kimi coding catalog.
  default_effort: max
limits:
  context_window: 1048576
  reliable_context: 786432
  # The same model and the same documented completion limit as `k3.1-pro`.
  max_output_tokens: 131072
  max_tool_schema_bytes: 32768
  max_parallel_tool_calls: 16
compatibility:
  supports_temperature: false
