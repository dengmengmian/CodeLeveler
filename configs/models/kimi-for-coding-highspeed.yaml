# Kimi K2.7 Code HighSpeed — same coding ability, ~5–6× output speed (3× quota).
# Model id: kimi-for-coding-highspeed. Allegretto+ membership required.
# Docs: https://www.kimi.com/code/docs/kimi-code/models (read 2026-09-17)
id: kimi-for-coding-highspeed
provider: kimi
model_id: kimi-for-coding-highspeed
protocol: openai_chat
capabilities:
  streaming: true
  tool_calling: true
  parallel_tool_calls: true
  structured_output: true
  reasoning: true
  # Officially 图片、视频. CodeLeveler models image input only, so `vision` says
  # nothing about video: that input has no path into a request from here.
  vision: true
reasoning:
  # Thinking is always ON; the docs list no support_efforts for this id.
  # No effort knob — do not invent a CodeLeveler default.
  style: none
limits:
  context_window: 262144
  reliable_context: 196608
  max_output_tokens: 32768
  max_tool_schema_bytes: 32768
  max_parallel_tool_calls: 16
compatibility:
  synthesize_tool_call_ids: true
  drop_unsupported_fields: true
  supports_temperature: false
