name: leveler_mobile
description: Remote control for a CodeLeveler machine you own.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Ed25519 and SHA-256. The signing scheme is fixed by the host's protocol, so
  # this is the one dependency the security of the app rests on.
  cryptography: ^2.7.0
  # Keychain / EncryptedSharedPreferences for the device key and tokens.
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  flutter_markdown_plus: ^1.0.12
  mobile_scanner: ^7.4.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  # Drives the app on a real simulator against a real host; see
  # scripts/simulator_pairing.sh.
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
