<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<title>CodeLeveler</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="home">
<div id="app-frame" class="app-frame">
  <aside id="sidebar" class="sidebar" aria-label="导航">
    <div class="sidebar-topstrip">
      <button id="sidebar-toggle" class="icon-button sidebar-toggle" type="button" aria-label="收起侧边栏" data-tooltip="收起侧边栏" data-keys="⌥ ⌘ B"></button>
    </div>
    <div class="sidebar-brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-identity">
        <span class="brand-name">CodeLeveler</span>
        <span class="brand-version" id="brand-version"></span>
      </span>
    </div>
    <button id="new-session" class="new-session" type="button" aria-label="新建会话">
      <span class="new-session-content"></span>
      <span class="new-session-shortcut"><kbd>⌘</kbd><kbd>N</kbd></span>
    </button>
    <nav class="sidebar-panels" aria-label="全局面板">
      <button id="nav-plugins" class="panel-row" type="button" data-panel="plugins"></button>
      <button id="nav-automation" class="panel-row" type="button" data-panel="automation"></button>
    </nav>
    <div class="sidebar-workspaces">
      <div class="workspace-section-head">
        <span class="section-label">工作区</span>
        <div class="section-actions">
          <button id="session-search" class="icon-button" type="button" aria-label="搜索会话" data-tooltip="搜索会话" data-keys="⌘ F"></button>
          <button id="view-options" class="icon-button" type="button" aria-label="视图选项" data-tooltip="视图选项"></button>
          <button id="add-workspace" class="icon-button" type="button" aria-label="添加工作区" data-tooltip="添加工作区"></button>
        </div>
      </div>
      <div id="workspace-list" class="workspace-list" role="tree" aria-label="工作区与会话"></div>
    </div>
    <div class="sidebar-footer">
      <button id="account-menu" class="account-row" type="button" aria-label="账号菜单">
        <span class="account-icon"></span>
        <span class="account-label">更多</span>
      </button>
    </div>
  </aside>

  <main id="main" class="main">
    <div id="leading-seat" class="leading-seat" hidden>
      <button id="leading-toggle" class="icon-button" type="button" aria-label="打开侧边栏" data-tooltip="打开侧边栏" data-keys="⌥ ⌘ B"></button>
      <button id="leading-new" class="icon-button" type="button" aria-label="新建会话" data-tooltip="新建会话" data-keys="⌘ N"></button>
    </div>
    <button id="floating-right-toggle" class="icon-button floating-right-toggle" type="button" aria-label="打开右侧边栏" data-tooltip="打开侧边栏" data-keys="⌥ ⌘ B"></button>

    <header id="conversation-header" class="conversation-header" hidden>
      <div class="conversation-head-row">
        <div class="conversation-heading">
          <nav id="header-crumbs" class="header-crumbs" aria-label="会话层级">
            <h1 id="conversation-title"></h1>
          </nav>
          <span id="header-preset" class="header-preset">标准模式</span>
          <div id="header-session-actions" class="header-session-actions"></div>
          <span id="conversation-status" class="conversation-status" role="status"></span>
        </div>
        <div class="header-actions">
          <div id="open-in-app" class="header-open-in-app" hidden></div>
          <button id="header-schedule" class="icon-button" type="button" aria-label="提醒" data-tooltip="提醒" aria-haspopup="dialog" aria-expanded="false"></button>
          <button id="header-more" class="icon-button" type="button" aria-label="更多操作" data-tooltip="更多操作" aria-haspopup="menu" aria-expanded="false"></button>
          <button id="header-right-toggle" class="icon-button" type="button" aria-label="打开右侧边栏" data-tooltip="打开侧边栏" data-keys="⌥ ⌘ B"></button>
        </div>
      </div>
      <div id="view-tabs" class="view-tabs" role="tablist" aria-label="会话视图" hidden>
        <button class="view-tab" type="button" role="tab" data-view="chat" aria-selected="true">对话</button>
        <button class="view-tab" type="button" role="tab" data-view="trajectory" aria-selected="false">轨迹</button>
      </div>
    </header>

    <div id="find-bar" class="find-bar" hidden>
      <span class="find-icon"></span>
      <input id="find-input" type="search" placeholder="搜索对话内容" aria-label="搜索对话内容" autocomplete="off">
      <span id="find-count" class="find-count" role="status">0 / 0</span>
      <button id="find-prev" class="icon-button" type="button" aria-label="上一个匹配" data-tooltip="上一个匹配" data-keys="⇧ Enter"></button>
      <button id="find-next" class="icon-button" type="button" aria-label="下一个匹配" data-tooltip="下一个匹配" data-keys="Enter"></button>
      <button id="find-close" class="icon-button" type="button" aria-label="关闭搜索"></button>
    </div>

    <div id="error-banner" class="error-banner" role="alert" hidden></div>

    <div id="conversation-scroll" class="conversation-scroll">
      <div id="conversation" class="conversation" aria-label="对话"></div>
    </div>
    <div id="turn-rail" class="turn-rail" role="navigation" aria-label="轮次导航" hidden></div>
    <button id="scroll-bottom" class="scroll-bottom" type="button" aria-label="回到底部" data-tooltip="回到底部" hidden></button>

    <div id="trajectory-root" class="trajectory-root" aria-label="轨迹" hidden></div>

    <div id="entry-page" class="entry-page" hidden></div>

    <div id="composer-seat" class="composer-seat">
      <div id="takeover" class="takeover" hidden></div>
      <div id="composer-stack" class="composer-stack">
        <div id="home-hero" class="home-hero">
          <span id="hero-mark" class="hero-mark" aria-hidden="true"></span>
          <span class="hero-title">探索未至之境</span>
          <span class="preview-badge">预览版</span>
        </div>
        <div id="home-context" class="home-context">
          <button id="workspace-picker" class="context-trigger" type="button" aria-label="选择工作区"></button>
          <button id="preset-picker" class="context-trigger" type="button" aria-label="选择 Agent 预设" data-tooltip="选择新任务使用的 Agent 预设"></button>
        </div>
        <div id="composer-docks" class="composer-docks"></div>
        <div id="composer-card" class="composer-card">
          <div class="composer-input-wrap">
            <textarea id="message" class="composer-input" rows="1" placeholder="描述你想要构建的内容, / 调用指令, @ 文件或对话" aria-label="消息"></textarea>
          </div>
          <div id="attachment-chips" class="attachment-chips" aria-label="待发送附件" hidden></div>
          <div class="composer-row">
            <button id="attachment-add" class="composer-round" type="button" aria-label="添加文件或调用指令" data-tooltip="添加文件或调用指令"></button>
            <button id="permission-picker" class="composer-trigger" type="button" aria-label="访问模式"></button>
            <button id="plan-mode" class="composer-trigger plan-mode" type="button" aria-label="计划模式" data-tooltip="计划模式（未接入）"></button>
            <div class="composer-spacer"></div>
            <button id="model-picker" class="composer-trigger model-trigger" type="button" aria-haspopup="menu"></button>
            <button id="send" class="send-button" type="button" aria-label="发送"></button>
            <button id="stop" class="send-button stop-button" type="button" aria-label="停止" data-tooltip="停止当前回合" hidden></button>
          </div>
        </div>
        <div id="context-stats" class="context-stats" hidden></div>
        <p id="composer-error" class="composer-error" role="alert" hidden></p>
      </div>
    </div>
  </main>

  <div id="right-resize" class="right-resize" role="separator" aria-label="调整右侧边栏宽度" aria-orientation="vertical" tabindex="0" hidden></div>
  <aside id="rightbar" class="rightbar" aria-label="右侧边栏" hidden>
    <div id="right-panes" class="right-panes"></div>
  </aside>
</div>

<dialog id="settings-dialog" class="settings-modal" aria-labelledby="settings-title">
  <div class="settings-shell">
    <div class="settings-body">
      <nav class="settings-nav" aria-label="设置分类">
        <h2 id="settings-title">设置</h2>
        <div id="settings-nav-list" class="settings-nav-list"></div>
      </nav>
      <div class="settings-main">
        <header class="settings-head">
          <div class="settings-head-actions">
            <button id="settings-open-config" class="button ghost small" type="button">打开配置文件</button>
            <button id="settings-close" class="icon-button" type="button" aria-label="关闭"></button>
          </div>
        </header>
        <section id="settings-content" class="settings-content" aria-label="设置内容"></section>
      </div>
    </div>
  </div>
</dialog>

<script type="module" src="renderer.mjs"></script>
</body>
</html>
